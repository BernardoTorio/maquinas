<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test avanzado 2 · Máquinas Eléctricas 2MB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --card:#ffffff; --ink:#1a1a1a; --muted:#56606b; --line:#cfd6de; --bar:#6A9A1F;
  --green:#1F4E79; --green-soft:#e3ecf6; --red:#c0392b; --red-soft:#fbe4e1;
  --ok:#2e7d32; --ok-soft:#e3f3e4; --yellow:#b7860b; --yellow-soft:#fdf5dc;
  --blue:#1f5fbf; --btn:#e9eef3; --on-green:#fff; --shadow:0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#15191e; --card:#1f252c; --ink:#eef1f4; --muted:#a9b3bd; --line:#36404b; --bar:#6A9A1F;
  --green:#8EC1F0; --green-soft:#26323f; --red:#ef6b5d; --red-soft:#3a201d;
  --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
  --blue:#7aa7f0; --btn:#26323f; --on-green:#0f1a26; --shadow:0 1px 3px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191e; --card:#1f252c; --ink:#eef1f4; --muted:#a9b3bd; --line:#36404b; --bar:#6A9A1F;
    --green:#8EC1F0; --green-soft:#26323f; --red:#ef6b5d; --red-soft:#3a201d;
    --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
    --blue:#7aa7f0; --btn:#26323f; --on-green:#0f1a26; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:17px;line-height:1.45}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--bar);position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}
.back{border:1px solid var(--line);background:var(--btn);color:var(--ink);padding:6px 12px;border-radius:8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.back:hover{border-color:var(--green)}
.crumbs{font-size:14px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--green);text-decoration:none}
.crumbs b{color:var(--ink)}
.theme{border:1px solid var(--line);background:var(--btn);color:var(--ink);width:38px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:26px;margin:6px 0 2px;font-weight:700}
h1 span{color:var(--green)}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.box{border-left:5px solid var(--green);background:var(--green-soft);border-radius:8px;padding:10px 14px;margin:12px 0}
.box .lbl{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--green);display:block;margin-bottom:2px}
.box.why{border-color:var(--yellow);background:var(--yellow-soft)}
.box.why .lbl{color:var(--yellow)}
fieldset{border:none;padding:0;margin:0 0 14px}
legend{font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip>span{display:inline-block;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--btn);cursor:pointer;font-size:15px;user-select:none}
.chip input:checked+span{border-color:var(--green);background:var(--green-soft);font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
.cnt{color:var(--muted);font-size:13px}
.go{background:var(--green);color:var(--on-green);border:none;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.go.ghost{background:var(--btn);color:var(--ink);border:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--btn)}
.tag.d{border-color:var(--red);color:var(--red)}
.score{margin-left:auto;font-weight:700;color:var(--ink)}
.qtext{font-size:19px;font-weight:700;margin:6px 0 12px}
.qn{color:var(--green)}
figure{margin:0 0 12px;text-align:center}
figure img{max-width:100%;max-height:520px;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line);cursor:zoom-in}
figcaption{font-size:14px;color:var(--muted);font-style:italic;margin-top:4px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--btn);font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.verdict{font-weight:700;font-size:18px;margin-top:12px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--red)}
.nav{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.big{font-size:44px;font-weight:700;color:var(--green);margin:0}
.review{border-top:1px solid var(--line);padding:12px 0}
.review .rq{font-weight:700}
.review .ra{color:var(--ok);font-weight:700}
.review .ry{color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:16px}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px;padding:8px}
@media (max-width:560px){body{font-size:16px}.qtext{font-size:17px}h1{font-size:22px}.crumbs{font-size:12px}}
</style>
</head>

<script>
const DATA = [{"tema": "T1", "t": "T1 · punto 1.1 Magnetismo, imán, electroimán y electromagnetismo", "dif": "M", "tipo": "CON", "q": "Tenemos un imán permanente y un electroimán que atraen con la misma fuerza. ¿Qué puede hacer solo el electroimán?", "ok": "Invertir sus polos sin tocarlo", "d": ["Atraer al hierro sin gastar energía", "Atraer también al cobre y al aluminio", "Tener un polo norte y un polo sur"], "j": "Al electroimán le basta con invertir la corriente. El imán permanente atrae sin gastar energía y también tiene N y S.", "img": null, "cap": "", "n": 1, "o": [0, 1, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.1 Magnetismo, imán, electroimán y electromagnetismo", "dif": "D", "tipo": "CON", "q": "Queremos levantar chatarra, soltarla cuando queramos y poder hacer la fuerza mayor o menor. ¿Qué usamos y cómo regulamos la fuerza?", "ok": "Un electroimán, variando su corriente", "d": ["Un imán de neodimio, acercándolo más o menos", "Un electroimán, cambiando el sentido de la corriente", "Un imán de ferrita, partiéndolo en trozos"], "j": "Solo el electroimán se puede apagar y regular, y se regula con la corriente. Cambiar el sentido invierte los polos, pero no cambia la fuerza.", "img": null, "cap": "", "n": 2, "o": [2, 1, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.1 Magnetismo, imán, electroimán y electromagnetismo", "dif": "M", "tipo": "CON", "q": "¿Cuál de estas frases es FALSA?", "ok": "Un imán de neodimio se puede apagar si hace falta", "d": ["Un electroimán deja de atraer al cortar la corriente", "Un electroimán puede ser más débil que un imán", "Un contactor funciona con un electroimán, no con un imán"], "j": "Un imán permanente no se puede apagar ni regular. Los de neodimio son muy potentes, a veces más que un electroimán.", "img": null, "cap": "", "n": 3, "o": [0, 2, 3, 1]}, {"tema": "T1", "t": "T1 · punto 1.2 Campo magnético y flujo magnético", "dif": "M", "tipo": "CON", "q": "Acercamos una brújula a un imán por dos sitios: pegada al polo y a 30 cm. ¿Dónde hay campo magnético?", "ok": "En los dos, más fuerte junto al polo", "d": ["Solo junto al polo: lejos no hay campo", "Igual en los dos: es el mismo imán", "Solo dentro del imán, donde hay flujo"], "j": "El campo es la zona alrededor del imán donde se notan fuerzas. Donde las líneas van más juntas (cerca de los polos), es más fuerte.", "img": null, "cap": "", "n": 4, "o": [1, 0, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.2 Campo magnético y flujo magnético", "dif": "M", "tipo": "CON", "q": "Un cable recto lleva corriente. Lo enrollamos en forma de bobina, con la misma corriente. ¿Qué cambia?", "ok": "La bobina concentra el campo en su interior", "d": ["Solo la bobina crea campo; el cable recto, no", "El cable recto crea más campo que la bobina", "Nada: la corriente es la misma en los dos"], "j": "Cualquier conductor con corriente crea campo. La bobina lo que hace es concentrarlo.", "img": null, "cap": "", "n": 5, "o": [0, 2, 1, 3]}, {"tema": "T1", "t": "T1 · punto 1.2 Campo magnético y flujo magnético", "dif": "M", "tipo": "CON", "q": "En un trafo, el flujo que llega al secundario baja a la mitad. ¿Qué le pasa al secundario?", "ok": "Da menos tensión: le llega menos flujo", "d": ["Da la misma tensión, pero con menos corriente", "Da más tensión, para compensar", "Nada: al secundario le llega corriente, no flujo"], "j": "Lo que viaja del primario al secundario es flujo. Si el flujo no llega, la máquina no rinde.", "img": null, "cap": "", "n": 6, "o": [2, 3, 0, 1]}, {"tema": "T1", "t": "T1 · punto 1.3 Inducción magnética", "dif": "M", "tipo": "CON", "q": "Dos núcleos llevan el mismo flujo: uno tiene 10 cm² de sección y el otro 5 cm². ¿Cuál tiene el hierro más «cargado»?", "ok": "El de 5 cm²: las líneas van más juntas", "d": ["El de 10 cm²: tiene más hierro trabajando", "Los dos igual: llevan el mismo flujo", "Ninguno: eso depende solo de la corriente"], "j": "Las mismas líneas en menos superficie van más apretadas: más inducción.", "img": null, "cap": "", "n": 7, "o": [3, 1, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.3 Inducción magnética", "dif": "M", "tipo": "CON", "q": "El núcleo de un trafo tiene que trabajar a 1,2 T. ¿Qué chapa le conviene?", "ok": "Grano orientado: aguanta hasta 1,5 T", "d": ["Grano no orientado: es la que admite más", "Cualquiera: las dos aguantan hasta 1,7 T", "Ninguna: no hay chapa que llegue a 1,2 T"], "j": "La chapa de grano no orientado llega a unos 1 T: a 1,2 T se saturaría. La de grano orientado, a 1,5 T (hasta 1,7 T).", "img": null, "cap": "", "n": 8, "o": [0, 1, 3, 2]}, {"tema": "T1", "t": "T1 · punto 1.3 Inducción magnética", "dif": "M", "tipo": "CON", "q": "A un trafo se le cambia la chapa. Con su tensión y sus espiras, el núcleo tiene que trabajar a 1,5 T, pero la chapa nueva solo admite 1 T. ¿Qué pasa al conectarlo?", "ok": "Se satura: la corriente se dispara y se calienta", "d": ["Funciona igual: solo cambia el precio de la chapa", "La tensión del secundario baja a la mitad", "Da menos potencia, pero se calienta menos"], "j": "Si se pasa la inducción que admite la chapa, el hierro se satura: se calienta, zumba y la corriente se dispara.", "img": null, "cap": "", "n": 9, "o": [1, 3, 0, 2]}, {"tema": "T1", "t": "T1 · punto 1.3 Inducción magnética", "dif": "M", "tipo": "CON", "q": "Un fabricante cambia a una chapa que admite más inducción. ¿Qué gana y qué pierde?", "ok": "Gana rendimiento, pero la chapa es más cara", "d": ["Gana rendimiento, pero el trafo se satura antes", "Gana potencia, pero pierde aislamiento", "No gana nada: solo cuenta la cantidad de hierro"], "j": "Cuanto más inducción admite la chapa, mejor rendimiento, pero más cara es.", "img": null, "cap": "", "n": 10, "o": [0, 3, 1, 2]}, {"tema": "T1", "t": "T1 · punto 1.4 Intensidad de campo y fuerza magnetomotriz", "dif": "M", "tipo": "CON", "q": "Una bobina de 300 espiras lleva 2 A. Queremos la misma fuerza magnetomotriz con solo 1 A. ¿Cuántas espiras hacen falta?", "ok": "600 espiras", "d": ["150 espiras", "300 espiras", "1 200 espiras"], "j": "300 × 2 = 600 Av. Con 1 A hacen falta 600 espiras: la mitad de corriente, el doble de espiras.", "img": null, "cap": "", "n": 11, "o": [0, 1, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.4 Intensidad de campo y fuerza magnetomotriz", "dif": "D", "tipo": "CON", "q": "Dos núcleos del mismo hierro y la misma sección, con la misma bobina; uno es el doble de largo que el otro. ¿En cuál hace falta más corriente para tener el mismo flujo?", "ok": "En el largo: el doble de corriente", "d": ["En el corto: el flujo va más apretado", "En los dos igual: la bobina es la misma", "En el largo, pero solo un poco más"], "j": "La f.m.m. se reparte a lo largo del recorrido de las líneas: con el doble de camino, para tener la misma intensidad de campo hace falta el doble de corriente.", "img": null, "cap": "", "n": 12, "o": [1, 3, 0, 2]}, {"tema": "T1", "t": "T1 · punto 1.4 Intensidad de campo y fuerza magnetomotriz", "dif": "M", "tipo": "CON", "q": "Al rebobinar un trafo de 230 V pones en el primario un 20 % menos de espiras. ¿Qué notarás en el ensayo de vacío?", "ok": "Más corriente de vacío y más calor", "d": ["Menos corriente, porque hay menos hilo", "Lo mismo, si el hilo es igual de grueso", "Menos tensión en el secundario"], "j": "Con menos espiras a la misma tensión, el flujo sube, el hierro se satura y la corriente se dispara. Y el secundario daría más tensión, no menos.", "img": null, "cap": "", "n": 13, "o": [3, 0, 1, 2]}, {"tema": "T1", "t": "T1 · punto 1.4 Intensidad de campo y fuerza magnetomotriz", "dif": "M", "tipo": "CON", "q": "En un electroimán, ¿qué cambio NO aumenta la fuerza magnetomotriz?", "ok": "Alargar el núcleo de hierro", "d": ["Poner más espiras", "Subir la corriente", "Poner el doble de espiras con la misma corriente"], "j": "La f.m.m. depende solo de la bobina: espiras y corriente. La longitud del núcleo cambia la intensidad de campo, no la f.m.m.", "img": null, "cap": "", "n": 14, "o": [0, 3, 1, 2]}, {"tema": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "M", "tipo": "CON", "q": "Un electroimán levanta una pieza de hierro pegada a él. Si ponemos un cartón de 2 mm entre los dos, ya no puede. ¿Por qué?", "ok": "Es como aire: frena mucho el flujo", "d": ["El cartón aísla la corriente de la bobina", "El cartón se imanta al revés", "El hierro se satura antes con el cartón"], "j": "El cartón no es magnético: para el flujo es como aire, y un poco de aire «gasta» más que muchos centímetros de hierro.", "img": null, "cap": "", "n": 15, "o": [2, 3, 1, 0]}, {"tema": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "M", "tipo": "CON", "q": "Un núcleo cerrado y otro igual, pero con un entrehierro de 1 mm. Para tener el mismo flujo, ¿qué necesita el del entrehierro?", "ok": "Mucha más corriente en la bobina", "d": ["Menos corriente: el aire pesa menos", "La misma corriente: solo es 1 mm", "Más espiras en el secundario"], "j": "El aire tiene muchísima reluctancia: un milímetro «gasta» más que muchos centímetros de hierro.", "img": null, "cap": "", "n": 16, "o": [2, 0, 1, 3]}, {"tema": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "M", "tipo": "CON", "q": "Un núcleo de trafo se monta con las chapas flojas, dejando huecos de aire. ¿Qué pasa en vacío?", "ok": "Necesita más corriente para crear el flujo", "d": ["Necesita menos corriente: el aire pesa menos", "Da más tensión en el secundario", "Nada: el flujo va por el cobre"], "j": "El aire le pone mucha dificultad al flujo. Por eso las chapas deben ir bien apretadas y sin huecos.", "img": null, "cap": "", "n": 17, "o": [0, 3, 2, 1]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "¿Cuál de estos cambios NO invierte los polos de una bobina?", "ok": "Girar el núcleo de hierro", "d": ["Cambiar el sentido de la corriente", "Cambiar entre sí principio y final", "Rebobinarla en sentido contrario"], "j": "Los polos dependen del sentido de la corriente por las espiras. El núcleo los refuerza, pero no los decide.", "img": null, "cap": "", "n": 18, "o": [1, 3, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "A 1 cm de un cable con corriente hay una brújula. Duplicamos la corriente y le cambiamos el sentido. ¿Qué hace la brújula?", "ok": "Gira al revés y con más fuerza", "d": ["Gira igual, pero con más fuerza", "Gira al revés, con la misma fuerza", "Nada: la brújula solo mira al norte"], "j": "Más corriente, campo más intenso. Corriente al revés, líneas al revés.", "img": null, "cap": "", "n": 19, "o": [0, 1, 3, 2]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "Ves un cable de frente con el símbolo ⊙ (la corriente sale hacia ti). ¿Cómo giran sus líneas?", "ok": "Al revés que el reloj", "d": ["Como las agujas del reloj", "Rectas, como rayos", "No hay: va de frente"], "j": "Mano derecha: pulgar hacia ti; los dedos se cierran en sentido contrario a las agujas del reloj.", "img": null, "cap": "", "n": 20, "o": [0, 2, 1, 3]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "Un cable con corriente está dentro de un imán y recibe una fuerza hacia arriba. Invertimos la corriente y también los polos del imán. ¿Hacia dónde va ahora la fuerza?", "ok": "Hacia arriba, como antes", "d": ["Hacia abajo", "Desaparece", "Hacia arriba, pero el doble"], "j": "Cada cambio invierte la fuerza una vez: con los dos cambios, queda como estaba.", "img": null, "cap": "", "n": 21, "o": [3, 0, 1, 2]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "Un cable con corriente está dentro de un imán. ¿Qué cambio aumenta la fuerza sobre él?", "ok": "Meter más trozo de cable en el campo", "d": ["Usar cable más grueso con la misma corriente", "Cambiar el sentido de la corriente", "Sacar el cable y ponerlo junto al imán"], "j": "La fuerza crece con el campo, con la corriente y con la longitud de cable que está dentro del campo.", "img": null, "cap": "", "n": 22, "o": [0, 1, 3, 2]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "Un altavoz suena más fuerte cuando le llega más corriente. ¿Por qué?", "ok": "Su bobina recibe más fuerza", "d": ["Su imán se hace más potente", "Se induce más tensión en él", "Su bobina se calienta y dilata"], "j": "El altavoz funciona por la 2ª ley: la fuerza sobre el conductor crece con la corriente.", "img": null, "cap": "", "n": 23, "o": [3, 2, 0, 1]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "La dinamo de una bici está girando, pero el cable del faro está suelto. ¿Qué hay en los bornes de la dinamo?", "ok": "Tensión sí; corriente, no", "d": ["Nada: sin faro no se induce nada", "Corriente sí; tensión, no", "Las dos, pero solo si gira deprisa"], "j": "La tensión se induce igual. La corriente solo circula si el circuito está cerrado.", "img": null, "cap": "", "n": 24, "o": [0, 3, 2, 1]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "Un generador sin carga se gira con facilidad; con una lámpara cuesta más. ¿Y con dos lámparas?", "ok": "Cuesta aún más: hay más corriente", "d": ["Cuesta menos: la carga se reparte entre dos", "Cuesta igual: la carga no influye en el giro", "Deja de generar: hay demasiada carga"], "j": "Ley de Lenz: la corriente inducida se opone al giro. Más corriente, más se opone.", "img": null, "cap": "", "n": 25, "o": [3, 2, 1, 0]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "Un alternador gira a 1500 vueltas por minuto y lo frenamos a 750. ¿Qué le pasa a la tensión que da?", "ok": "Baja: el flujo varía más despacio", "d": ["Sube: tiene más tiempo para inducir", "No cambia: el imán es el mismo", "Pasa a ser continua"], "j": "Cuanto más rápido varía el flujo, mayor es la tensión inducida. Más despacio, menos tensión.", "img": null, "cap": "", "n": 26, "o": [0, 1, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "¿Cuál de las tres formas de inducir tensión de la 3ª ley usa el transformador?", "ok": "Variar la corriente sin mover nada", "d": ["Mover el conductor dentro del campo", "Mover un imán cerca de la bobina", "Ninguna: el trafo no induce tensión"], "j": "La corriente alterna del primario cambia sin parar y con ella el flujo: así se induce tensión en el secundario. Mover el conductor es lo que hacen los generadores.", "img": null, "cap": "", "n": 27, "o": [2, 1, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "M", "tipo": "CON", "q": "Subimos poco a poco la corriente de una bobina con núcleo de hierro. De 0 a 1 A el flujo sube mucho; de 5 A a 10 A casi no sube. ¿Qué le pasa al hierro en el segundo tramo?", "ok": "Está saturado", "d": ["Está en la zona lineal", "La bobina se ha cortado", "El flujo baja al subir la corriente"], "j": "En saturación, aunque la corriente suba mucho, el flujo casi no sube: los «imanes» internos del hierro ya están todos alineados.", "img": null, "cap": "", "n": 28, "o": [3, 0, 1, 2]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "M", "tipo": "CON", "q": "¿Por qué no hacemos el núcleo de un trafo de aluminio, que pesa menos?", "ok": "Para el flujo es como el aire", "d": ["Es diamagnético y repele el flujo", "Conduce peor el calor que el hierro", "Se satura antes que el hierro"], "j": "El aluminio es paramagnético: en máquinas se considera amagnético, como el aire.", "img": null, "cap": "", "n": 29, "o": [0, 3, 1, 2]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "M", "tipo": "CON", "q": "Un trafo trabaja en el codo. Le subimos un poco la tensión y entra en saturación. ¿Qué pasa con la corriente?", "ok": "Se dispara y el núcleo se calienta", "d": ["Sube un poco, lo mismo que la tensión", "Baja, porque el hierro ya está lleno", "No cambia: la saturación es solo del hierro"], "j": "Por eso las máquinas trabajan en el codo, cerca de la saturación pero sin llegar.", "img": null, "cap": "", "n": 30, "o": [3, 0, 1, 2]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "M", "tipo": "CON", "q": "¿Cuál de estas frases sobre la curva B-H es FALSA?", "ok": "En saturación, más H da mucho más B", "d": ["En la zona lineal, poco H da mucho B", "La chapa de grano orientado satura más arriba", "Las máquinas trabajan cerca del codo"], "j": "En saturación pasa lo contrario: aunque H suba mucho, B casi no sube.", "img": null, "cap": "", "n": 31, "o": [1, 3, 0, 2]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "M", "tipo": "CON", "q": "Dos chapas: la A tiene un ciclo de histéresis estrecho y la B, ancho. ¿Cuál pondrías en un trafo?", "ok": "La A: se calienta menos", "d": ["La B: guarda mejor el magnetismo", "La B: se satura más tarde", "Da igual: la histéresis no da calor"], "j": "Cuanto más ancho el ciclo, más energía se pierde en calor. Los núcleos se hacen de material blando (ciclo estrecho).", "img": null, "cap": "", "n": 32, "o": [1, 0, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "M", "tipo": "CON", "q": "Cortamos la corriente de un electroimán y una arandela de hierro se queda pegada. ¿Qué la sujeta?", "ok": "La remanencia del núcleo", "d": ["El campo coercitivo", "La saturación del núcleo", "La corriente que queda en la bobina"], "j": "El hierro no se desimana del todo: le queda la remanencia.", "img": null, "cap": "", "n": 33, "o": [2, 1, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "M", "tipo": "CON", "q": "Para soltar esa arandela sin tocarla, ¿qué hay que hacer?", "ok": "Dar un poco de corriente al revés", "d": ["Dar más corriente en el mismo sentido", "Cortar los cables de la bobina", "Esperar: se suelta sola enseguida"], "j": "Para quitar la remanencia hay que aplicar un campo en sentido contrario: el campo coercitivo.", "img": null, "cap": "", "n": 34, "o": [1, 0, 3, 2]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "M", "tipo": "CON", "q": "Un núcleo macizo y otro de chapas, del mismo hierro y con el mismo flujo alterno. ¿Cuál se calienta más?", "ok": "El macizo: más corrientes de Foucault", "d": ["El de chapas: el flujo salta entre chapas", "El macizo: el flujo va más apretado", "Los dos igual: el hierro es el mismo"], "j": "En el bloque macizo las corrientes de Foucault tienen sitio para circular. Las chapas las encierran.", "img": null, "cap": "", "n": 35, "o": [0, 2, 1, 3]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "D", "tipo": "CON", "q": "Un trafo de chapas se calienta en vacío más de lo normal. ¿Cuál de estas causas NO tiene que ver con Foucault?", "ok": "Hilo fino en el secundario", "d": ["Chapas sin barniz que se tocan", "Tornillos pasantes sin aislar", "Chapas con rebabas"], "j": "En vacío el secundario no lleva corriente: su hilo no calienta. Las otras tres unen las chapas como un bloque.", "img": null, "cap": "", "n": 36, "o": [2, 3, 0, 1]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "M", "tipo": "CON", "q": "¿Por qué el silicio de la chapa reduce las corrientes de Foucault?", "ok": "Sube la resistencia del hierro", "d": ["Hace que el hierro sea mejor imán", "Aísla unas chapas de las otras", "Impide que el flujo cambie tanto"], "j": "El silicio (≈3 %) aumenta la resistencia eléctrica del hierro. Lo que aísla las chapas es el barniz.", "img": null, "cap": "", "n": 37, "o": [0, 1, 3, 2]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "M", "tipo": "CON", "q": "Un trafo hecho para 50 Hz se usa con una frecuencia mucho más alta. ¿Qué pasa con las corrientes de Foucault?", "ok": "Aumentan y el núcleo se calienta más", "d": ["Disminuyen: el flujo cambia más rápido", "No cambian: dependen solo del grosor", "Desaparecen: el hierro no las sigue"], "j": "Las corrientes de Foucault son mayores cuanto más alta es la frecuencia. Por eso no hay que pasarse de la frecuencia de diseño.", "img": null, "cap": "", "n": 38, "o": [3, 2, 1, 0]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "M", "tipo": "CON", "q": "Un trafo de 230 / 46 V tiene 250 espiras en el secundario. ¿Cuántas tiene el primario?", "ok": "1250 espiras", "d": ["50 espiras", "250 espiras", "11 500 espiras"], "j": "230 / 46 = 5: el primario tiene 5 veces más tensión y 5 veces más espiras. 250 × 5 = 1250.", "img": null, "cap": "", "n": 39, "o": [3, 2, 0, 1]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "D", "tipo": "CON", "q": "Trafo de 230 / 24 V. Por el secundario pasan 5 A. ¿Cuánta corriente pasa más o menos por el primario?", "ok": "Algo más de 0,5 A", "d": ["5 A, igual que el secundario", "Unos 48 A", "Unos 2,4 A"], "j": "La corriente hace lo contrario que la tensión: unas 10 veces menos tensión en el secundario, unas 10 veces más corriente.", "img": null, "cap": "", "n": 40, "o": [2, 0, 1, 3]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "D", "tipo": "CON", "q": "Un trafo de 230 / 48 V se conecta al revés: metemos 24 V por el lado de 48 V. ¿Qué sale por el otro lado?", "ok": "Unos 115 V", "d": ["Unos 230 V", "Unos 5 V", "Unos 48 V"], "j": "Todos los trafos son reversibles y la tensión va con las espiras. 24 V es la mitad de 48 V: sale la mitad de 230 V, unos 115 V.", "img": null, "cap": "", "n": 41, "o": [2, 3, 0, 1]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "M", "tipo": "CON", "q": "¿Cuál de estas frases sobre un trafo real es FALSA?", "ok": "La energía pasa por un cable interno", "d": ["Parte del flujo se escapa por el aire", "Los trafos pequeños rinden menos que los grandes", "El cobre y el hierro se calientan al trabajar"], "j": "Primario y secundario no están unidos eléctricamente: la energía pasa a través del hierro.", "img": null, "cap": "", "n": 42, "o": [2, 1, 3, 0]}, {"tema": "T3", "t": "T3 · punto 3.13 Terminales homólogos", "dif": "M", "tipo": "CON", "q": "Trafo con 4 bobinas de 50 V en serie, bien conectadas: marca 200 V. Si damos la vuelta a DOS de las bobinas, ¿qué marca el voltímetro?", "ok": "0 V", "d": ["100 V", "150 V", "200 V"], "j": "50 + 50 − 50 − 50 = 0 V. Con una sola al revés serían 100 V.", "img": null, "cap": "", "n": 43, "o": [1, 3, 2, 0]}, {"tema": "T3", "t": "T3 · punto 3.13 Terminales homólogos", "dif": "M", "tipo": "CON", "q": "Dos secundarios de 12 V en serie. Unidos de una forma marcan 24 V; de otra, casi 0 V. ¿Qué cambia entre una y otra?", "ok": "Qué bornes homólogos se unen", "d": ["El grosor del cable del puente", "Que una de las dos es en paralelo", "Que el voltímetro está al revés"], "j": "Si se unen dos bornes homólogos, las tensiones se oponen. Homólogo con no homólogo, se suman.", "img": null, "cap": "", "n": 44, "o": [2, 0, 1, 3]}, {"tema": "T3", "t": "T3 · punto 3.13 Terminales homólogos", "dif": "M", "tipo": "CON", "q": "En el dibujo de un trafo, el punto (•) está arriba en el primario y abajo en el secundario. ¿Cómo se enrollaron las bobinas?", "ok": "En sentido contrario", "d": ["En el mismo sentido", "No se puede saber", "Con distinto número de espiras"], "j": "Con sentido contrario, el borne de arriba de uno es homólogo del de abajo del otro (caso A).", "img": null, "cap": "", "n": 45, "o": [1, 2, 0, 3]}, {"tema": "T3", "t": "T3 · punto 3.14 Tipos de transformadores", "dif": "M", "tipo": "CON", "q": "En el ensayo de cortocircuito hay que subir la tensión desde 0 V poco a poco. ¿Qué trafo se usa y por qué?", "ok": "Un variac: su tensión se regula", "d": ["Un toroidal: rinde mejor y hace menos ruido", "Un trafo de medida: mide la corriente", "Un acorazado: es el más usado"], "j": "El variac es un autotransformador regulable: una escobilla móvil permite variar la tensión.", "img": null, "cap": "", "n": 46, "o": [0, 3, 2, 1]}, {"tema": "T3", "t": "T3 · punto 3.14 Tipos de transformadores", "dif": "D", "tipo": "CON", "q": "Un autotransformador es más pequeño y barato que un trafo normal. ¿Qué pierde a cambio?", "ok": "No separa la entrada de la salida", "d": ["Solo sirve para subir la tensión, no para bajarla", "Solo funciona con corriente continua", "Tiene más pérdidas en el hierro"], "j": "Tiene un solo devanado con una toma común: la entrada y la salida quedan unidas. En un trafo normal, primario y secundario no están unidos eléctricamente.", "img": null, "cap": "", "n": 47, "o": [1, 3, 0, 2]}, {"tema": "T3", "t": "T3 · punto 3.14 Tipos de transformadores", "dif": "M", "tipo": "CON", "q": "¿Cuál de estas parejas está MAL?", "ok": "Muy alta potencia → toroidal", "d": ["Regular la tensión → variac", "Fuente pequeña y silenciosa → toroidal", "Trifásico más usado → 3 columnas"], "j": "Para muy alta potencia se usa el trifásico acorazado.", "img": null, "cap": "", "n": 48, "o": [2, 3, 1, 0]}, {"tema": "T3", "t": "T3 · punto 3.15 Ensayo de vacío", "dif": "M", "tipo": "CON", "q": "Un trafo recién rebobinado: en vacío, la tensión del secundario sale justo la de diseño, pero la corriente de vacío es muy alta. ¿Dónde está el fallo más probable?", "ok": "En el núcleo: chapas mal montadas", "d": ["En el número de espiras del secundario", "En el aislamiento entre los devanados", "En la sección del hilo del secundario"], "j": "Si la tensión del secundario está bien, las espiras están bien. Queda el núcleo: mal armado o chapas en contacto.", "img": null, "cap": "", "n": 49, "o": [3, 0, 2, 1]}, {"tema": "T3", "t": "T3 · punto 3.15 Ensayo de vacío", "dif": "D", "tipo": "CON", "q": "En vacío, con el primario a su tensión, el secundario da un 10 % más de lo previsto. ¿Qué es lo más probable?", "ok": "Pocas espiras en el primario", "d": ["Demasiadas espiras en el primario", "Faltan chapas en el núcleo", "El secundario tiene hilo fino"], "j": "Si el primario tiene menos espiras, la relación baja y el secundario da más tensión. Las chapas y el hilo no cambian la tensión en vacío.", "img": null, "cap": "", "n": 50, "o": [1, 2, 0, 3]}, {"tema": "T3", "t": "T3 · punto 3.15 Ensayo de vacío", "dif": "M", "tipo": "CON", "q": "Ensayo de vacío: V1 = 230 V y V2 = 9,2 V. ¿Qué relación de transformación tiene y qué tipo de trafo es?", "ok": "25: reductor", "d": ["0,04: reductor", "25: elevador", "221: reductor"], "j": "230 / 9,2 = 25. El secundario da menos tensión: reductor. El 221 sale de restar, no de dividir.", "img": null, "cap": "", "n": 51, "o": [2, 1, 3, 0]}, {"tema": "T3", "t": "T3 · punto 3.15 Ensayo de vacío", "dif": "D", "tipo": "CON", "q": "¿Por qué el ensayo de vacío se hace a la tensión nominal y no a la mitad?", "ok": "Para ver el hierro como trabaja de verdad", "d": ["Porque a la mitad se quemaría", "Porque a media tensión no circula nada de corriente", "Para medir las pérdidas en el cobre"], "j": "Las pérdidas en el hierro dependen del flujo, y el flujo lo marca la tensión. A media tensión saldrían más pequeñas que las reales.", "img": null, "cap": "", "n": 52, "o": [2, 1, 3, 0]}, {"tema": "T3", "t": "T3 · punto 3.16 Ensayo de cortocircuito", "dif": "M", "tipo": "CON", "q": "Ensayo de cortocircuito: con 12 V ya pasa la corriente nominal. Si sigues subiendo hasta 24 V, ¿qué pasa?", "ok": "Pasa el doble de la nominal y se calienta", "d": ["Pasa la nominal: no puede pasar más", "El núcleo se satura y corta la corriente", "Nada: con el secundario en corto no hay corriente"], "j": "Con el secundario en corto, la corriente sube con la tensión. Por eso se sube despacio y se para justo en la nominal.", "img": null, "cap": "", "n": 53, "o": [1, 3, 0, 2]}, {"tema": "T3", "t": "T3 · punto 3.16 Ensayo de cortocircuito", "dif": "D", "tipo": "CON", "q": "Un trafo marca 6 W en vacío y 9 W en el cortocircuito. ¿Cuánto perderá, más o menos, a plena carga?", "ok": "Unos 15 W: los dos juntos", "d": ["Unos 9 W: solo el del cobre", "Unos 6 W: solo el hierro", "Unos 3 W: la diferencia"], "j": "Vacío → pérdidas en el hierro; cortocircuito → pérdidas en el cobre. A plena carga están las dos.", "img": null, "cap": "", "n": 54, "o": [1, 2, 0, 3]}, {"tema": "T3", "t": "T3 · punto 3.16 Ensayo de cortocircuito", "dif": "M", "tipo": "CON", "q": "Dos trafos de 230 V: el A tiene 8 V de tensión de cortocircuito y el B, 25 V. ¿Cuál mantiene mejor la tensión del secundario con carga?", "ok": "El A, el de 8 V", "d": ["El B, el de 25 V", "Los dos igual", "Ninguno baja nunca"], "j": "Cuanto mayor es la tensión de cortocircuito, más baja la tensión del secundario con carga.", "img": null, "cap": "", "n": 55, "o": [0, 2, 3, 1]}, {"tema": "T3", "t": "T3 · punto 3.16 Ensayo de cortocircuito", "dif": "M", "tipo": "CON", "q": "¿Cuál de estos datos NO sale del ensayo de cortocircuito?", "ok": "La corriente de vacío", "d": ["Las pérdidas en el cobre", "La tensión de cortocircuito", "Cuánto bajará la tensión con carga"], "j": "La corriente de vacío sale del ensayo de vacío.", "img": null, "cap": "", "n": 56, "o": [1, 0, 2, 3]}, {"tema": "T3", "t": "T3 · punto 3.17 Ensayo en carga", "dif": "M", "tipo": "CON", "q": "Dos trafos de 100 W trabajan con su carga nominal. El A entrega 95 W y el B, 80 W. ¿Cuál se calentará más?", "ok": "El B: pierde 20 W en calor", "d": ["El A: entrega más potencia", "Los dos igual: son de la misma potencia", "Ninguno: el rendimiento no tiene que ver con el calor"], "j": "Lo que no llega a la carga se pierde en calor (cobre y hierro). El A pierde 5 W y el B, 20 W.", "img": null, "cap": "", "n": 57, "o": [1, 2, 0, 3]}, {"tema": "T3", "t": "T3 · punto 3.17 Ensayo en carga", "dif": "M", "tipo": "CON", "q": "Ensayo en carga con lámparas: vamos encendiendo más lámparas en el secundario. ¿Qué hace la corriente del primario?", "ok": "Sube: el primario da lo que pide la carga", "d": ["No cambia: el primario no ve la carga", "Baja, porque se reparte entre las lámparas", "Solo cambia la corriente del secundario"], "j": "Comparando las corrientes del primario y del secundario se ve la relación de transformación: si sube una, sube la otra.", "img": null, "cap": "", "n": 58, "o": [0, 1, 3, 2]}, {"tema": "T3", "t": "T3 · punto 3.17 Ensayo en carga", "dif": "M", "tipo": "CON", "q": "¿Para qué se mantiene la plena carga un rato al final del ensayo en carga?", "ok": "Para ver si se calienta, zumba o huele", "d": ["Para que se estabilice la tensión de la red", "Para medir las pérdidas en el hierro", "Para que se cargue el núcleo de flujo"], "j": "Se comprueba la temperatura, el ruido y si huele a barniz.", "img": null, "cap": "", "n": 59, "o": [3, 1, 2, 0]}, {"tema": "T3", "t": "T3 · punto 3.18 Pruebas de aislamiento", "dif": "M", "tipo": "CON", "q": "Megger: entre primario y núcleo, 0,2 MΩ; entre secundario y núcleo, >999 MΩ. ¿Dónde está el problema?", "ok": "En el primario, cerca del núcleo", "d": ["En el secundario", "Entre primario y secundario", "En ninguno: los dos valores son altos"], "j": "Solo sale bajo el valor del primario contra el núcleo.", "img": null, "cap": "", "n": 60, "o": [0, 2, 1, 3]}, {"tema": "T3", "t": "T3 · punto 3.18 Pruebas de aislamiento", "dif": "M", "tipo": "CON", "q": "Mides el aislamiento de un trafo con el polímetro en ohmios y marca OL. ¿Qué puedes asegurar?", "ok": "Poco: hace falta usar el megger", "d": ["Que el aislamiento es perfecto", "Que hay un hilo tocando el núcleo", "Que el trafo tiene espiras en corto"], "j": "El aislamiento se mide con el megóhmetro, que aplica una tensión continua alta (500 V) y mide megaohmios.", "img": null, "cap": "", "n": 61, "o": [3, 0, 2, 1]}, {"tema": "T3", "t": "T3 · punto 3.18 Pruebas de aislamiento", "dif": "M", "tipo": "CON", "q": "Un trafo guardado en un sótano húmedo marca 2 MΩ entre devanados y núcleo. ¿Qué es lo más probable?", "ok": "Humedad en el aislamiento", "d": ["Contacto directo: hay que tirarlo", "Aislamiento perfecto", "Espiras en corto en el primario"], "j": "Un valor bajo indica humedad, barniz dañado o un hilo pelado. Contacto directo sería casi cero.", "img": null, "cap": "", "n": 62, "o": [3, 0, 1, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta a) Vibración del trafo · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "Según las hojas, el Trafo 1 no zumba en vacío y el Trafo 3 empieza a zumbar al 90 % y zumba fuerte al 100 %. ¿Con qué tiene que ver el zumbido?", "ok": "Con lo cerca que está de saturarse", "d": ["Con la potencia de la lámpara", "Con el grosor del hilo del secundario", "Con la resistencia del primario en frío"], "j": "El Trafo 3 se satura a partir del codo (unos 93 V). El Trafo 1, a 28 V, está muy lejos del suyo.", "img": null, "cap": "", "n": 63, "o": [0, 2, 1, 3]}, {"tema": "P1", "t": "Práctica 1 · pregunta a) Vibración del trafo · hoja «Resultados de los 4 trafos»", "dif": "D", "tipo": "CON", "q": "El Trafo 3 zumba fuerte al 100 % de su tensión. Si apretamos más sus chapas, ¿dejará de zumbar?", "ok": "No del todo: zumba por saturarse", "d": ["Sí: el zumbido es solo por chapas flojas", "Sí: apretar las chapas añade hierro", "No: zumba por la lámpara"], "j": "Hasta el 75 % no zumba: el zumbido empieza cuando se acerca al codo. Apretar las chapas ayuda, pero no le da el hierro que le falta.", "img": null, "cap": "", "n": 64, "o": [0, 1, 2, 3]}, {"tema": "P1", "t": "Práctica 1 · pregunta b) Potencia e intensidad de vacío · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "El Trafo 2 gasta en vacío 1,58 A. Su corriente nominal en el primario es de unos 1,5 A (100 VA / 66 V). ¿Qué dice esto?", "ok": "Que es demasiado: debería ser mucho menor", "d": ["Que está bien: en vacío se gasta la nominal entera", "Que está saturado como el Trafo 3", "Que tiene espiras en cortocircuito"], "j": "La corriente de vacío debe ser pequeña. Gasta tanto por el hierro oxidado, no porque esté saturado: sube en línea recta.", "img": null, "cap": "", "n": 65, "o": [1, 0, 2, 3]}, {"tema": "P1", "t": "Práctica 1 · pregunta b) Potencia e intensidad de vacío · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "En vacío, a su tensión de la tabla, el Trafo 1 marca P0 = 9,6 W y el Trafo 3, 97 W. ¿Por qué tanta diferencia?", "ok": "El 3 está saturado: el hierro pierde más", "d": ["El 3 tiene conectada una carga mayor", "El 1 tiene espiras en cortocircuito", "El 3 tiene el hilo del secundario más fino"], "j": "En vacío no hay carga: lo que marca el vatímetro son las pérdidas en el hierro. El Trafo 3, a 109 V, está pasado del codo.", "img": null, "cap": "", "n": 66, "o": [1, 3, 2, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta b) Potencia e intensidad de vacío · hoja «Resultados de los 4 trafos»", "dif": "D", "tipo": "CON", "q": "Trafo 3: al 75 % (81,8 V), I0 = 1,00 A. Si la corriente siguiera en línea recta, ¿cuánto marcaría al 100 % (109 V)?", "ok": "Unos 1,3 A", "d": ["Unos 3,6 A", "Unos 4,4 A", "Unos 0,8 A"], "j": "109 / 81,8 ≈ 1,33 → 1,3 A. Marcó 3,58 A: todo lo que sobra es por saturarse.", "img": null, "cap": "", "n": 67, "o": [2, 0, 3, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta c) Ensayo de cortocircuito · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "En el ensayo de cortocircuito del Trafo 3, el secundario está en corto. ¿Por qué no se quema?", "ok": "Le damos muy poca tensión", "d": ["El secundario no lleva corriente", "El núcleo absorbe el corto", "El hierro se satura y la frena"], "j": "Se sube la tensión despacio, solo hasta que pasa la nominal: en el Trafo 3, 14,6 V, un 13 % de su V1.", "img": null, "cap": "", "n": 68, "o": [3, 1, 2, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta c) Ensayo de cortocircuito · hoja «Resultados de los 4 trafos»", "dif": "D", "tipo": "CON", "q": "Trafo 3: en cortocircuito, 14,6 V dan la corriente nominal. Si la corriente subiera en proporción a la tensión, ¿cuánta pasaría con el secundario en corto y los 109 V de la tabla?", "ok": "Unas 7,5 veces la nominal: se quemaría", "d": ["Lo mismo: el corto limita la corriente", "Nada: el corto deja el secundario sin tensión", "Pasaría menos, porque se satura"], "j": "109 / 14,6 ≈ 7,5. Es lo que buscamos en la sobrecarga: calentar el trafo a propósito.", "img": null, "cap": "", "n": 69, "o": [3, 2, 0, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta c) Ensayo de cortocircuito · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "Trafo 1: Vcc = 21,1 % de su V1. Trafo 2: Vcc = 12,6 %. ¿Cuál bajará más su tensión con carga?", "ok": "El Trafo 1", "d": ["El Trafo 2", "Los dos igual", "Ninguno: con la lámpara no baja"], "j": "Cuanto mayor es la tensión de cortocircuito, más baja la tensión con carga.", "img": null, "cap": "", "n": 70, "o": [2, 3, 0, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta d) Aislamiento tras la sobrecarga · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "Trafo 3: entre primario y secundario, el megger pasó de >999 MΩ a 500 MΩ tras la sobrecarga. ¿Por qué?", "ok": "El calor dañó parte del barniz", "d": ["El megger se descalibró con el calor", "Las chapas se oxidaron más", "El hilo se hizo más grueso al calentarse"], "j": "Con el humo de la sobrecarga, el esmalte del hilo y el barniz se estropean un poco: hay algo más de fuga.", "img": null, "cap": "", "n": 71, "o": [3, 2, 1, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta d) Aislamiento tras la sobrecarga · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "¿Por qué se repite la prueba de aislamiento después de la sobrecarga, y no basta con la de antes?", "ok": "Para ver si el calor lo ha dañado", "d": ["Porque antes el megger no marca", "Para medir la resistencia en caliente", "Porque el megger necesita el trafo caliente"], "j": "El objetivo de la sobrecarga es dejar el trafo muy caliente y ver si el aislamiento y la resistencia cambian.", "img": null, "cap": "", "n": 72, "o": [1, 3, 0, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta e) Resistencia en caliente · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "Trafo 3: el primario mide 4,0 Ω en frío y 5,3 Ω en caliente. ¿Por qué sube?", "ok": "El cobre caliente resiste más", "d": ["Se fundieron espiras con el calor", "El hilo se encogió al calentarse", "El polímetro mide mal en caliente"], "j": "La resistencia del cobre sube con la temperatura. Por eso se mide en frío y en caliente.", "img": null, "cap": "", "n": 73, "o": [0, 2, 3, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta e) Resistencia en caliente · hoja «Resultados de los 4 trafos»", "dif": "D", "tipo": "CON", "q": "Trafo 4: en caliente, el primario sube un 28 % y el secundario solo un 9 %. ¿Qué nos dice?", "ok": "Que se calentó sobre todo el primario", "d": ["Que el secundario tiene espiras en corto", "Que el polímetro midió mal el secundario", "Que el secundario es de hilo más fino"], "j": "Las espiras en corto estaban en el primario: de ahí salió el humo. El secundario casi no se calentó.", "img": null, "cap": "", "n": 74, "o": [2, 1, 3, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta e) Resistencia en caliente · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "En el primario, el Trafo 1 subió un 19 % en caliente y el Trafo 3, un 32,5 %. ¿Qué significa?", "ok": "Que el Trafo 3 se calentó bastante más", "d": ["Que el Trafo 1 tiene el hilo más grueso", "Que el Trafo 3 tiene más espiras en corto", "Que el Trafo 1 se midió en frío dos veces"], "j": "Cuanto más se calienta el cobre, más sube su resistencia. El Trafo 3 hizo además la sobrecarga.", "img": null, "cap": "", "n": 75, "o": [3, 1, 2, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta f) Menos chapas de las calculadas · animación «Qué les pasó a nuestros trafos»", "dif": "M", "tipo": "CON", "q": "El Trafo 4 pedía 124 chapas y lleva 85, con su tensión y sus espiras. ¿Q const IMGS = {};
const TEMAS = {T1:"T1 Electromagnetismo",T3:"T3 Transformadores",P1:"P1 Práctica 1"};
const TIPO = {CON:"Concepto",UNI:"Unidades",QPS:"Qué pasa si…",APL:"En la máquina real"};
const app = document.getElementById('app');

/* ---------- tema claro/oscuro ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem('maq-tema'); if (t) root.dataset.theme = t; } catch(e) {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('maq-tema', root.dataset.theme); } catch(e) {}
};

/* ---------- zoom de esquemas ---------- */
const zoom = document.getElementById('zoom');
zoom.onclick = () => zoom.style.display = 'none';
function openZoom(src){ zoom.querySelector('img').src = src; zoom.style.display = 'flex'; }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (zoom.style.display === 'flex') { zoom.style.display = 'none'; return; }
    location.href = 'index.html#tests'; return;
  }
  if (e.key === 'Backspace' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    location.href = 'index.html#tests'; return;
  }
  if (state.screen !== 'q') return;
  const k = e.key.toLowerCase();
  const idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (!state.answered && idx >= 0) { answer(idx); e.preventDefault(); }
  else if (state.answered && (e.key === 'Enter' || e.key === ' ')) { next(); e.preventDefault(); }
});

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let state = { screen: 'start' };

/* ---------- inicio ---------- */
function start(){
  state = { screen: 'start' };
  const cnt = t => DATA.filter(q => q.tema === t).length;
  app.innerHTML = `
  <h1>Test avanzado 2 · <span>Temas 1 y 3 + Práctica 1</span></h1>
  <p class="sub">${DATA.length} preguntas: todos los puntos de teoría, del 1.1 al 3.18 y en ese orden, y un bloque final con las preguntas de la Práctica 1 y los datos reales de nuestros cuatro trafos. <b>Hay que razonar</b>: «qué pasa si…», sacar conclusiones de una medida y cuentas sencillas. Ten a mano la hoja «Resultados de los 4 trafos».</p>
  <div class="card">
    <fieldset><legend>Bloques</legend><div class="chips">
      ${Object.keys(TEMAS).map(t => `<label class="chip"><input type="checkbox" name="tema" value="${t}" checked><span>${TEMAS[t]} <span class="cnt">(${cnt(t)})</span></span></label>`).join('')}
    </div></fieldset>
    <fieldset><legend>Dificultad</legend><div class="chips">
      <label class="chip"><input type="radio" name="dif" value="all" checked><span>Todas</span></label>
      <label class="chip"><input type="radio" name="dif" value="M"><span>Medias</span></label>
      <label class="chip"><input type="radio" name="dif" value="D"><span>Difíciles</span></label>
    </div></fieldset>
    <fieldset><legend>Orden</legend><div class="chips">
      <label class="chip"><input type="radio" name="ord" value="fix" checked><span>Por orden (1, 2, 3…)</span></label>
      <label class="chip"><input type="radio" name="ord" value="mix"><span>Mezcladas</span></label>
    </div></fieldset>
    <fieldset><legend>Número de preguntas</legend><div class="chips">
      ${[20,40,60].map((n,i) => `<label class="chip"><input type="radio" name="num" value="${n}" ${i===1?'checked':''}><span>${n}</span></label>`).join('')}
      <label class="chip"><input type="radio" name="num" value="0"><span>Todas</span></label>
    </div></fieldset>
    <p id="avail" class="cnt"></p>
    <button class="go" id="go">Empezar</button>
  </div>
  <div class="box"><span class="lbl">CÓMO FUNCIONA</span>
    Elige una respuesta tocándola (o con las teclas A, B, C, D). Aciertes o no, verás <b>por qué</b> es esa la respuesta.
    <b>Por orden</b>: las preguntas van del 1 al 100, en el orden de los puntos de los apuntes y de las preguntas de la práctica, con las mismas letras que el test en papel. <b>Mezcladas</b>: cambian el orden de las preguntas y de las respuestas cada vez.</div>`;
  const upd = () => {
    const pool = filtered();
    document.getElementById('avail').textContent = `Hay ${pool.length} preguntas con estos filtros.`;
    document.getElementById('go').disabled = pool.length === 0;
  };
  app.querySelectorAll('input').forEach(i => i.onchange = upd);
  upd();
  document.getElementById('go').onclick = () => {
    const n = +app.querySelector('input[name=num]:checked').value;
    const mix = app.querySelector('input[name=ord]:checked').value === 'mix';
    let pool = filtered();
    if (mix) pool = shuffle(pool);
    if (n) pool = pool.slice(0, n);
    state = { screen: 'q', mix, list: pool.map(q => ({ q, order: mix ? shuffle([0,1,2,3]) : q.o.slice(), pick: null })), i: 0, ok: 0, answered: false };
    show();
  };
}
function filtered(){
  const temas = [...app.querySelectorAll('input[name=tema]:checked')].map(i => i.value);
  const dif = app.querySelector('input[name=dif]:checked').value;
  return DATA.filter(q => temas.includes(q.tema) && (dif === 'all' || q.dif === dif));
}

/* ---------- pregunta ---------- */
function opts(q){ return [q.ok, ...q.d]; } // índice 0 = correcta
function show(){
  const it = state.list[state.i], q = it.q, n = state.list.length;
  state.answered = it.pick !== null;
  const all = opts(q);
  app.innerHTML = `
  <div class="meta"><span>Pregunta <b>${state.i+1}</b> de ${n}</span>
    <span class="tag">Nº ${q.n}</span>
    <span class="tag">${TEMAS[q.tema].split(' ')[0]}</span>
    <span class="tag ${q.dif==='D'?'d':''}">${q.dif==='D'?'Difícil':'Media'}</span>
    <span class="score">Aciertos: ${state.ok}</span></div>
  <div class="bar"><i style="width:${(state.i)/n*100}%"></i></div>
  <div class="card">
    ${q.img ? `<figure><img src="${IMGS[q.img]}" alt="Esquema: ${esc(q.cap)}" id="fig"><figcaption>${esc(q.cap)}</figcaption></figure>` : ''}
    <div class="qtext"><span class="qn">${q.n}.</span> ${esc(q.q)}</div>
    <div class="opts">${it.order.map((o,k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(all[o])}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
  const f = document.getElementById('fig'); if (f) f.onclick = () => openZoom(f.src);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  if (state.answered) paint();
  window.scrollTo({ top: 0 });
}
function answer(k){
  if (state.answered) return;
  const it = state.list[state.i];
  it.pick = k; state.answered = true;
  if (it.order[k] === 0) state.ok++;
  paint();
  const nb = document.getElementById('next'); if (nb) nb.focus({ preventScroll: true });
}
function paint(){
  const it = state.list[state.i], q = it.q;
  const good = it.order[it.pick] === 0;
  app.querySelectorAll('.opt').forEach(b => {
    const k = +b.dataset.k; b.disabled = true;
    if (it.order[k] === 0) b.classList.add('right');
    else if (k === it.pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const okLetter = 'ABCD'[it.order.indexOf(0)];
  const last = state.i === state.list.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="verdict ${good?'ok':'ko'}">${good ? '✔ ¡Correcto!' : `✘ No es correcta. La buena es la ${okLetter}.`}</div>
    <div class="box why"><span class="lbl">¿POR QUÉ?</span>${esc(q.j)}</div>
    <div class="hint">Lo tienes en: ${esc(q.t)}</div>
    <div class="nav"><button class="go" id="next">${last ? 'Ver resultado' : 'Siguiente →'}</button></div>`;
  document.getElementById('next').onclick = next;
  document.querySelector('.score').textContent = `Aciertos: ${state.ok}`;
}
function next(){
  if (state.i < state.list.length - 1) { state.i++; show(); } else result();
}

/* ---------- resultado ---------- */
function result(){
  state.screen = 'end';
  const n = state.list.length, nota = (state.ok / n * 10);
  const fails = state.list.filter(it => it.order[it.pick] !== 0);
  const msg = nota >= 9 ? '¡Muy bien! Lo dominas.' : nota >= 7 ? 'Bien. Repasa los fallos.' : nota >= 5 ? 'Aprobado justo: repasa los fallos con los apuntes.' : 'Toca repasar. Mira los fallos y vuelve a intentarlo.';
  app.innerHTML = `
  <h1>Resultado</h1>
  <div class="card" style="text-align:center">
    <p class="big">${state.ok} / ${n}</p>
    <p style="margin:4px 0 0">Nota: <b>${nota.toFixed(1).replace('.',',')}</b> · ${msg}</p>
  </div>
  ${fails.length ? `<div class="card"><h2 style="margin:0 0 4px;font-size:20px">Tus fallos (${fails.length})</h2>
    ${fails.map(it => { const a = opts(it.q); return `<div class="review">
      <div class="rq">${it.q.n}. ${esc(it.q.q)}${it.q.img ? ` <span class="cnt">(${esc(it.q.cap.split('. ')[0])})</span>` : ''}</div>
      <div class="ry">Tu respuesta: ${esc(a[it.order[it.pick]])}</div>
      <div class="ra">Correcta: ${esc(a[0])}</div>
      <div class="cnt">${esc(it.q.j)} · ${esc(it.q.t)}</div></div>`; }).join('')}
  </div>` : ''}
  <div class="nav" style="justify-content:center">
    ${fails.length ? '<button class="go ghost" id="redo">Repetir solo los fallos</button>' : ''}
    <button class="go" id="again">Nuevo test</button>
  </div>`;
  document.getElementById('again').onclick = start;
  const r = document.getElementById('redo');
  if (r) r.onclick = () => { const mix = state.mix; state = { screen: 'q', mix, list: (mix ? shuffle(fails) : fails).map(it => ({ q: it.q, order: mix ? shuffle([0,1,2,3]) : it.q.o.slice(), pick: null })), i: 0, ok: 0, answered: false }; show(); };
  window.scrollTo({ top: 0 });
}
start();
</script>
</body>
</html>
