<style>
:root{
  --bg:#EEF1F4; --card:#ffffff; --ink:#1a1a1a; --muted:#56606b; --line:#cfd6de; --bar:#6A9A1F;
  --green:#1F4E79; --green-soft:#e3ecf6; --red:#c0392b; --red-soft:#fbe4e1;
  --ok:#2e7d32; --ok-soft:#e3f3e4; --yellow:#b7860b; --yellow-soft:#fdf5dc;
  --blue:#1f5fbf; --btn:#e9eef3; --on-green:#fff; --shadow:0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#15191e; --card:#1f252c; --ink:#eef1f4; --muted:#a9b3bd; --line:#36404b; --bar:#6A9A1F;
  --green:#8EC1F0; --green-soft:#26323f; --red:#ef6b5d; --red-soft:#3a201d;
  --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
  --blue:#7aa7f0; --btn:#26323f; --on-green:#0f1a26; --shadow:0 1px 3px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191e; --card:#1f252c; --ink:#eef1f4; --muted:#a9b3bd; --line:#36404b; --bar:#6A9A1F;
    --green:#8EC1F0; --green-soft:#26323f; --red:#ef6b5d; --red-soft:#3a201d;
    --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
    --blue:#7aa7f0; --btn:#26323f; --on-green:#0f1a26; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:17px;line-height:1.45}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--bar);position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}
.back{border:1px solid var(--line);background:var(--btn);color:var(--ink);padding:6px 12px;border-radius:8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.back:hover{border-color:var(--green)}
.crumbs{font-size:14px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--green);text-decoration:none}
.crumbs b{color:var(--ink)}
.theme{border:1px solid var(--line);background:var(--btn);color:var(--ink);width:38px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:26px;margin:6px 0 2px;font-weight:700}
h1 span{color:var(--green)}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.box{border-left:5px solid var(--green);background:var(--green-soft);border-radius:8px;padding:10px 14px;margin:12px 0}
.box .lbl{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--green);display:block;margin-bottom:2px}
.box.why{border-color:var(--yellow);background:var(--yellow-soft)}
.box.why .lbl{color:var(--yellow)}
fieldset{border:none;padding:0;margin:0 0 14px}
legend{font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip>span{display:inline-block;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--btn);cursor:pointer;font-size:15px;user-select:none}
.chip input:checked+span{border-color:var(--green);background:var(--green-soft);font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
.cnt{color:var(--muted);font-size:13px}
.go{background:var(--green);color:var(--on-green);border:none;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.go.ghost{background:var(--btn);color:var(--ink);border:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--btn)}
.tag.d{border-color:var(--red);color:var(--red)}
.score{margin-left:auto;font-weight:700;color:var(--ink)}
.qtext{font-size:19px;font-weight:700;margin:6px 0 12px}
.qn{color:var(--green)}
figure{margin:0 0 12px;text-align:center}
figure img{max-width:100%;max-height:520px;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line);cursor:zoom-in}
figcaption{font-size:14px;color:var(--muted);font-style:italic;margin-top:4px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--btn);font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.verdict{font-weight:700;font-size:18px;margin-top:12px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--red)}
.nav{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.big{font-size:44px;font-weight:700;color:var(--green);margin:0}
.review{border-top:1px solid var(--line);padding:12px 0}
.review .rq{font-weight:700}
.review .ra{color:var(--ok);font-weight:700}
.review .ry{color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:16px}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px;padding:8px}
@media (max-width:560px){body{font-size:16px}.qtext{font-size:17px}h1{font-size:22px}.crumbs{font-size:12px}}
</style>
</head>

": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "M", "tipo": "CON", "q": "Con núcleo de hierro, ¿cuántas veces mayor es el campo que con núcleo de aire?", "ok": "Cientos o miles", "d": ["Unas diez veces", "Más o menos el doble", "Igual: el aire no frena"], "j": "1.5: con núcleo de hierro el campo es cientos o miles de veces mayor que con núcleo de aire.", "img": null, "cap": "", "n": 16, "o": [1, 0, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "M", "tipo": "CON", "q": "¿Dónde hay un entrehierro, según los apuntes?", "ok": "En el motor, entre estator y rotor", "d": ["En el trafo, entre primario y secundario", "En el motor, entre el eje y la carcasa", "En la bobina, entre espira y espira"], "j": "El entrehierro es un pequeño tramo de aire: entre estator y rotor de un motor (el flujo lo atraviesa dos veces).", "img": null, "cap": "", "n": 17, "o": [1, 2, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "¿Cómo se usa la regla de la mano derecha en un conductor recto y en una bobina?", "ok": "Recto: pulgar = corriente. Bobina: pulgar = polo N", "d": ["Recto: pulgar = polo N. Bobina: pulgar = la corriente", "Los dos: el pulgar marca la corriente", "Recto: dedos = corriente. Bobina: dedos = polo N"], "j": "Conductor: el pulgar marca la corriente y los dedos, las líneas. Bobina: los dedos siguen la corriente y el pulgar señala el polo N.", "img": null, "cap": "", "n": 18, "o": [1, 3, 0, 2]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "¿Por qué una espira con corriente tiene una cara N y otra S?", "ok": "Las líneas pasan por dentro en el mismo sentido", "d": ["Las líneas de cada tramo se anulan dentro", "La corriente entra por una cara de la espira y sale por la otra", "El hilo de cobre se imanta"], "j": "Aplicando la regla en cada tramo, todas las líneas pasan por dentro en el mismo sentido: la cara por donde salen es N.", "img": null, "cap": "", "n": 19, "o": [3, 1, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "En un dibujo, un cable lleva el símbolo ⊗ y otro, el símbolo ⊙. ¿Qué indica?", "ok": "Corrientes de sentidos contrarios", "d": ["Corrientes del mismo sentido", "Un cable con corriente y otro sin ella", "Un polo norte y un polo sur"], "j": "⊗ = la corriente entra en el papel (ves la cola de la flecha); ⊙ = sale (ves la punta).", "img": null, "cap": "", "n": 20, "o": [2, 3, 1, 0]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "En la regla de la mano izquierda, ¿qué indica cada dedo?", "ok": "Índice: campo. Corazón: corriente. Pulgar: fuerza", "d": ["Índice: corriente. Corazón: campo. Pulgar: fuerza", "Índice: fuerza. Corazón: corriente. Pulgar: campo", "Índice: campo. Corazón: fuerza. Pulgar: corriente"], "j": "Índice → campo (de N a S); corazón → corriente; pulgar → fuerza (movimiento).", "img": null, "cap": "", "n": 21, "o": [2, 1, 0, 3]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "¿Cuál de estos aparatos NO funciona por la 2ª ley (fuerza sobre un conductor)?", "ok": "El alternador", "d": ["El altavoz", "Los aparatos de medida de aguja", "El motor eléctrico"], "j": "La 2ª ley es el principio de los motores, los altavoces y los aparatos de aguja. El alternador es la 3ª ley.", "img": null, "cap": "", "n": 22, "o": [0, 3, 2, 1]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "Un conductor con corriente dentro de un imán es empujado. ¿Hacia dónde?", "ok": "Hacia donde el campo es más débil", "d": ["Hacia donde el campo es más fuerte", "Siempre hacia el polo norte", "Siempre hacia el polo sur"], "j": "Su campo se suma al del imán por un lado y se resta por el otro: va hacia el lado donde el campo es más débil.", "img": null, "cap": "", "n": 23, "o": [1, 2, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "Metes un imán en una bobina y después lo sacas. ¿Qué hace la corriente inducida?", "ok": "Cambia de sentido al sacarlo", "d": ["Va en el mismo sentido las dos veces", "Solo hay corriente al meterlo", "Solo hay corriente con el imán dentro"], "j": "1.8: al meterlo aparece corriente en un sentido y al sacarlo, en el contrario. Si se queda quieto, no hay corriente.", "img": null, "cap": "", "n": 24, "o": [2, 0, 1, 3]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "¿Qué dice la ley de Lenz?", "ok": "La corriente inducida se opone a su causa", "d": ["La corriente inducida ayuda a su causa", "La tensión inducida no depende de la velocidad", "Solo hay corriente inducida con el imán quieto"], "j": "Por eso cuesta más girar un generador cuando tiene carga.", "img": null, "cap": "", "n": 25, "o": [1, 2, 0, 3]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "En la regla de la mano derecha (generador), ¿qué indica el pulgar?", "ok": "El movimiento", "d": ["El campo", "La corriente inducida", "La fuerza sobre el cable"], "j": "Pulgar → movimiento; índice → campo; corazón → corriente inducida.", "img": null, "cap": "", "n": 26, "o": [1, 3, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "Una espira gira dentro de un campo magnético. ¿Cómo es la tensión inducida?", "ok": "Cambia de valor y de sentido en cada vuelta", "d": ["Cambia de valor, pero nunca de sentido, en cada vuelta", "Es siempre la misma mientras la espira siga girando", "Ninguna: el campo del imán es fijo y no varía"], "j": "Así se genera la corriente alterna en un alternador.", "img": null, "cap": "", "n": 27, "o": [0, 3, 1, 2]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "M", "tipo": "CON", "q": "¿Qué pareja material → tipo está MAL?", "ok": "Plata → paramagnético", "d": ["Cobre → diamagnético", "Aire → paramagnético", "Níquel → ferromagnético"], "j": "La plata es diamagnética, como el cobre, el oro y el grafito.", "img": null, "cap": "", "n": 28, "o": [3, 2, 1, 0]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "M", "tipo": "CON", "q": "¿Con qué se obtiene la curva de magnetización de un material?", "ok": "Bobina, reóstato y teslámetro", "d": ["Bobina, vatímetro y megóhmetro", "Imán, brújula y limaduras", "Trafo, voltímetro y amperímetro"], "j": "El reóstato varía la corriente (y con ella H) y el teslámetro mide la inducción B.", "img": null, "cap": "", "n": 29, "o": [2, 1, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "M", "tipo": "CON", "q": "¿Qué material satura más arriba?", "ok": "La chapa de grano orientado", "d": ["La chapa de grano no orientado", "El aire", "El aluminio"], "j": "IDEA CLAVE del 1.9: la chapa de grano orientado satura más arriba que la normal.", "img": null, "cap": "", "n": 30, "o": [2, 0, 1, 3]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "D", "tipo": "CON", "q": "¿Por qué los núcleos no se hacen de aire, viendo su curva B-H?", "ok": "Su curva es una recta pegada al eje", "d": ["Se satura mucho antes que el propio hierro", "Tiene un codo muy marcado y bajo", "Tiene mucha remanencia"], "j": "El aire es una recta pegada al eje: con mucha H da muy poca B. Por eso los núcleos se hacen de hierro.", "img": null, "cap": "", "n": 31, "o": [0, 1, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "M", "tipo": "CON", "q": "En el ciclo de histéresis, ¿en qué punto vuelve B a valer 0?", "ok": "En H = −Hc", "d": ["En H = 0", "En el punto M", "En +Br"], "j": "Al bajar H a 0, B se queda en Br. Hay que llegar a −Hc (campo coercitivo) para que B valga 0.", "img": null, "cap": "", "n": 32, "o": [2, 1, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "M", "tipo": "CON", "q": "Con corriente alterna de 50 Hz, ¿cuántas veces por segundo se recorre el ciclo de histéresis, y qué pasa en cada una?", "ok": "50, y en cada una se pierde energía", "d": ["100, y en cada una se gana energía", "50, pero solo se pierde energía la primera", "1, porque el ciclo es cerrado"], "j": "El ciclo se recorre 50 veces por segundo y en cada ciclo se pierde energía que se convierte en calor.", "img": null, "cap": "", "n": 33, "o": [3, 0, 2, 1]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "M", "tipo": "CON", "q": "¿Qué dos pérdidas forman las pérdidas en el hierro, y en qué ensayo se miden?", "ok": "Histéresis y Foucault; ensayo de vacío", "d": ["Histéresis y Foucault; ensayo de cortocircuito", "Cobre y Foucault; ensayo de vacío", "Histéresis y dispersión; ensayo en carga"], "j": "EN EL TALLER del 1.10: histéresis + Foucault = pérdidas en el hierro (PFe), que se miden en el ensayo de vacío.", "img": null, "cap": "", "n": 34, "o": [0, 2, 1, 3]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "M", "tipo": "CON", "q": "¿Qué grosor tienen las chapas del núcleo, según los apuntes?", "ok": "Entre 0,3 y 0,5 mm", "d": ["Entre 3 y 5 mm", "Entre 0,03 y 0,05 mm", "Entre 1 y 2 cm"], "j": "Núcleo de chapas finas (0,3-0,5 mm) en vez de un bloque macizo.", "img": null, "cap": "", "n": 35, "o": [1, 0, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "M", "tipo": "CON", "q": "¿Con qué se aíslan las chapas entre sí?", "ok": "Carlite, barniz u óxido", "d": ["Silicio, cobre o estaño", "Termorretráctil y cinta aislante", "Chapa de grano orientado"], "j": "Chapas aisladas entre sí (tratamiento Carlite, barniz u óxido). El termorretráctil es para los tornillos pasantes.", "img": null, "cap": "", "n": 36, "o": [0, 3, 2, 1]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "M", "tipo": "CON", "q": "Sobre las corrientes de Foucault, ¿cuál de estas frases es FALSA?", "ok": "Son flujos magnéticos", "d": ["Calientan el núcleo", "Se oponen al flujo (ley de Lenz)", "Son mayores con el hierro más grueso"], "j": "¡OJO! del 1.11: son corrientes eléctricas, no «flujos magnéticos».", "img": null, "cap": "", "n": 37, "o": [2, 1, 0, 3]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "M", "tipo": "CON", "q": "¿En cuál de estos sitios NO se aprovechan a propósito las corrientes de Foucault?", "ok": "En el núcleo de un trafo", "d": ["En el freno de un tren", "En un detector de metales", "En la cocina de inducción"], "j": "Se aprovechan en cocinas de inducción, frenos de camiones y trenes y detectores de metales. En el trafo son pérdidas.", "img": null, "cap": "", "n": 38, "o": [3, 1, 0, 2]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "M", "tipo": "CON", "q": "En un trafo, ¿cómo se llama el flujo que es común a los dos devanados?", "ok": "Flujo mutuo", "d": ["Flujo de dispersión", "Flujo remanente", "Flujo coercitivo"], "j": "El núcleo lleva ese flujo, común a los dos devanados (flujo mutuo). El de dispersión es el que se escapa por el aire.", "img": null, "cap": "", "n": 39, "o": [0, 3, 2, 1]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "M", "tipo": "CON", "q": "Sobre la relación de transformación, ¿cuál de estas frases es FALSA?", "ok": "El de más tensión lleva el hilo más grueso", "d": ["La tensión va con las espiras", "El devanado de menor tensión lleva más corriente", "Con menos espiras en el secundario es reductor"], "j": "El de MENOR tensión lleva más corriente, y por eso tiene el hilo más grueso.", "img": null, "cap": "", "n": 40, "o": [2, 1, 3, 0]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "M", "tipo": "CON", "q": "Pérdidas del trafo real. ¿Qué pareja está MAL?", "ok": "Pérdidas en el hierro → resistencia de los devanados", "d": ["Pérdidas en el cobre → resistencia de los devanados", "Pérdidas en el hierro → histéresis y Foucault", "Flujo de dispersión → líneas que se escapan por el aire"], "j": "La resistencia de los devanados da las pérdidas en el cobre.", "img": null, "cap": "", "n": 41, "o": [0, 2, 3, 1]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "M", "tipo": "CON", "q": "¿Qué rendimiento tienen los transformadores, según los apuntes?", "ok": "Más del 90 % en medianos y grandes", "d": ["Más del 90 %, sobre todo en los muy pequeños", "El 100 % si el trafo es real", "Menos del 50 % en todos"], "j": "Más del 90 % en trafos medianos y grandes, y menos en los muy pequeños.", "img": null, "cap": "", "n": 42, "o": [2, 0, 3, 1]}, {"tema": "T3", "t": "T3 · punto 3.13 Terminales homólogos", "dif": "M", "tipo": "CON", "q": "En un trafo trifásico, ¿qué pareja de bornes son homólogos?", "ok": "1V1 y 2V1", "d": ["1V1 y 1V2", "1V1 y 1W1", "2V1 y 2V2"], "j": "En trifásicos, los bornes que acaban en el mismo número (1U1 y 2U1, 1V1 y 2V1…) son homólogos.", "img": null, "cap": "", "n": 43, "o": [0, 1, 3, 2]}, {"tema": "T3", "t": "T3 · punto 3.13 Terminales homólogos", "dif": "M", "tipo": "CON", "q": "¿Para qué sirve conocer los terminales homólogos?", "ok": "Para unir bien varias bobinas", "d": ["Para saber cuál es el primario y cuál el secundario", "Para saber la potencia del trafo", "Para medir el aislamiento"], "j": "Cuando un devanado tiene varias bobinas que hay que conectar entre sí, hay que saber cómo unirlas.", "img": null, "cap": "", "n": 44, "o": [1, 2, 0, 3]}, {"tema": "T3", "t": "T3 · punto 3.13 Terminales homólogos", "dif": "M", "tipo": "CON", "q": "¿Cómo se marcan los terminales homólogos en un esquema, y qué otro nombre tienen?", "ok": "Con un punto (•); también, homónimos", "d": ["Con una cruz (×); también, homónimos", "Con un punto (•); también, opuestos", "Con una flecha; también, heterónimos"], "j": "3.13: terminales homólogos (u homónimos); en los esquemas se marcan con un punto (•).", "img": null, "cap": "", "n": 45, "o": [0, 2, 3, 1]}, {"tema": "T3", "t": "T3 · punto 3.14 Tipos de transformadores", "dif": "M", "tipo": "CON", "q": "¿Qué trafo tiene cada devanado en una columna distinta, ocupa más y se usa poco?", "ok": "El monofásico de columnas", "d": ["El monofásico acorazado", "El toroidal", "El trifásico de 5 columnas"], "j": "El acorazado lleva los dos devanados en la columna central y es el más usado.", "img": null, "cap": "", "n": 46, "o": [1, 0, 2, 3]}, {"tema": "T3", "t": "T3 · punto 3.14 Tipos de transformadores", "dif": "M", "tipo": "CON", "q": "Sobre los tipos de trafo, ¿cuál de estas frases es FALSA?", "ok": "Un reductor no se puede usar como elevador", "d": ["El multitoma tiene varias tomas para elegir la tensión", "El trifásico acorazado es para muy alta potencia", "En el de 5 columnas, las de los extremos no llevan bobinas"], "j": "3.14: todos son reversibles.", "img": null, "cap": "", "n": 47, "o": [3, 1, 0, 2]}, {"tema": "T3", "t": "T3 · punto 3.14 Tipos de transformadores", "dif": "M", "tipo": "CON", "q": "Un trafo de medida y uno de aislamiento, ¿según qué se clasifican?", "ok": "Según su aplicación", "d": ["Según su construcción", "Según el número de fases", "Según la tensión"], "j": "Según su aplicación: de distribución, de medida, de aislamiento, de impedancia…", "img": null, "cap": "", "n": 48, "o": [3, 0, 2, 1]}, {"tema": "T3", "t": "T3 · punto 3.15 Ensayo de vacío", "dif": "M", "tipo": "CON", "q": "Ensayo de vacío: ¿qué aparatos van en el primario y cuáles en el secundario?", "ok": "Primario: V, A y W. Secundario: solo V", "d": ["Primario: solo V. Secundario: V, A y el W", "Primario: V y A. Secundario: W", "Los dos llevan V, A y W"], "j": "Primario a su tensión nominal con voltímetro, amperímetro y vatímetro; secundario abierto, solo con un voltímetro.", "img": null, "cap": "", "n": 49, "o": [2, 1, 0, 3]}, {"tema": "T3", "t": "T3 · punto 3.15 Ensayo de vacío", "dif": "M", "tipo": "CON", "q": "En el ensayo de vacío, ¿por qué se desprecian las pérdidas en el cobre?", "ok": "Casi no circula corriente", "d": ["El secundario lleva el hilo más grueso", "El vatímetro no mide el cobre del primario", "La tensión del primario es muy pequeña"], "j": "Las pérdidas en el cobre son tan pequeñas (casi no hay corriente) que se desprecian: el vatímetro marca el hierro.", "img": null, "cap": "", "n": 50, "o": [0, 1, 2, 3]}, {"tema": "T3", "t": "T3 · punto 3.15 Ensayo de vacío", "dif": "M", "tipo": "CON", "q": "En una reparación, ¿qué te dice el ensayo de vacío?", "ok": "Si el núcleo y las espiras están bien", "d": ["Si el hilo tiene la sección y las soldaduras bien", "Si el aislamiento aguanta 500 V", "Cuánto se calienta a plena carga"], "j": "EN EL TALLER del 3.15: dice si el núcleo quedó bien montado y si el número de espiras es correcto.", "img": null, "cap": "", "n": 51, "o": [2, 3, 0, 1]}, {"tema": "T3", "t": "T3 · punto 3.15 Ensayo de vacío", "dif": "D", "tipo": "CON", "q": "¿Cómo se saca la relación de transformación en el ensayo de vacío y en el ensayo en carga?", "ok": "Vacío: con las tensiones. Carga: con las corrientes", "d": ["Vacío: con las corrientes. Carga: con las tensiones de los dos", "Los dos, con las potencias", "Vacío: con el vatímetro. Carga: con el megger"], "j": "Vacío: comparando la tensión del primario con la del secundario. Carga: comparando las corrientes del primario y del secundario.", "img": null, "cap": "", "n": 52, "o": [1, 2, 3, 0]}, {"tema": "T3", "t": "T3 · punto 3.16 Ensayo de cortocircuito", "dif": "M", "tipo": "CON", "q": "¿Qué ventaja tiene el ensayo de cortocircuito?", "ok": "No hace falta una carga grande", "d": ["Se hace a la tensión nominal de la red", "Mide bien las pérdidas en el hierro", "Comprueba también el aislamiento"], "j": "Objetivo: medir las pérdidas en el cobre con la corriente nominal sin necesidad de conectar una carga grande.", "img": null, "cap": "", "n": 53, "o": [0, 2, 1, 3]}, {"tema": "T3", "t": "T3 · punto 3.16 Ensayo de cortocircuito", "dif": "M", "tipo": "CON", "q": "En el cortocircuito, ¿por qué se desprecian las pérdidas en el hierro?", "ok": "Con tan poca tensión, el núcleo no trabaja", "d": ["Porque circula muy poca corriente", "Porque el secundario está abierto", "Porque el vatímetro va conectado solo al cobre"], "j": "Con tan poca tensión el núcleo casi no trabaja. Por los devanados sí pasa la corriente nominal.", "img": null, "cap": "", "n": 54, "o": [0, 3, 2, 1]}, {"tema": "T3", "t": "T3 · punto 3.16 Ensayo de cortocircuito", "dif": "M", "tipo": "CON", "q": "Sobre la tensión de cortocircuito, ¿cuál de estas frases es FALSA?", "ok": "Es parecida a la tensión nominal", "d": ["Es muy pequeña comparada con la nominal", "Cuanto mayor es, más baja V2 con carga", "Se mide cuando pasa la corriente nominal"], "j": "La tensión de cortocircuito es muy pequeña comparada con la nominal.", "img": null, "cap": "", "n": 55, "o": [1, 0, 2, 3]}, {"tema": "T3", "t": "T3 · punto 3.16 Ensayo de cortocircuito", "dif": "M", "tipo": "CON", "q": "Con las pérdidas del ensayo de vacío y las del cortocircuito, ¿qué se conoce sin cargar el trafo?", "ok": "El rendimiento", "d": ["La resistencia de aislamiento", "La relación de transformación", "La corriente de vacío"], "j": "3.16: con las pérdidas en el cobre y en el hierro se puede conocer el rendimiento sin tener que cargar el trafo.", "img": null, "cap": "", "n": 56, "o": [2, 1, 0, 3]}, {"tema": "T3", "t": "T3 · punto 3.17 Ensayo en carga", "dif": "M", "tipo": "CON", "q": "¿Qué datos se sacan del ensayo en carga?", "ok": "Caída de tensión, rendimiento y calentamiento", "d": ["Pérdidas en el hierro y corriente de vacío", "Tensión de cortocircuito y pérdidas en el cobre", "Resistencia de aislamiento"], "j": "También la relación de transformación, comparando las corrientes.", "img": null, "cap": "", "n": 57, "o": [1, 2, 0, 3]}, {"tema": "T3", "t": "T3 · punto 3.17 Ensayo en carga", "dif": "D", "tipo": "CON", "q": "Con carga, el trafo se calienta rápido. ¿Cuál de estas causas NO es de calentamiento?", "ok": "Mucho flujo de dispersión", "d": ["Sección de hilo insuficiente", "Mala impregnación", "Mala ventilación"], "j": "El flujo de dispersión es causa de que la tensión caiga demasiado, no de que se caliente rápido.", "img": null, "cap": "", "n": 58, "o": [1, 2, 3, 0]}, {"tema": "T3", "t": "T3 · punto 3.17 Ensayo en carga", "dif": "M", "tipo": "CON", "q": "¿En qué trafos se puede hacer el ensayo en carga?", "ok": "Solo en los pequeños", "d": ["En todos, también en los de distribución", "Solo en los de distribución", "Solo en los trifásicos"], "j": "Para uno de distribución es imposible tener una carga tan grande.", "img": null, "cap": "", "n": 59, "o": [3, 1, 2, 0]}, {"tema": "T3", "t": "T3 · punto 3.18 Pruebas de aislamiento", "dif": "M", "tipo": "CON", "q": "Prueba de aislamiento entre devanados: ¿cómo se conecta el megóhmetro?", "ok": "Cada devanado puenteado y una punta a cada uno", "d": ["Una punta en el primario y la otra en el núcleo sin pintura", "Una punta en cada borne del mismo devanado", "Todos los bornes juntos a la misma punta"], "j": "Se unen todos los bornes del primario entre sí y todos los del secundario entre sí, y se pone una punta en cada grupo.", "img": null, "cap": "", "n": 60, "o": [3, 0, 2, 1]}, {"tema": "T3", "t": "T3 · punto 3.18 Pruebas de aislamiento", "dif": "M", "tipo": "CON", "q": "¿Qué tensiones aplica el megóhmetro, según los apuntes?", "ok": "250, 500 o 1000 V de continua", "d": ["250, 500 o 1000 V en alterna, a 50 Hz", "12, 24 o 48 V de continua", "230 o 400 V de alterna"], "j": "Aplica una tensión continua alta (250, 500 o 1000 V) y mide megaohmios.", "img": null, "cap": "", "n": 61, "o": [2, 1, 0, 3]}, {"tema": "T3", "t": "T3 · punto 3.18 Pruebas de aislamiento", "dif": "M", "tipo": "CON", "q": "Además de la prueba de aislamiento, ¿q ito"], "j": "El primario lleva corriente en todos los ensayos, también en vacío. El secundario solo en carga (0,15 A) y en el cortocircuito.", "img": null, "cap": "", "n": 73, "o": [3, 0, 1, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta e) Resistencia en caliente · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "Según la hoja, ¿qué trafo subió más la resistencia de su primario?", "ok": "El 3, que hizo la sobrecarga", "d": ["El 4, que echó humo a 28 V", "El 1, que es el más pequeño", "El 2, que va justo en el codo"], "j": "Trafo 3: +32,5 %; Trafo 4: +28,1 %; Trafo 2: +19,5 %; Trafo 1: +19,2 %.", "img": null, "cap": "", "n": 74, "o": [3, 1, 0, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta e) Resistencia en caliente · hoja «Resultados de los 4 trafos»", "dif": "D", "tipo": "CON", "q": "El secundario del Trafo 3 subió un 25,6 % en caliente, y el del Trafo 4, solo un 8,8 %. ¿Por qué tanta diferencia?", "ok": "El 3 hizo la sobrecarga en corto", "d": ["El 4 tiene el hilo del secundario más grueso", "El 3 tiene espiras en corto en el secundario", "El 4 se midió antes de calentarse"], "j": "En la sobrecarga, la corriente pasó por los dos devanados del Trafo 3. En el Trafo 4 solo se calentó el primario, que tenía las espiras en corto.", "img": null, "cap": "", "n": 75, "o": [1, 0, 2, 3]}, {"tema": "P1", "t": "Práctica 1 · pregunta f) Menos chapas de las calculadas · animación «Qué les pasó a nuestros trafos»", "dif": "M", "tipo": "CON", "q": "El Trafo 2 lleva sus 79 chapas, las del cálculo. ¿Por qué, aun así, va justo?", "ok": "Su codo está en su tensión", "d": ["Le faltan unas chapas", "Tiene espiras en cortocircuito", "Su Kap es de 0,9"], "j": "Con sus espiras y sus chapas, el codo empieza en unos 65 V y trabaja a 66 V.", "img": null, "cap": "", "n": 76, "o": [2, 1, 3, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta f) Menos chapas de las calculadas · animación «Qué les pasó a nuestros trafos»", "dif": "M", "tipo": "CON", "q": "Si al Trafo 3 le hubiéramos metido las 107 chapas que pedía, ¿qué habría pasado a 109 V?", "ok": "Se saturaría mucho menos", "d": ["Se saturaría todavía más", "Daría menos tensión en el secundario", "Igual: las chapas no influyen"], "j": "Menos chapas → el codo llega antes. Con más chapas, el codo sube.", "img": null, "cap": "", "n": 77, "o": [3, 2, 1, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta f) Menos chapas de las calculadas · animación «Qué les pasó a nuestros trafos»", "dif": "D", "tipo": "CON", "q": "El Trafo 4 se bobinó con 150 vueltas en vez de 200 y lleva 85 chapas de 124. Sin el corto, ¿dónde estaría su codo?", "ok": "Hacia los 54 V", "d": ["Hacia los 111 V", "Hacia los 200 V", "No tendría codo"], "j": "Según la animación, aun sin el corto, con 150 vueltas se saturaría hacia los 54 V.", "img": null, "cap": "", "n": 78, "o": [2, 0, 3, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta g) Primario en corriente continua · T3 punto 3.12", "dif": "M", "tipo": "CON", "q": "Trafo 3 con 109 V de continua en el primario. ¿Qué marca el voltímetro del secundario?", "ok": "0 V, y el primario se quemaría", "d": ["Unos 63 V, igual que en alterna", "Unos 31 V: la mitad que en alterna", "Los 109 V del primario, directos"], "j": "3.12: la continua no se transforma. Además, solo frena la resistencia: 109 / 4,0 ≈ 27 A.", "img": null, "cap": "", "n": 79, "o": [3, 2, 0, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta g) Primario en corriente continua · T3 punto 3.12", "dif": "M", "tipo": "CON", "q": "Trafo 1: a 28 V de alterna gasta 1 A en vacío; a 28 V de continua pasarían más de 20 A. ¿Por qué tanta diferencia?", "ok": "En alterna, el flujo variable la frena", "d": ["En alterna la resistencia del cobre es mayor", "En continua el cobre conduce mejor", "En alterna el núcleo se satura y la corta"], "j": "En alterna el flujo varía e induce una tensión que se opone (Lenz). En continua el flujo no varía y solo frena la resistencia.", "img": null, "cap": "", "n": 80, "o": [0, 3, 1, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta h) Megger a 500 Vdc o a 2000 Vdc · animación «Pruebas de aislamiento»", "dif": "M", "tipo": "CON", "q": "Según la animación de aislamiento, ¿por qué basta con 500 V en nuestros trafos?", "ok": "Trabajan a poco más de 100 V", "d": ["Es lo máximo que da un megger", "Así se ven las espiras en corto", "Con más tensión se satura el núcleo"], "j": "La tensión de prueba se elige según la máquina: bastante más alta que la de trabajo, sin pasarse.", "img": null, "cap": "", "n": 81, "o": [1, 2, 0, 3]}, {"tema": "P1", "t": "Práctica 1 · pregunta h) Megger a 500 Vdc o a 2000 Vdc · animación «Pruebas de aislamiento»", "dif": "M", "tipo": "CON", "q": "Según la animación de aislamiento, ¿a qué tensión se prueba un trafo de 20 kV?", "ok": "A 5000 V", "d": ["A 500 V", "A 20 kV", "A 1000 V"], "j": "La tensión de prueba se elige según la máquina: bastante más alta que la de trabajo, sin pasarse.", "img": null, "cap": "", "n": 82, "o": [2, 0, 3, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta i) Kap de 0,74 · enunciado de la práctica, apartado 2", "dif": "D", "tipo": "CON", "q": "Si nuestras chapas apilaran bien (Kap = 0,9), ¿cuántas cabrían más o menos en los 40 mm del carrete?", "ok": "Unas 103", "d": ["Unas 85", "Unas 114", "Unas 124"], "j": "0,9 × 40 = 36 mm de hierro; 36 / 0,35 ≈ 103 chapas. El 114 sale de 40 / 0,35, como si no hubiera huecos.", "img": null, "cap": "", "n": 83, "o": [0, 3, 2, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta i) Kap de 0,74 · enunciado de la práctica, apartado 2", "dif": "M", "tipo": "CON", "q": "¿Qué datos hacen falta para sacar nuestro Kap?", "ok": "Chapas, su grosor y el fondo", "d": ["La resistencia y la tensión", "El peso del hierro y la corriente", "El diámetro del hilo y las vueltas"], "j": "85 chapas × 0,35 mm = 29,75 mm de hierro en 40 mm de fondo: Kap ≈ 0,74.", "img": null, "cap": "", "n": 84, "o": [3, 0, 2, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta i) Kap de 0,74 · enunciado de la práctica, apartado 2", "dif": "M", "tipo": "CON", "q": "¿A qué trafos les faltan chapas por culpa del Kap de 0,74?", "ok": "Al 3 y al 4: no les caben", "d": ["Solo al 1 y al 2: llevan menos chapas", "Solo al 2: es el que va justo", "A ninguno: el Kap no cambia el hierro"], "j": "Con el Kap de 0,74 solo caben 85 chapas: el 3 pedía 107 y el 4, 124. El 1 y el 2 llevan las del cálculo.", "img": null, "cap": "", "n": 85, "o": [0, 3, 2, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta j) La lámpara: I1 y P1 · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "Trafo 1: con la lámpara, I2 = 0,09 A y apenas se ve el filamento. ¿Por qué?", "ok": "Le llegan 15 V, y es de 230 V", "d": ["El Trafo 1 se satura con la lámpara", "Tiene espiras en corto", "La I1 no cambia al conectarla"], "j": "Una lámpara de 100 W a 230 V, con tan poca tensión, consume poquísimo.", "img": null, "cap": "", "n": 86, "o": [3, 1, 0, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta j) La lámpara: I1 y P1 · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "Según la práctica, ¿cómo se mide mejor una I2 tan pequeña?", "ok": "Con el polímetro en serie", "d": ["Con la pinza, una sola vuelta", "Con el vatímetro del secundario", "Con el megger a 500 V"], "j": "PISTA de la práctica: mide I2 con el polímetro digital en serie, mejor que con la pinza.", "img": null, "cap": "", "n": 87, "o": [1, 0, 3, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta j) La lámpara: I1 y P1 · hoja «Resultados de los 4 trafos»", "dif": "D", "tipo": "CON", "q": "Truco de la pinza: pasas el cable 10 veces por la boca y marca 1,5 A. ¿Cuánta corriente hay?", "ok": "0,15 A", "d": ["15 A", "1,5 A", "0,015 A"], "j": "Se divide la lectura entre 10: 1,5 / 10 = 0,15 A.", "img": null, "cap": "", "n": 88, "o": [2, 3, 0, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta k) Gráfica de vacío y curva B-H · animación «Qué les pasó a nuestros trafos»", "dif": "D", "tipo": "CON", "q": "Trafo 1: 1,01 A a 28 V. Trafo 3: 1,00 A a 81,8 V. En la gráfica, ¿cuál tiene la recta más tumbada?", "ok": "El Trafo 1: 1 A con solo 28 V", "d": ["El Trafo 3: llega más alto con 1 A", "Los dos igual: los dos gastan 1 A", "Ninguna: las rectas nunca se tumban"], "j": "Con la corriente en horizontal, el que gasta lo mismo con menos tensión queda más tumbado.", "img": null, "cap": "", "n": 89, "o": [3, 0, 2, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta k) Gráfica de vacío y curva B-H · animación «Qué les pasó a nuestros trafos»", "dif": "M", "tipo": "CON", "q": "¿Qué trafos llegan a su tensión de la tabla sin doblarse?", "ok": "El 1 y el 2", "d": ["Solo el 3", "Solo el 3 y el 4", "Los cuatro"], "j": "El 1 y el 2 suben recto hasta su tensión. El 3 se dobla al final y el 4 se tumba desde el principio.", "img": null, "cap": "", "n": 90, "o": [1, 3, 0, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta k) Gráfica de vacío y curva B-H · animación «Qué les pasó a nuestros trafos»", "dif": "D", "tipo": "CON", "q": "En la curva B-H, la H la da la corriente. En nuestra gráfica, ¿qué hace de B y por qué?", "ok": "La V1: el flujo va con ella", "d": ["La I0: es lo mismo que la H", "La P0: es la que calienta", "La V2: es la que sale del trafo"], "j": "La tensión marca el flujo del núcleo, y por eso la tensión hace de B.", "img": null, "cap": "", "n": 91, "o": [0, 2, 1, 3]}, {"tema": "P1", "t": "Práctica 1 · pregunta l) El Trafo 4 · animación «Qué les pasó a nuestros trafos»", "dif": "D", "tipo": "CON", "q": "Trafo 4: 114 W con 5,5 A a 28 V (unos 150 VA). Trafo 3: 97 W con 3,6 A a 109 V (casi 400 VA). ¿Qué los distingue?", "ok": "En el 4 casi todo es calor; en el 3, magnetizar", "d": ["En el 3 casi todo es calor; en el 4, magnetizar", "Los dos gastan casi todo en magnetizar el hierro", "Los dos gastan casi todo en calentar el cobre"], "j": "Saturación (Trafo 3): la mayor parte de la corriente es para magnetizar. Espiras en corto (Trafo 4): casi todo es calor.", "img": null, "cap": "", "n": 92, "o": [3, 1, 0, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta l) El Trafo 4 · animación «Qué les pasó a nuestros trafos»", "dif": "M", "tipo": "CON", "q": "Según la animación, las espiras en corto del Trafo 4 hacen de…", "ok": "Un secundario en corto", "d": ["Un entrehierro de aire grande", "Un núcleo saturado", "Una lámpara conectada"], "j": "Hacen de secundario en cortocircuito dentro del propio trafo: se comen la corriente y se queman, aunque el trafo esté en vacío.", "img": null, "cap": "", "n": 93, "o": [1, 0, 3, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta l) El Trafo 4 · animación «Qué les pasó a nuestros trafos»", "dif": "M", "tipo": "CON", "q": "¿Qué fallo al construirlo explica las espiras en corto del Trafo 4?", "ok": "Esmalte dañado al bobinar", "d": ["Chapas oxidadas", "Megger a demasiada tensión", "Pocas chapas en el carrete"], "j": "Cortocircuito entre espiras del primario por el esmalte dañado al bobinar.", "img": null, "cap": "", "n": 94, "o": [0, 2, 3, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta o) Calidad de las chapas y rendimiento · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "Con la lámpara, el rendimiento sale casi igual en los trafos 1, 2 y 3 (del 11 al 13 %). ¿Por qué?", "ok": "El hierro gasta mucho más que la lámpara", "d": ["Porque los tres están saturados", "Porque los tres tienen la misma potencia", "Porque la lámpara gasta lo mismo en los tres"], "j": "La lámpara gasta 1,3, 5,6 y 12,5 W; el hierro, 9,6, 36,6 y 97 W. En los tres manda el hierro.", "img": null, "cap": "", "n": 95, "o": [0, 3, 1, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta o) Calidad de las chapas y rendimiento · hoja «Resultados de los 4 trafos»", "dif": "D", "tipo": "CON", "q": "Si el Trafo 2 entregara sus 100 W, con P0 = 36,6 W y Pcc = 11,4 W, ¿cómo saldría el rendimiento comparado con la lámpara?", "ok": "Mucho mejor: 100 de unos 148 W", "d": ["Igual: un 13 %, como con la lámpara", "Peor: el hierro perdería más", "Perfecto: un 100 %"], "j": "Absorbería 100 + 36,6 + 11,4 ≈ 148 W: un 68 %, frente al 13 % con la lámpara.", "img": null, "cap": "", "n": 96, "o": [3, 1, 0, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta p) Sobrecarga del Trafo 3 · animación «Qué les pasó a nuestros trafos»", "dif": "M", "tipo": "CON", "q": "¿Para qué se hizo la sobrecarga con el secundario en corto?", "ok": "Para calentar mucho el trafo", "d": ["Para medir la Vcc", "Para medir el aislamiento", "Para ver la saturación en vacío"], "j": "El objetivo es que el trafo quede muy caliente antes de medir aislamiento y resistencia de nuevo.", "img": null, "cap": "", "n": 97, "o": [0, 3, 2, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta p) Sobrecarga del Trafo 3 · animación «Qué les pasó a nuestros trafos»", "dif": "D", "tipo": "CON", "q": "En la sobrecarga del Trafo 3 pasaron 10-12 A por el primario. Si toda esa corriente llegara al secundario, ¿cuánta I2 habría?", "ok": "Unos 17-21 A", "d": ["10-12 A, igual que I1", "Unos 6-7 A", "Ninguna: está en corto"], "j": "El secundario tiene menos espiras (150 frente a 260) y lleva 1,73 veces más corriente.", "img": null, "cap": "", "n": 98, "o": [1, 2, 3, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta q) El megger y el 500 MΩ · hoja «Resultados de los 4 trafos»", "dif": "D", "tipo": "CON", "q": "En la animación de aislamiento, un trafo del aula quemado marcó 0 MΩ entre devanados; el Trafo 3, 500 MΩ. ¿Qué indica?", "ok": "Que aquel ya no aísla; el 3, sí", "d": ["Que los dos están igual de estropeados", "Que 500 MΩ es peor que 0 MΩ", "Que el megger falló al medir 0 MΩ"], "j": "Casi cero = contacto directo: el trafo no se puede usar. Cientos de MΩ es un aislamiento bueno.", "img": null, "cap": "", "n": 99, "o": [2, 1, 3, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta q) El megger y el 500 MΩ · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "¿Qué medida del megger de la hoja es un valor real y no el fondo de escala?", "ok": "Solo el 500 MΩ del Trafo 3", "d": ["Todas: >999 MΩ es un valor exacto", "Ninguna: todas son fondo de escala", "Las del Trafo 4, que echó humo"], "j": ">999 MΩ es el fondo de escala de nuestro megger; el 500 MΩ sí es una lectura.", "img": null, "cap": "", "n": 100, "o": [1, 3, 0, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta a) Vibración del trafo · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "Según las hojas, el Trafo 1 no zumba en vacío y el Trafo 3 empieza a zumbar al 90 % y zumba fuerte al 100 %. ¿Con qué tiene que ver el zumbido?", "ok": "Con lo cerca que está de saturarse", "d": ["Con la potencia de la lámpara", "Con el grosor del hilo del secundario", "Con la resistencia del primario en frío"], "j": "El Trafo 3 se satura a partir del codo (unos 93 V). El Trafo 1, a 28 V, está muy lejos del suyo.", "img": null, "cap": "", "n": 101, "o": [2, 0, 1, 3]}, {"tema": "P1", "t": "Práctica 1 · pregunta a) Vibración del trafo · hoja «Resultados de los 4 trafos»", "dif": "D", "tipo": "CON", "q": "El Trafo 3 zumba fuerte al 100 % de su tensión. Si apretamos más sus chapas, ¿dejará de zumbar?", "ok": "No del todo: zumba por saturarse", "d": ["Sí: el zumbido es solo por chapas flojas", "Sí: apretar las chapas añade hierro", "No: zumba por la lámpara"], "j": "Hasta el 75 % no zumba: el zumbido empieza cuando se acerca al codo. Apretar las chapas ayuda, pero no le da el hierro que le falta.", "img": null, "cap": "", "n": 102, "o": [2, 0, 1, 3]}, {"tema": "P1", "t": "Práctica 1 · pregunta b) Potencia e intensidad de vacío · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "El Trafo 2 gasta en vacío 1,58 A. Su corriente nominal en el primario es de unos 1,5 A (100 VA / 66 V). ¿Qué dice esto?", "ok": "Que es demasiado: debería ser mucho menor", "d": ["Que está bien: en vacío se gasta la nominal entera", "Que está saturado como el Trafo 3", "Que tiene espiras en cortocircuito"], "j": "La corriente de vacío debe ser pequeña. Gasta tanto por el hierro oxidado, no porque esté saturado: sube en línea recta.", "img": null, "cap": "", "n": 103, "o": [0, 3, 1, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta b) Potencia e intensidad de vacío · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "En vacío, a su tensión de la tabla, el Trafo 1 marca P0 = 9,6 W y el Trafo 3, 97 W. ¿Por qué tanta diferencia?", "ok": "El 3 está saturado: el hierro pierde más", "d": ["El 3 tiene conectada una carga mayor", "El 1 tiene espiras en cortocircuito", "El 3 tiene el hilo del secundario más fino"], "j": "En vacío no hay carga: lo que marca el vatímetro son las pérdidas en el hierro. El Trafo 3, a 109 V, está pasado del codo.", "img": null, "cap": "", "n": 104, "o": [2, 0, 3, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta b) Potencia e intensidad de vacío · hoja «Resultados de los 4 trafos»", "dif": "D", "tipo": "CON", "q": "Trafo 3: al 75 % (81,8 V), I0 = 1,00 A. Si la corriente siguiera en línea recta, ¿cuánto marcaría al 100 % (109 V)?", "ok": "Unos 1,3 A", "d": ["Unos 3,6 A", "Unos 4,4 A", "Unos 0,8 A"], "j": "109 / 81,8 ≈ 1,33 → 1,3 A. Marcó 3,58 A: todo lo que sobra es por saturarse.", "img": null, "cap": "", "n": 105, "o": [1, 2, 0, 3]}, {"tema": "P1", "t": "Práctica 1 · pregunta c) Ensayo de cortocircuito · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "En el ensayo de cortocircuito del Trafo 3, el secundario está en corto. ¿Por qué no se quema?", "ok": "Le damos muy poca tensión", "d": ["El secundario no lleva corriente", "El núcleo absorbe el corto", "El hierro se satura y la frena"], "j": "Se sube la tensión despacio, solo hasta que pasa la nominal: en el Trafo 3, 14,6 V, un 13 % de su V1.", "img": null, "cap": "", "n": 106, "o": [3, 2, 1, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta c) Ensayo de cortocircuito · hoja «Resultados de los 4 trafos»", "dif": "D", "tipo": "CON", "q": "Trafo 3: en cortocircuito, 14,6 V dan la corriente nominal. Si la corriente subiera en proporción a la tensión, ¿cuánta pasaría con el secundario en corto y los 109 V de la tabla?", "ok": "Unas 7,5 veces la nominal: se quemaría", "d": ["Lo mismo: el corto limita la corriente", "Nada: el corto deja el secundario sin tensión", "Pasaría menos, porque se satura"], "j": "109 / 14,6 ≈ 7,5. Es lo que buscamos en la sobrecarga: calentar el trafo a propósito.", "img": null, "cap": "", "n": 107, "o": [1, 3, 0, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta c) Ensayo de cortocircuito · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "Trafo 1: Vcc = 21,1 % de su V1. Trafo 2: Vcc = 12,6 %. ¿Cuál bajará más su tensión con carga?", "ok": "El Trafo 1", "d": ["El Trafo 2", "Los dos igual", "Ninguno: con la lámpara no baja"], "j": "Cuanto mayor es la tensión de cortocircuito, más baja la tensión con carga.", "img": null, "cap": "", "n": 108, "o": [0, 3, 1, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta d) Aislamiento tras la sobrecarga · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "Trafo 3: entre primario y secundario, el megger pasó de >999 MΩ a 500 MΩ tras la sobrecarga. ¿Por qué?", "ok": "El calor dañó parte del barniz", "d": ["El megger se descalibró con el calor", "Las chapas se oxidaron más", "El hilo se hizo más grueso al calentarse"], "j": "Con el humo de la sobrecarga, el esmalte del hilo y el barniz se estropean un poco: hay algo más de fuga.", "img": null, "cap": "", "n": 109, "o": [3, 0, 2, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta d) Aislamiento tras la sobrecarga · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "¿Por qué se repite la prueba de aislamiento después de la sobrecarga, y no basta con la de antes?", "ok": "Para ver si el calor lo ha dañado", "d": ["Porque antes el megger no marca", "Para medir la resistencia en caliente", "Porque el megger necesita el trafo caliente"], "j": "El objetivo de la sobrecarga es dejar el trafo muy caliente y ver si el aislamiento y la resistencia cambian.", "img": null, "cap": "", "n": 110, "o": [0, 1, 3, 2]}, {"tema": "P1", "t": "Práctica 1 · pregunta e) Resistencia en caliente · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "Trafo 3: el primario mide 4,0 Ω en frío y 5,3 Ω en caliente. ¿Por qué sube?", "ok": "El cobre caliente resiste más", "d": ["Se fundieron espiras con el calor", "El hilo se encogió al calentarse", "El polímetro mide mal en caliente"], "j": "La resistencia del cobre sube con la temperatura. Por eso se mide en frío y en caliente.", "img": null, "cap": "", "n": 111, "o": [1, 3, 2, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta e) Resistencia en caliente · hoja «Resultados de los 4 trafos»", "dif": "D", "tipo": "CON", "q": "Trafo 4: en caliente, el primario sube un 28 % y el secundario solo un 9 %. ¿Qué nos dice?", "ok": "Que se calentó sobre todo el primario", "d": ["Que el secundario tiene espiras en corto", "Que el polímetro midió mal el secundario", "Que el secundario es de hilo más fino"], "j": "Las espiras en corto estaban en el primario: de ahí salió el humo. El secundario casi no se calentó.", "img": null, "cap": "", "n": 112, "o": [2, 3, 1, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta e) Resistencia en caliente · hoja «Resultados de los 4 trafos»", "dif": "M", "tipo": "CON", "q": "En el primario, el Trafo 1 subió un 19 % en caliente y el Trafo 3, un 32,5 %. ¿Qué significa?", "ok": "Que el Trafo 3 se calentó bastante más", "d": ["Que el Trafo 1 tiene el hilo más grueso", "Que el Trafo 3 tiene más espiras en corto", "Que el Trafo 1 se midió en frío dos veces"], "j": "Cuanto más se calienta el cobre, más sube su resistencia. El Trafo 3 hizo además la sobrecarga.", "img": null, "cap": "", "n": 113, "o": [3, 2, 0, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta f) Menos chapas de las calculadas · animación «Qué les pasó a nuestros trafos»", "dif": "M", "tipo": "CON", "q": "El Trafo 4 pedía 124 chapas y lleva 85, con su tensión y sus espiras. ¿Qué le pasa al hierro?", "ok": "Va más cargado: se satura antes", "d": ["Va menos cargado: se calienta menos", "Nada: la inducción depende del cobre", "Da menos tensión en el secundario"], "j": "Con menos hierro, el mismo flujo va más apretado: más inducción, y el codo llega antes.", "img": null, "cap": "", "n": 114, "o": [1, 2, 0, 3]}, {"tema": "P1", "t": "Práctica 1 · pregunta f) Menos chapas de las calculadas · animación «Qué les pasó a nuestros trafos»", "dif": "M", "tipo": "CON", "q": "El Trafo 1 lleva todas las chapas que pedía (56) y su codo está en unos 44 V. ¿Por qué no se satura en la práctica?", "ok": "Porque solo le damos 28 V", "d": ["Porque le sobran chapas", "Porque tiene espiras en corto", "Porque la lámpara lo frena"], "j": "Va bien solo porque su tensión de la tabla es muy baja. Si le diéramos 50 V, se saturaría como el Trafo 3.", "img": null, "cap": "", "n": 115, "o": [3, 1, 2, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta f) Menos chapas de las calculadas · animación «Qué les pasó a nuestros trafos»", "dif": "M", "tipo": "CON", "q": "Con 85 chapas, el codo está en unos 0,36 V por espira. El Trafo 1, con 56 chapas, lo tiene en 0,24. ¿Qué regla se cumple?", "ok": "Menos chapas, el codo llega antes", "d": ["Menos chapas, el codo llega después", "El codo no depende de las chapas", "Más chapas, más tensión en el secundario"], "j": "Menos hierro → se satura con menos voltios por espira.", "img": null, "cap": "", "n": 116, "o": [2, 1, 3, 0]}, {"tema": "P1", "t": "Práctica 1 · pregunta g) Primario en corriente continua · T3 punto 3.12", "dif": "D", "tipo": "CON", "q": "El primario del Trafo 1 mide 1,30 Ω. ¿Cuánta corriente pasaría si le diéramos 28 V de continua?", "ok": "Más de 20 A: se quemaría", "d": ["Unos 1 A, como en vacío", "Ninguna: en continua no pasa", "Unos 0,5 A: menos que en alterna"], "j": "En continua no hay flujo variable y solo frena la resistencia del cobre: 28 / 1,30 ≈ 21,5 A.", "img": null, "cap": "", "n": 117, "o": [0, 3, 2, 1]}, {"tema": "P1", "t": "Práctica 1 · pregunta g) Primario en corriente continua · T3 punto 3.12", "dif": "M", " const IMGS = {};
const TEMAS = {T1:"T1 Electromagnetismo",T3:"T3 Transformadores",P1:"P1 Práctica 1"};
const TIPO = {CON:"Concepto",UNI:"Unidades",QPS:"Qué pasa si…",APL:"En la máquina real"};
const app = document.getElementById('app');

/* ---------- tema claro/oscuro ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem('maq-tema'); if (t) root.dataset.theme = t; } catch(e) {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('maq-tema', root.dataset.theme); } catch(e) {}
};

/* ---------- zoom de esquemas ---------- */
const zoom = document.getElementById('zoom');
zoom.onclick = () => zoom.style.display = 'none';
function openZoom(src){ zoom.querySelector('img').src = src; zoom.style.display = 'flex'; }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (zoom.style.display === 'flex') { zoom.style.display = 'none'; return; }
    location.href = 'index.html#tests'; return;
  }
  if (e.key === 'Backspace' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    location.href = 'index.html#tests'; return;
  }
  if (state.screen !== 'q') return;
  const k = e.key.toLowerCase();
  const idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (!state.answered && idx >= 0) { answer(idx); e.preventDefault(); }
  else if (state.answered && (e.key === 'Enter' || e.key === ' ')) { next(); e.preventDefault(); }
});

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let state = { screen: 'start' };

/* ---------- inicio ---------- */
function start(){
  state = { screen: 'start' };
  const cnt = t => DATA.filter(q => q.tema === t).length;
  app.innerHTML = `
  <h1>Test avanzado 3 · <span>Temas 1 y 3 + Práctica 1</span></h1>
  <p class="sub">${DATA.length} preguntas. Teoría (1-62), del 1.1 al 3.18 y en ese orden: <b>todas las respuestas están tal cual en los apuntes</b>, pero hay que leerlos con mucho cuidado (frases falsas, parejas mal hechas, datos parecidos). Práctica 1 (63-138): conclusiones con los datos reales de nuestros cuatro trafos; ten a mano la hoja «Resultados de los 4 trafos».</p>
  <div class="card">
    <fieldset><legend>Bloques</legend><div class="chips">
      ${Object.keys(TEMAS).map(t => `<label class="chip"><input type="checkbox" name="tema" value="${t}" checked><span>${TEMAS[t]} <span class="cnt">(${cnt(t)})</span></span></label>`).join('')}
    </div></fieldset>
    <fieldset><legend>Dificultad</legend><div class="chips">
      <label class="chip"><input type="radio" name="dif" value="all" checked><span>Todas</span></label>
      <label class="chip"><input type="radio" name="dif" value="M"><span>Medias</span></label>
      <label class="chip"><input type="radio" name="dif" value="D"><span>Difíciles</span></label>
    </div></fieldset>
    <fieldset><legend>Orden</legend><div class="chips">

    </div></fieldset>
    <fieldset><legend>Número de preguntas</legend><div class="chips">
      ${[20,40,60].map((n,i) => `<label class="chip"><input type="radio" name="num" value="${n}" ${i===1?'checked':''}><span>${n}</span></label>`).join('')}
      <label class="chip"><input type="radio" name="num" value="0"><span>Todas</span></label>
    </div></fieldset>
    <p id="avail" class="cnt"></p>
    <button class="go" id="go">Empezar</button>
  </div>
  <div class="box"><span class="lbl">CÓMO FUNCIONA</span>
    Elige una respuesta tocándola (o con las teclas A, B, C, D). Aciertes o no, verás <b>por qué</b> es esa la respuesta.
    <b>Por orden</b>: las preguntas van del 1 al ${DATA.length}, en el orden de los puntos de los apuntes y de las preguntas de la práctica, con las mismas letras que el test en papel. <b>Mezcladas</b>: cambian el orden de las preguntas y de las respuestas cada vez.</div>`;
  const upd = () => {
    const pool = filtered();
    document.getElementById('avail').textContent = `Hay ${pool.length} preguntas con estos filtros.`;
    document.getElementById('go').disabled = pool.length === 0;
  };
  app.querySelectorAll('input').forEach(i => i.onchange = upd);
  upd();
  document.getElementById('go').onclick = () => {
    const n = +app.querySelector('input[name=num]:checked').value;
    const mix = app.querySelector('input[name=ord]:checked').value === 'mix';
    let pool = filtered();
    if (mix) pool = shuffle(pool);
    if (n) pool = pool.slice(0, n);
    state = { screen: 'q', mix, list: pool.map(q => ({ q, order: mix ? shuffle([0,1,2,3]) : q.o.slice(), pick: null })), i: 0, ok: 0, answered: false };
    show();
  };
}
function filtered(){
  const temas = [...app.querySelectorAll('input[name=tema]:checked')].map(i => i.value);
  const dif = app.querySelector('input[name=dif]:checked').value;
  return DATA.filter(q => temas.includes(q.tema) && (dif === 'all' || q.dif === dif));
}

/* ---------- pregunta ---------- */
function opts(q){ return [q.ok, ...q.d]; } // índice 0 = correcta
function show(){
  const it = state.list[state.i], q = it.q, n = state.list.length;
  state.answered = it.pick !== null;
  const all = opts(q);
  app.innerHTML = `
  <div class="meta"><span>Pregunta <b>${state.i+1}</b> de ${n}</span>
    <span class="tag">Nº ${q.n}</span>
    <span class="tag">${TEMAS[q.tema].split(' ')[0]}</span>
    <span class="tag ${q.dif==='D'?'d':''}">${q.dif==='D'?'Difícil':'Media'}</span>
    <span class="score">Aciertos: ${state.ok}</span></div>
  <div class="bar"><i style="width:${(state.i)/n*100}%"></i></div>
  <div class="card">
    ${q.img ? `<figure><img src="${IMGS[q.img]}" alt="Esquema: ${esc(q.cap)}" id="fig"><figcaption>${esc(q.cap)}</figcaption></figure>` : ''}
    <div class="qtext"><span class="qn">${q.n}.</span> ${esc(q.q)}</div>
    <div class="opts">${it.order.map((o,k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(all[o])}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
  const f = document.getElementById('fig'); if (f) f.onclick = () => openZoom(f.src);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  if (state.answered) paint();
  window.scrollTo({ top: 0 });
}
function answer(k){
  if (state.answered) return;
  const it = state.list[state.i];
  it.pick = k; state.answered = true;
  if (it.order[k] === 0) state.ok++;
  paint();
  const nb = document.getElementById('next'); if (nb) nb.focus({ preventScroll: true });
}
function paint(){
  const it = state.list[state.i], q = it.q;
  const good = it.order[it.pick] === 0;
  app.querySelectorAll('.opt').forEach(b => {
    const k = +b.dataset.k; b.disabled = true;
    if (it.order[k] === 0) b.classList.add('right');
    else if (k === it.pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const okLetter = 'ABCD'[it.order.indexOf(0)];
  const last = state.i === state.list.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="verdict ${good?'ok':'ko'}">${good ? '✔ ¡Correcto!' : `✘ No es correcta. La buena es la ${okLetter}.`}</div>
    <div class="box why"><span class="lbl">¿POR QUÉ?</span>${esc(q.j)}</div>
    <div class="hint">Lo tienes en: ${esc(q.t)}</div>
    <div class="nav"><button class="go" id="next">${last ? 'Ver resultado' : 'Siguiente →'}</button></div>`;
  document.getElementById('next').onclick = next;
  document.querySelector('.score').textContent = `Aciertos: ${state.ok}`;
}
function next(){
  if (state.i < state.list.length - 1) { state.i++; show(); } else result();
}

/* ---------- resultado ---------- */
function result(){
  state.screen = 'end';
  const n = state.list.length, nota = (state.ok / n * 10);
  const fails = state.list.filter(it => it.order[it.pick] !== 0);
  const msg = nota >= 9 ? '¡Muy bien! Lo dominas.' : nota >= 7 ? 'Bien. Repasa los fallos.' : nota >= 5 ? 'Aprobado justo: repasa los fallos con los apuntes.' : 'Toca repasar. Mira los fallos y vuelve a intentarlo.';
  app.innerHTML = `
  <h1>Resultado</h1>
  <div class="card" style="text-align:center">
    <p class="big">${state.ok} / ${n}</p>
    <p style="margin:4px 0 0">Nota: <b>${nota.toFixed(1).replace('.',',')}</b> · ${msg}</p>
  </div>
  ${fails.length ? `<div class="card"><h2 style="margin:0 0 4px;font-size:20px">Tus fallos (${fails.length})</h2>
    ${fails.map(it => { const a = opts(it.q); return `<div class="review">
      <div class="rq">${it.q.n}. ${esc(it.q.q)}${it.q.img ? ` <span class="cnt">(${esc(it.q.cap.split('. ')[0])})</span>` : ''}</div>
      <div class="ry">Tu respuesta: ${esc(a[it.order[it.pick]])}</div>
      <div class="ra">Correcta: ${esc(a[0])}</div>
      <div class="cnt">${esc(it.q.j)} · ${esc(it.q.t)}</div></div>`; }).join('')}
  </div>` : ''}
  <div class="nav" style="justify-content:center">
    ${fails.length ? '<button class="go ghost" id="redo">Repetir solo los fallos</button>' : ''}
    <button class="go" id="again">Nuevo test</button>
  </div>`;
  document.getElementById('again').onclick = start;
  const r = document.getElementById('redo');
  if (r) r.onclick = () => { const mix = state.mix; state = { screen: 'q', mix, list: (mix ? shuffle(fails) : fails).map(it => ({ q: it.q, order: mix ? shuffle([0,1,2,3]) : it.q.o.slice(), pick: null })), i: 0, ok: 0, answered: false }; show(); };
  window.scrollTo({ top: 0 });
}
start();
</script>
</body>
</html>
