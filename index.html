<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Máquinas Eléctricas · Animaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--ink:#1a1a1a;--muted:#56606b;--card:#fff;--line:#cfd6de;--acc:#1F4E79;--acc2:#2E75B6;--chip:#e3ecf6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15191e;--ink:#eef1f4;--muted:#a9b3bd;--card:#1f252c;--line:#36404b;--acc:#8EC1F0;--acc2:#6FAEE8;--chip:#26323f}}
:root[data-theme="dark"]{--bg:#15191e;--ink:#eef1f4;--muted:#a9b3bd;--card:#1f252c;--line:#36404b;--acc:#8EC1F0;--acc2:#6FAEE8;--chip:#26323f}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:18px;line-height:1.45}
main{max-width:860px;margin:0 auto;padding:28px 16px 40px}
.top{border-bottom:4px solid var(--acc2);padding-bottom:10px;margin-bottom:8px}
.top small{color:var(--acc2);font-weight:700}
h1{margin:4px 0 0;font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.15}
.intro{color:var(--muted);margin:8px 0 0}
h2.tema{font-size:1.15rem;color:var(--acc);margin:28px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--line)}
a.card{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;color:inherit;text-decoration:none;transition:transform .12s,border-color .12s}
a.card:hover,a.card:focus-visible{transform:translateY(-2px);border-color:var(--acc);outline:none}
.num{flex:none;min-width:64px;padding:8px 8px;border-radius:10px;background:var(--acc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;line-height:1.2;text-align:center}
.num small{font-size:.7rem;font-weight:400;opacity:.85}
.card h3{margin:0 0 4px;font-size:1.2rem;color:var(--acc)}
.card p{margin:0 0 8px;color:var(--muted);font-size:.98rem}
.pts{display:flex;flex-wrap:wrap;gap:6px}
.pt{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.85rem}
.pt b{color:var(--acc)}
.foot{color:var(--muted);font-size:.9rem;margin-top:24px}
</style>
</head>
<body>
<main>
  <div class="top">
    <small>Máquinas Eléctricas 2MB · I.E.S. Trinidad Arroyo</small>
    <h1>Animaciones de clase</h1>
    <p class="intro">Cada animación indica el punto de los apuntes al que corresponde. Ábrela cuando estudies ese punto.</p>
  </div>
  <div id="list"></div>
  <p class="foot">Funcionan en el ordenador, la tablet y el móvil.</p>
</main>

<script>
// Puntos de los apuntes (mismo número y nombre que en los apuntes)
const PUNTOS={
  '1.1':'Magnetismo, imán, electroimán y electromagnetismo',
  '1.2':'Campo magnético y flujo magnético',
  '1.3':'Inducción magnética',
  '1.4':'Intensidad de campo y fuerza magnetomotriz',
  '1.5':'Circuito magnético básico',
  '1.6':'1ª ley del electromagnetismo',
  '1.7':'2ª ley del electromagnetismo',
  '1.8':'3ª ley del electromagnetismo',
  '1.9':'Materiales magnéticos y curva de magnetización',
  '1.10':'Histéresis magnética',
  '1.11':'Corrientes parásitas (de Foucault)',
  '3.12':'Principio de funcionamiento del transformador',
  '3.13':'Terminales homólogos',
  '3.14':'Tipos de transformadores',
  '3.15':'Ensayo de vacío',
  '3.16':'Ensayo de cortocircuito',
  '3.17':'Ensayo de carga',
  '3.18':'Pruebas de aislamiento'
};
const TEMAS={'1':'Tema 1. Electromagnetismo','3':'Tema 3. Transformadores'};

// Animaciones: para añadir una nueva, basta con añadir una línea aquí
const ANIM=[
  {f:'imanes_lineas.html',      t:'Imanes y líneas de fuerza', d:'Un imán, dos que se atraen y dos que se repelen. Líneas de fuerza, limaduras de hierro y una brújula que puedes mover.', p:['1.2']},
  {f:'fuerza_conductor.html',   t:'Fuerza sobre un conductor con corriente', d:'Un cable y una espira dentro de un imán: hacia dónde empuja la fuerza, regla de la mano izquierda y cómo gira un motor.', p:['1.7']},
  {f:'induccion.html',            t:'Tensión y corriente inducidas', d:'Mete y saca un imán de una bobina y mira la aguja. Electroimán con corriente alterna o continua (con y sin núcleo) y espira que gira: el alternador.', p:['1.8']},
  {f:'curva_magnetizacion.html',  t:'Curva de magnetización', d:'Sube la corriente y mira cuánta inducción consigue cada material: zona recta, codo y saturación.', p:['1.9']},
  {f:'histeresis.html',           t:'Histéresis magnética', d:'El ciclo de histéresis con corriente alterna: remanencia, campo coercitivo y materiales blandos y duros.', p:['1.10']},
  {f:'foucault.html',             t:'Corrientes de Foucault', d:'Núcleo macizo frente a núcleo de chapas: los remolinos de corriente y el calor.', p:['1.11']},
  {f:'trafo_funcionamiento.html', t:'Cómo funciona un transformador', d:'Primario, secundario y flujo en el núcleo. Cambia las espiras y prueba con corriente continua.', p:['3.12']},
  {f:'homologos.html',            t:'Terminales homólogos', d:'Dónde va el punto según el sentido del bobinado, y cuatro bobinas de 50 V en serie.', p:['3.13']},
  {f:'tipos_trafo.html',          t:'Tipos de transformadores', d:'El dibujo de cada tipo con su nombre, y un modo examen para ver si te los sabes.', p:['3.14']},
  {f:'ensayo_vacio.html',         t:'Ensayo de vacío', d:'Conexionado, lecturas y pérdidas en el hierro. Con el trafo construido en el aula, uno pequeño típico y uno real de 1 MW.', p:['3.15']},
  {f:'ensayo_cortocircuito.html', t:'Ensayo de cortocircuito', d:'Desde cero hasta la corriente nominal: tensión de cortocircuito y pérdidas en el cobre. Aula y trafo de 1 MW.', p:['3.16']},
  {f:'ensayo_carga.html',         t:'Ensayo de carga', d:'Sube la carga y mira la caída de tensión y el rendimiento. Aula y trafo de 1 MW.', p:['3.17']},
  {f:'aislamiento.html',          t:'Pruebas de aislamiento', d:'Las tres medidas con el megóhmetro: el trafo del aula antes y después de quemarse, y un trafo de 1 MW.', p:['3.18']},
  {f:'flujo_induccion.html',    t:'Campo, flujo e inducción', d:'Mueve una ventana sobre el imán y cuenta las líneas: el flujo es el total y la inducción, las líneas por cuadradito.', p:['1.2','1.3']},
  {f:'circuito_magnetico.html', t:'La bobina y el circuito magnético', d:'Corriente, espiras, longitud, grosor, hierro o aire y entrehierro: qué cambia y qué no.', p:['1.3','1.4','1.5']},
  {f:'campo_corriente.html',    t:'La corriente crea un campo magnético', d:'Cable, espira y bobina. Brújulas, líneas de campo y regla de la mano derecha.', p:['1.6']},
];

const ord=k=>k.split('.').map(Number); const cmp=(a,b)=>{const x=ord(a),y=ord(b);return x[0]-y[0]||x[1]-y[1];};
ANIM.forEach(a=>a.p.sort(cmp)); ANIM.sort((a,b)=>cmp(a.p[0],b.p[0]));
const L=document.getElementById('list'); let tema=null;
for(const a of ANIM){
  const tm=a.p[0].split('.')[0];
  if(tm!==tema){tema=tm;const h=document.createElement('h2');h.className='tema';h.textContent=TEMAS[tm]||('Tema '+tm);L.appendChild(h);}
  const card=document.createElement('a'); card.className='card'; card.href=a.f;
  const rango=a.p.length>1?a.p[0]+'<small>a</small>'+a.p[a.p.length-1]:a.p[0];
  card.innerHTML=`<div class="num"><small>Punto${a.p.length>1?'s':''}</small>${a.p.length===2?a.p.join('<small>y</small>'):rango}</div>
    <div><h3>${a.t}</h3><p>${a.d}</p>
    <div class="pts">${a.p.map(n=>`<span class="pt"><b>${n}</b> ${PUNTOS[n]||''}</span>`).join('')}</div></div>`;
  L.appendChild(card);
}
// Herramientas para el taller (no van con un punto concreto)
const HERR=[{f:'calculadora_trafo.html',t:'Calculadora de transformadores pequeños',d:'Carrete de 40 × 40 mm. Pon la potencia, la tensión, las chapas, las espiras y el hilo que tienes: salen tensiones, corrientes, inducción real, capas del bobinado y si cabe y funciona. Método del formulario de la práctica P1.'}];
{const h=document.createElement('h2');h.className='tema';h.textContent='Taller: construcción de transformadores';L.appendChild(h);
 for(const a of HERR){const c=document.createElement('a');c.className='card';c.href=a.f;c.innerHTML=`<div class="num"><small>Taller</small>🔧</div><div><h3>${a.t}</h3><p>${a.d}</p></div>`;L.appendChild(c);}}
</script>
</body>
</html>
