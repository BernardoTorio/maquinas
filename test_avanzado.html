<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test avanzado · Máquinas Eléctricas 2MB</title>

<style>
:root{
  --bg:#EEF1F4; --card:#ffffff; --ink:#1a1a1a; --muted:#56606b; --line:#cfd6de; --bar:#6A9A1F;
  --green:#1F4E79; --green-soft:#e3ecf6; --red:#c0392b; --red-soft:#fbe4e1;
  --ok:#2e7d32; --ok-soft:#e3f3e4; --yellow:#b7860b; --yellow-soft:#fdf5dc;
  --blue:#1f5fbf; --btn:#e9eef3; --on-green:#fff; --shadow:0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#15191e; --card:#1f252c; --ink:#eef1f4; --muted:#a9b3bd; --line:#36404b; --bar:#6A9A1F;
  --green:#8EC1F0; --green-soft:#26323f; --red:#ef6b5d; --red-soft:#3a201d;
  --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
  --blue:#7aa7f0; --btn:#26323f; --on-green:#0f1a26; --shadow:0 1px 3px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191e; --card:#1f252c; --ink:#eef1f4; --muted:#a9b3bd; --line:#36404b; --bar:#6A9A1F;
    --green:#8EC1F0; --green-soft:#26323f; --red:#ef6b5d; --red-soft:#3a201d;
    --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
    --blue:#7aa7f0; --btn:#26323f; --on-green:#0f1a26; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:17px;line-height:1.45}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--bar);position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}
.back{border:1px solid var(--line);background:var(--btn);color:var(--ink);padding:6px 12px;border-radius:8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.back:hover{border-color:var(--green)}
.crumbs{font-size:14px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--green);text-decoration:none}
.crumbs b{color:var(--ink)}
.theme{border:1px solid var(--line);background:var(--btn);color:var(--ink);width:38px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:26px;margin:6px 0 2px;font-weight:700}
h1 span{color:var(--green)}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.box{border-left:5px solid var(--green);background:var(--green-soft);border-radius:8px;padding:10px 14px;margin:12px 0}
.box .lbl{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--green);display:block;margin-bottom:2px}
.box.why{border-color:var(--yellow);background:var(--yellow-soft)}
.box.why .lbl{color:var(--yellow)}
fieldset{border:none;padding:0;margin:0 0 14px}
legend{font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip>span{display:inline-block;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--btn);cursor:pointer;font-size:15px;user-select:none}
.chip input:checked+span{border-color:var(--green);background:var(--green-soft);font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
.cnt{color:var(--muted);font-size:13px}
.go{background:var(--green);color:var(--on-green);border:none;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.go.ghost{background:var(--btn);color:var(--ink);border:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--btn)}
.tag.d{border-color:var(--red);color:var(--red)}
.score{margin-left:auto;font-weight:700;color:var(--ink)}
.qtext{font-size:19px;font-weight:700;margin:6px 0 12px}
.qn{color:var(--green)}
figure{margin:0 0 12px;text-align:center}
figure img{max-width:100%;max-height:520px;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line);cursor:zoom-in}
figcaption{font-size:14px;color:var(--muted);font-style:italic;margin-top:4px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--btn);font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.verdict{font-weight:700;font-size:18px;margin-top:12px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--red)}
.nav{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.big{font-size:44px;font-weight:700;color:var(--green);margin:0}
.review{border-top:1px solid var(--line);padding:12px 0}
.review .rq{font-weight:700}
.review .ra{color:var(--ok);font-weight:700}
.review .ry{color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:16px}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px;padding:8px}
@media (max-width:560px){body{font-size:16px}.qtext{font-size:17px}h1{font-size:22px}.crumbs{font-size:12px}}
</style>
</head>

s corriente", "La B, porque tiene más espiras", "No se puede saber sin conocer el núcleo"], "j": "Se consigue lo mismo con muchas espiras y poca corriente o con pocas espiras y más corriente.", "img": null, "cap": "", "n": 17, "o": [3, 1, 0, 2]}, {"tema": "T1", "t": "T1 · punto 1.4 Intensidad de campo y fuerza magnetomotriz", "dif": "D", "tipo": "CON", "q": "Para la intensidad de campo, ¿qué longitud cuenta?", "ok": "La del camino de las líneas: el perímetro medio del núcleo", "d": ["La longitud del hilo de la bobina", "El diámetro del hilo", "La altura del carrete"], "j": "No es la longitud del hilo, sino la del recorrido de las líneas.", "img": null, "cap": "", "n": 18, "o": [0, 1, 3, 2]}, {"tema": "T1", "t": "T1 · punto 1.4 Intensidad de campo y fuerza magnetomotriz", "dif": "D", "tipo": "CON", "q": "Al rebobinar un motor de alterna pones MENOS espiras que las originales. ¿Qué pasa?", "ok": "El flujo sube, el hierro se satura, la corriente se dispara y se calienta", "d": ["El flujo baja y el motor pierde fuerza", "Nada, si el hilo es más grueso", "Gira más deprisa sin calentarse"], "j": "A tensión fija, el número de espiras lo marca la tensión: respétalo siempre.", "img": null, "cap": "", "n": 19, "o": [0, 2, 3, 1]}, {"tema": "T1", "t": "T1 · punto 1.4 Intensidad de campo y fuerza magnetomotriz", "dif": "D", "tipo": "CON", "q": "Y si al rebobinar pones MÁS espiras de las originales, ¿qué pasa?", "ok": "El flujo baja y la máquina pierde fuerza", "d": ["El hierro se satura", "Se quema enseguida", "Hace más fuerza que antes"], "j": "Con más espiras, el flujo que hace falta para la misma tensión es menor.", "img": null, "cap": "", "n": 20, "o": [1, 0, 3, 2]}, {"tema": "T1", "t": "T1 · punto 1.4 Intensidad de campo y fuerza magnetomotriz", "dif": "D", "tipo": "CON", "q": "Dos núcleos del mismo material, con la misma bobina y la misma corriente; uno es el doble de largo. ¿Qué tienen igual?", "ok": "La fuerza magnetomotriz", "d": ["La intensidad de campo", "La inducción", "El flujo"], "j": "La f.m.m. depende solo de la bobina; H, B y el flujo bajan en el núcleo largo.", "img": null, "cap": "", "n": 21, "o": [1, 3, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "M", "tipo": "CON", "q": "En la comparación entre circuito eléctrico y magnético, ¿qué corresponde a la resistencia?", "ok": "La reluctancia", "d": ["La fuerza magnetomotriz", "El flujo", "La inducción"], "j": "La f.m.m. es la pila, el flujo la corriente y el núcleo el cable.", "img": null, "cap": "", "n": 22, "o": [3, 1, 0, 2]}, {"tema": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "M", "tipo": "CON", "q": "¿Qué papel tiene la bobina en el circuito magnético?", "ok": "Es la fuente: crea la fuerza magnetomotriz, como la pila", "d": ["Es el \"cable\" que conduce el flujo", "Es la reluctancia del circuito", "Es el entrehierro"], "j": "El que conduce el flujo es el núcleo.", "img": null, "cap": "", "n": 23, "o": [1, 0, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "D", "tipo": "CON", "q": "¿Por qué un milímetro de aire \"gasta\" más que muchos centímetros de hierro?", "ok": "Porque el aire tiene muchísima más reluctancia que el hierro", "d": ["Porque el aire conduce mejor el flujo", "Porque el aire se calienta", "Porque el hierro no tiene ninguna reluctancia"], "j": "Con núcleo de hierro, el campo es cientos o miles de veces mayor que con aire.", "img": null, "cap": "", "n": 24, "o": [2, 1, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "D", "tipo": "CON", "q": "Un contactor tiene el núcleo sucio o mal asentado. ¿Qué le pasa?", "ok": "Vibra, zumba y calienta su bobina", "d": ["Funciona mejor", "Se queda pegado al cortar la corriente", "Consume menos"], "j": "La suciedad deja un entrehierro de aire que le pone mucha dificultad al flujo.", "img": null, "cap": "", "n": 25, "o": [0, 1, 3, 2]}, {"tema": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "D", "tipo": "CON", "q": "¿Por qué el entrehierro de los motores se hace lo más pequeño posible?", "ok": "Porque el aire pone mucha dificultad al flujo y haría falta mucha más corriente", "d": ["Para que el rotor no gire tan deprisa", "Porque el aire aísla del calor", "Para que el motor pese menos"], "j": "Por lo mismo, las chapas deben ir bien apretadas y sin huecos.", "img": null, "cap": "", "n": 26, "o": [0, 3, 2, 1]}, {"tema": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "D", "tipo": "CON", "q": "En un motor, ¿cuántas veces atraviesa el flujo el entrehierro en su recorrido?", "ok": "Dos: del estator al rotor y del rotor al estator", "d": ["Ninguna", "Una", "Cuatro"], "j": "El circuito es cerrado: si entra en el rotor, tiene que volver a salir.", "img": null, "cap": "", "n": 27, "o": [2, 3, 1, 0]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "En un dibujo aparece ⊗ sobre un cable. ¿Qué significa?", "ok": "Que la corriente entra en el papel: vemos la cola de la flecha", "d": ["Que la corriente sale del papel", "Que es corriente alterna", "Que es un borne homólogo"], "j": "⊙ es la que sale: vemos la punta de la flecha.", "img": null, "cap": "", "n": 28, "o": [3, 2, 0, 1]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "Un cable vertical lleva la corriente hacia arriba. Visto desde arriba, ¿cómo giran las líneas?", "ok": "En sentido contrario a las agujas del reloj", "d": ["En el sentido de las agujas del reloj", "No giran: salen rectas del cable", "Depende del material del cable"], "j": "Mano derecha: pulgar hacia arriba (hacia ti) y los dedos se cierran en sentido antihorario.", "img": null, "cap": "", "n": 29, "o": [2, 1, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "En una bobina, ¿cómo se usa la regla de la mano derecha?", "ok": "Los dedos siguen la corriente por las espiras y el pulgar señala el polo N", "d": ["El pulgar sigue la corriente y los dedos señalan el polo N", "El índice sigue la corriente y el pulgar señala el polo S", "En una bobina no se puede usar"], "j": "En el cable recto es al revés: el pulgar es la corriente y los dedos, las líneas.", "img": null, "cap": "", "n": 30, "o": [1, 2, 0, 3]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "¿Qué tiene una espira con corriente?", "ok": "Una cara N, por donde salen las líneas, y otra cara S", "d": ["Solo un polo norte", "Ningún polo", "Cuatro polos"], "j": "Las líneas de todos los tramos pasan por dentro en el mismo sentido.", "img": null, "cap": "", "n": 31, "o": [0, 2, 3, 1]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "En un motor, una bobina se conectó al revés. ¿Qué pasa?", "ok": "Los polos quedan mal formados: pierde fuerza, hace ruido y se calienta", "d": ["Gira al revés, pero bien", "Funciona mejor", "No arranca, pero tampoco se calienta"], "j": "Invertir principio y final de una bobina invierte sus polos.", "img": null, "cap": "", "n": 32, "o": [3, 1, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "Duplicamos la corriente que pasa por un cable recto. ¿Qué le pasa al campo?", "ok": "Se hace más intenso", "d": ["Cambia el sentido de las líneas", "Desaparece", "Las líneas pasan a ser rectas"], "j": "Cuanta más corriente, más intenso es el campo.", "img": null, "cap": "", "n": 33, "o": [2, 1, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "¿Por qué aparece una fuerza sobre un conductor con corriente dentro de un imán?", "ok": "Su campo se suma al del imán por un lado y se resta por el otro: va hacia el lado más débil", "d": ["Porque el imán atrae al cobre", "Porque la corriente calienta el cable y lo dilata", "Porque el conductor busca el lado donde el campo es más fuerte"], "j": "El conductor es empujado hacia donde el campo es más débil.", "img": null, "cap": "", "n": 34, "o": [0, 2, 3, 1]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "Imán con el N arriba y el S abajo. Entre los polos, un cable con la corriente entrando en el papel (⊗). ¿Hacia dónde se mueve?", "ok": "Hacia la izquierda", "d": ["Hacia la derecha", "Hacia arriba", "Hacia abajo"], "j": "Mano izquierda: índice hacia abajo (campo de N a S), corazón hacia el papel (corriente), pulgar a la izquierda.", "img": null, "cap": "", "n": 35, "o": [1, 0, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "Invertimos a la vez el sentido de la corriente y los polos del imán. ¿Qué le pasa a la fuerza?", "ok": "Sigue en el mismo sentido", "d": ["Se invierte", "Desaparece", "Se duplica"], "j": "Cada cambio la invierte una vez: dos cambios la dejan como estaba.", "img": null, "cap": "", "n": 36, "o": [0, 2, 3, 1]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "Un cable de 2 m pasa por un imán, pero solo 10 cm quedan dentro del campo. ¿Qué longitud cuenta para la fuerza?", "ok": "Los 10 cm que están dentro del campo", "d": ["Los 2 m de cable", "El diámetro del cable", "Ninguna: la longitud no influye"], "j": "La fuerza es mayor cuanto más largo es el trozo de conductor dentro del campo.", "img": null, "cap": "", "n": 37, "o": [0, 1, 3, 2]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "¿Cuál de estos aparatos funciona por la 2ª ley (fuerza sobre un conductor)?", "ok": "El altavoz", "d": ["El alternador", "La dinamo", "El transformador"], "j": "También los motores y los aparatos de medida de aguja. Alternador, dinamo y trafo son la 3ª ley.", "img": null, "cap": "", "n": 38, "o": [1, 3, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "¿Qué mano se usa en cada caso?", "ok": "Motor (fuerza): mano izquierda. Generador (tensión inducida): mano derecha", "d": ["Motor: mano derecha. Generador: mano izquierda", "Las dos con la mano derecha", "Las dos con la mano izquierda"], "j": "Truco: Izquierda → corrIente produce movimiento (motor). Derecha → Dinamo.", "img": null, "cap": "", "n": 39, "o": [0, 2, 3, 1]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "¿En cuál de estos casos NO se induce tensión en una bobina?", "ok": "Un imán quieto dentro de la bobina", "d": ["Metiendo y sacando un imán", "Girando la bobina dentro de un campo", "Variando la corriente de un electroimán cercano, sin mover nada"], "j": "La palabra clave es VARÍA: si el flujo no cambia, no se induce nada.", "img": null, "cap": "", "n": 40, "o": [2, 3, 1, 0]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "En un transformador se induce tensión en el secundario sin mover nada. ¿Cuál de las tres formas de la 3ª ley es?", "ok": "Variar la corriente de un electroimán: la alterna del primario", "d": ["Mover el conductor dentro de un campo fijo", "Mover un imán respecto a la bobina", "Ninguna: el trafo no funciona por la 3ª ley"], "j": "Mover el conductor es la de los generadores (dinamo, alternador).", "img": null, "cap": "", "n": 41, "o": [1, 3, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "Acercas el polo N de un imán a una bobina cerrada. ¿Qué polo forma la bobina en ese lado?", "ok": "Un polo N, que repele al imán", "d": ["Un polo S, que atrae al imán", "Ninguno", "Depende de si el hilo es de cobre o de aluminio"], "j": "Ley de Lenz: la corriente inducida se opone a la causa que la produce.", "img": null, "cap": "", "n": 42, "o": [1, 0, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "¿Por qué cuesta más girar un generador cuando tiene carga?", "ok": "Porque la corriente inducida se opone al movimiento que la produce (ley de Lenz)", "d": ["Porque la carga pesa más", "Porque el campo del imán desaparece", "No cuesta más: cuesta lo mismo con carga y sin ella"], "j": "Sin carga no hay corriente inducida, y nada se opone.", "img": null, "cap": "", "n": 43, "o": [1, 0, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "Al meter un imán en una bobina la aguja se va a la derecha. ¿Qué pasa al sacarlo?", "ok": "La aguja se va a la izquierda: la corriente cambia de sentido", "d": ["Se va otra vez a la derecha", "Se va a la derecha el doble", "No se mueve"], "j": "Meter y sacar el imán producen corrientes de sentidos contrarios.", "img": null, "cap": "", "n": 44, "o": [1, 2, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "D", "tipo": "CON", "q": "En la regla de la mano derecha (generador), ¿qué indica el dedo corazón?", "ok": "El sentido de la corriente inducida", "d": ["El sentido del movimiento", "El sentido del campo", "El sentido de la fuerza"], "j": "Pulgar → movimiento; índice → campo; corazón → corriente inducida.", "img": null, "cap": "", "n": 45, "o": [3, 2, 0, 1]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "Una espira gira dentro de un campo magnético. ¿Qué tensión aparece?", "ok": "Alterna: cambia de valor y de sentido en cada vuelta", "d": ["Continua y constante", "Ninguna", "Continua que solo sube"], "j": "Así se genera la corriente alterna en un alternador.", "img": null, "cap": "", "n": 46, "o": [3, 1, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "D", "tipo": "CON", "q": "¿Cómo se clasifica el aluminio?", "ok": "Paramagnético: en máquinas se considera amagnético, como el aire", "d": ["Ferromagnético", "Diamagnético, y por eso es buen núcleo", "Igual que el hierro, pero más ligero"], "j": "Los paramagnéticos se orientan muy poco a favor del campo.", "img": null, "cap": "", "n": 47, "o": [1, 3, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "D", "tipo": "CON", "q": "¿Cuál de estos materiales es diamagnético?", "ok": "El cobre", "d": ["El hierro", "El aire", "El aluminio"], "j": "Los diamagnéticos se oponen muy débilmente al campo: cobre, oro, plata, grafito.", "img": null, "cap": "", "n": 48, "o": [2, 0, 1, 3]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "M", "tipo": "CON", "q": "En la zona de saturación, ¿por qué B casi no sube aunque H aumente mucho?", "ok": "Porque todos los \"imanes\" internos del hierro ya están alineados", "d": ["Porque la bobina se queda sin corriente", "Porque el hierro se convierte en aire", "Porque baja la tensión de la red"], "j": "El hierro ya está \"lleno\".", "img": null, "cap": "", "n": 49, "o": [1, 0, 3, 2]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "D", "tipo": "CON", "q": "En la tabla de los apuntes, de 0 a 100 Av/m B sube 1 T, y de 1000 a 2000 Av/m solo 0,08 T. ¿En qué zonas está cada tramo?", "ok": "El primero en la zona lineal y el segundo en la de saturación", "d": ["El primero en saturación y el segundo en la zona lineal", "Los dos en el codo", "Los dos en la zona lineal"], "j": "En la zona lineal, poco H da mucho B; en saturación, mucho H casi no da más B.", "img": null, "cap": "", "n": 50, "o": [3, 1, 0, 2]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "D", "tipo": "CON", "q": "¿En qué zona de la curva se diseñan para trabajar las máquinas?", "ok": "En el codo: cerca de la saturación, pero sin llegar", "d": ["En plena saturación, para aprovechar el hierro", "Al principio de la zona lineal, con muy poca inducción", "Da igual la zona"], "j": "Si se entra en saturación, la corriente se dispara y el núcleo se calienta.", "img": null, "cap": "", "n": 51, "o": [0, 2, 1, 3]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "D", "tipo": "CON", "q": "¿Cómo es la curva B-H del aire?", "ok": "Una recta casi pegada al eje: hace falta muchísima H para conseguir poca B", "d": ["Igual que la del hierro", "Se satura antes que el hierro", "Tiene un codo muy marcado"], "j": "Por eso los núcleos se hacen de hierro.", "img": null, "cap": "", "n": 52, "o": [1, 2, 0, 3]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "M", "tipo": "CON", "q": "¿Qué es la remanencia (Br)?", "ok": "El magnetismo que le queda al material al quitar el campo", "d": ["El campo necesario para desimantarlo", "La inducción máxima de saturación", "El área del ciclo de histéresis"], "j": "Es la \"memoria\" del hierro.", "img": null, "cap": "", "n": 53, "o": [3, 1, 0, 2]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "M", "tipo": "CON", "q": "Para dejar B = 0 después de quitar la corriente, ¿qué hay que hacer?", "ok": "Aplicar un campo en sentido contrario: el campo coercitivo", "d": ["Aumentar el campo en el mismo sentido", "Esperar un rato a que se desimante solo", "Subir la frecuencia"], "j": "El campo coercitivo (Hc) es el que deja la inducción a cero.", "img": null, "cap": "", "n": 54, "o": [2, 0, 3, 1]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "D", "tipo": "CON", "q": "¿De qué depende la energía que se pierde por histéresis en cada ciclo?", "ok": "Del área del ciclo: cuanto más ancho, más calor", "d": ["Solo de la altura del ciclo", "De la longitud del hilo de la bobina", "De nada: en la histéresis no se pierde energía"], "j": "A los \"imanes\" internos les cuesta girar, y esa energía se convierte en calor.", "img": null, "cap": "", "n": 55, "o": [3, 0, 1, 2]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "D", "tipo": "CON", "q": "Con corriente alterna de 50 Hz, ¿cuántas veces por segundo se recorre el ciclo de histéresis?", "ok": "50", "d": ["1", "100", "3000"], "j": "Un ciclo completo por cada ciclo de la corriente.", "img": null, "cap": "", "n": 56, "o": [3, 1, 0, 2]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "M", "tipo": "CON", "q": "¿Qué se añade al hierro para mejorar los materiales blandos de los núcleos?", "ok": "Alrededor de un 3 % de silicio", "d": ["Un 30 % de cobre", "Un 30 % de carbono", "Aluminio"], "j": "El silicio también reduce las corrientes de Foucault (1.11).", "img": null, "cap": "", "n": 57, "o": [0, 1, 3, 2]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "D", "tipo": "CON", "q": "Las pérdidas por histéresis, junto con las de Foucault, forman…", "ok": "Las pérdidas en el hierro, que se miden en el ensayo de vacío", "d": ["Las pérdidas en el cobre, que se miden en el cortocircuito", "El flujo de dispersión", "La resistencia de aislamiento"], "j": "PFe = histéresis + Foucault.", "img": null, "cap": "", "n": 58, "o": [0, 1, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "D", "tipo": "CON", "q": "¿Por qué aparecen corrientes de Foucault dentro del núcleo?", "ok": "El flujo alterno induce tensiones en el hierro (3ª ley) y, como el hierro conduce, circulan corrientes", "d": ["Porque el cobre de la bobina toca el núcleo", "Por fugas del aislamiento de la bobina", "Porque el hierro es un imán permanente"], "j": "El hierro, además de magnético, es conductor.", "img": null, "cap": "", "n": 59, "o": [2, 0, 3, 1]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "D", "tipo": "CON", "q": "¿Cuál de estas medidas NO reduce las corrientes de Foucault?", "ok": "Trabajar a más frecuencia de la de diseño", "d": ["Hacer el núcleo de chapas finas aisladas", "Añadir silicio al hierro", "Aislar los tornillos pasantes"], "j": "Son mayores cuanto más grueso es el hierro,  "o": [2, 0, 1, 3]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "M", "tipo": "CON", "q": "¿Por qué el transformador es una máquina estática?", "ok": "Porque no tiene piezas en movimiento", "d": ["Porque solo funciona con corriente continua", "Porque no se calienta", "Porque produce electricidad estática"], "j": "Cambia el valor de una tensión alterna sin mover nada.", "img": null, "cap": "", "n": 65, "o": [2, 3, 0, 1]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "D", "tipo": "CON", "q": "¿Qué ley crea el flujo en el núcleo y cuál induce la tensión en el secundario?", "ok": "El flujo lo crea la 1ª ley y la tensión la induce la 3ª", "d": ["El flujo, la 2ª ley, y la tensión, la 3ª", "El flujo, la 3ª ley, y la tensión, la 1ª", "El flujo, la 2ª ley, y la tensión, la 1ª"], "j": "La corriente del primario crea el flujo (1ª); el flujo variable induce tensión (3ª).", "img": null, "cap": "", "n": 66, "o": [2, 3, 1, 0]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "D", "tipo": "CON", "q": "En un trafo de 230 / 24 V, ¿qué devanado tiene el hilo más grueso?", "ok": "El de 24 V, porque lleva más corriente", "d": ["El de 230 V, porque tiene más tensión", "Los dos igual", "El que tiene más espiras"], "j": "La corriente hace lo contrario que la tensión.", "img": null, "cap": "", "n": 67, "o": [2, 1, 0, 3]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "D", "tipo": "CON", "q": "Un trafo tiene 400 espiras en el primario y 1200 en el secundario. Con 100 V en el primario, ¿qué da el secundario?", "ok": "Unos 300 V: es un elevador", "d": ["Unos 33 V: es un reductor", "100 V", "1200 V"], "j": "El secundario tiene el triple de espiras: el triple de tensión.", "img": null, "cap": "", "n": 68, "o": [2, 3, 1, 0]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "D", "tipo": "CON", "q": "¿Cuál de estas cosas NO es una pérdida del transformador real?", "ok": "La relación de transformación", "d": ["Las pérdidas en el cobre", "Las pérdidas en el hierro", "El flujo de dispersión"], "j": "La relación de transformación es la relación entre espiras, no una pérdida.", "img": null, "cap": "", "n": 69, "o": [2, 3, 0, 1]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "M", "tipo": "CON", "q": "¿Qué es el flujo de dispersión?", "ok": "Las líneas que se escapan por el aire y no llegan al otro devanado", "d": ["El flujo común a los dos devanados", "Las corrientes de Foucault del núcleo", "El magnetismo remanente"], "j": "El flujo común a los dos devanados es el flujo mutuo.", "img": null, "cap": "", "n": 70, "o": [3, 0, 2, 1]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "D", "tipo": "CON", "q": "¿Qué rendimiento tienen los transformadores?", "ok": "Más del 90 % en los medianos y grandes, y menos en los muy pequeños", "d": ["Siempre el 100 %", "Siempre menos del 50 %", "Mayor en los pequeños que en los grandes"], "j": "Nuestros trafos de la práctica, con hierro malo y poca carga, dieron un 11-13 %.", "img": null, "cap": "", "n": 71, "o": [0, 2, 1, 3]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "D", "tipo": "CON", "q": "Conectamos el primario de un trafo de 230 V a 230 V de corriente continua. ¿Qué pasa?", "ok": "No sale tensión en el secundario y el primario se calienta mucho: puede quemarse", "d": ["Funciona igual que en alterna", "Da en el secundario corriente continua reducida", "Da en el secundario corriente alterna"], "j": "Con continua el flujo no varía: no se induce nada y solo frena la corriente la resistencia del cobre.", "img": null, "cap": "", "n": 72, "o": [2, 1, 3, 0]}, {"tema": "T3", "t": "T3 · punto 3.13 Terminales homólogos", "dif": "D", "tipo": "CON", "q": "Un trafo tiene dos s  pero P1 sube 12 W. ¿Por qué?", "ok": "La corriente de la lámpara es poca al lado de la de vacío, pero el vatímetro sí mide su potencia", "d": ["Porque la lámpara no se encendió", "Porque el amperímetro estaba mal", "Porque la corriente del secundario nunca llega al primario"], "j": "Casi toda la corriente de vacío es para magnetizar el hierro.", "img": null, "cap": "", "n": 95, "o": [2, 3, 0, 1]}, {"tema": "T3", "t": "T3 · punto 3.17 Ensayo en carga", "dif": "D", "tipo": "CON", "q": "A plena carga, el trafo se calienta muy rápido. ¿Qué puede pasar?", "ok": "Sección de hilo insuficiente, mala impregnación o mala ventilación", "d": ["Le sobran chapas", "Su tensión de cortocircuito es baja", "Su aislamiento está por encima de 999 MΩ"], "j": "Se mantiene la plena carga un rato para comprobar temperatura, ruido y olor a barniz.", "img": null, "cap": "", "n": 96, "o": [1, 0, 2, 3]}, {"tema": "T3", "t": "T3 · punto 3.18 Pruebas de aislamiento", "dif": "D", "tipo": "CON", "q": "Para medir el aislamiento entre devanados, se unen todos los bornes del primario entre sí y todos los del secundario entre sí. ¿Para qué?", "ok": "Para medir de una vez el aislamiento entre todo el primario y todo el secundario", "d": ["Para medir la resistencia del cobre", "Para que circule la corriente nominal", "Para descargar el núcleo"], "j": "Luego se pone una punta del megóhmetro en cada grupo.", "img": null, "cap": "", "n": 97, "o": [2, 0, 3, 1]}, {"tema": "T3", "t": "T3 · punto 3.18 Pruebas de aislamiento", "dif": "D", "tipo": "CON", "q": "¿Por qué se usa un megóhmetro y no el polímetro en ohmios?", "ok": "Porque aplica una tensión continua alta (500 V) y mide megaohmios: ve fugas que el polímetro no ve", "d": ["Porque el polímetro no mide resistencias", "Porque el megóhmetro mide la corriente de carga", "Porque el polímetro solo funciona en alterna"], "j": "El polímetro mide con muy poca tensión.", "img": null, "cap": "", "n": 98, "o": [1, 2, 3, 0]}, {"tema": "T3", "t": "T3 · punto 3.18 Pr const IMGS = {};
const TEMAS = {T1:"T1 Electromagnetismo",T3:"T3 Transformadores"};
const TIPO = {CON:"Concepto",UNI:"Unidades",QPS:"Qué pasa si…",APL:"En la máquina real"};
const app = document.getElementById('app');

/* ---------- tema claro/oscuro ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem('maq-tema'); if (t) root.dataset.theme = t; } catch(e) {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('maq-tema', root.dataset.theme); } catch(e) {}
};

/* ---------- zoom de esquemas ---------- */
const zoom = document.getElementById('zoom');
zoom.onclick = () => zoom.style.display = 'none';
function openZoom(src){ zoom.querySelector('img').src = src; zoom.style.display = 'flex'; }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (zoom.style.display === 'flex') { zoom.style.display = 'none'; return; }
    location.href = 'index.html#tests'; return;
  }
  if (e.key === 'Backspace' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    location.href = 'index.html#tests'; return;
  }
  if (state.screen !== 'q') return;
  const k = e.key.toLowerCase();
  const idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (!state.answered && idx >= 0) { answer(idx); e.preventDefault(); }
  else if (state.answered && (e.key === 'Enter' || e.key === ' ')) { next(); e.preventDefault(); }
});

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let state = { screen: 'start' };

/* ---------- inicio ---------- */
function start(){
  state = { screen: 'start' };
  const cnt = t => DATA.filter(q => q.tema === t).length;
  app.innerHTML = `
  <h1>Test avanzado · <span>Temas 1 y 3</span></h1>
  <p class="sub">${DATA.length} preguntas de todos los puntos, del 1.1 al 3.18 y en ese orden. <b>Es más difícil</b> que los de iniciación: casos del taller, «qué pasa si…», frases falsas y datos de nuestros trafos.</p>
  <div class="card">
    <fieldset><legend>Temas</legend><div class="chips">
      ${Object.keys(TEMAS).map(t => `<label class="chip"><input type="checkbox" name="tema" value="${t}" checked><span>${TEMAS[t]} <span class="cnt">(${cnt(t)})</span></span></label>`).join('')}
    </div></fieldset>
    <fieldset><legend>Dificultad</legend><div class="chips">
      <label class="chip"><input type="radio" name="dif" value="all" checked><span>Todas</span></label>
      <label class="chip"><input type="radio" name="dif" value="M"><span>Medias</span></label>
      <label class="chip"><input type="radio" name="dif" value="D"><span>Difíciles</span></label>
    </div></fieldset>
    <fieldset><legend>Orden</legend><div class="chips">
      <label class="chip"><input type="radio" name="ord" value="fix" checked><span>Por orden (1, 2, 3…)</span></label>
      <label class="chip"><input type="radio" name="ord" value="mix"><span>Mezcladas</span></label>
    </div></fieldset>
    <fieldset><legend>Número de preguntas</legend><div class="chips">
      ${[20,40,60].map((n,i) => `<label class="chip"><input type="radio" name="num" value="${n}" ${i===1?'checked':''}><span>${n}</span></label>`).join('')}
      <label class="chip"><input type="radio" name="num" value="0"><span>Todas</span></label>
    </div></fieldset>
    <p id="avail" class="cnt"></p>
    <button class="go" id="go">Empezar</button>
  </div>
  <div class="box"><span class="lbl">CÓMO FUNCIONA</span>
    Elige una respuesta tocándola (o con las teclas A, B, C, D). Aciertes o no, verás <b>por qué</b> es esa la respuesta.
    <b>Por orden</b>: las preguntas van del 1 al 100, en el orden de los puntos de los apuntes y las respuestas, con las mismas letras que el test en papel. <b>Mezcladas</b>: cambian el orden de las preguntas y de las respuestas cada vez.</div>`;
  const upd = () => {
    const pool = filtered();
    document.getElementById('avail').textContent = `Hay ${pool.length} preguntas con estos filtros.`;
    document.getElementById('go').disabled = pool.length === 0;
  };
  app.querySelectorAll('input').forEach(i => i.onchange = upd);
  upd();
  document.getElementById('go').onclick = () => {
    const n = +app.querySelector('input[name=num]:checked').value;
    const mix = app.querySelector('input[name=ord]:checked').value === 'mix';
    let pool = filtered();
    if (mix) pool = shuffle(pool);
    if (n) pool = pool.slice(0, n);
    state = { screen: 'q', mix, list: pool.map(q => ({ q, order: mix ? shuffle([0,1,2,3]) : q.o.slice(), pick: null })), i: 0, ok: 0, answered: false };
    show();
  };
}
function filtered(){
  const temas = [...app.querySelectorAll('input[name=tema]:checked')].map(i => i.value);
  const dif = app.querySelector('input[name=dif]:checked').value;
  return DATA.filter(q => temas.includes(q.tema) && (dif === 'all' || q.dif === dif));
}

/* ---------- pregunta ---------- */
function opts(q){ return [q.ok, ...q.d]; } // índice 0 = correcta
function show(){
  const it = state.list[state.i], q = it.q, n = state.list.length;
  state.answered = it.pick !== null;
  const all = opts(q);
  app.innerHTML = `
  <div class="meta"><span>Pregunta <b>${state.i+1}</b> de ${n}</span>
    <span class="tag">Nº ${q.n}</span>
    <span class="tag">${TEMAS[q.tema].split(' ')[0]}</span>
    <span class="tag ${q.dif==='D'?'d':''}">${q.dif==='D'?'Difícil':'Media'}</span>
    <span class="score">Aciertos: ${state.ok}</span></div>
  <div class="bar"><i style="width:${(state.i)/n*100}%"></i></div>
  <div class="card">
    ${q.img ? `<figure><img src="${IMGS[q.img]}" alt="Esquema: ${esc(q.cap)}" id="fig"><figcaption>${esc(q.cap)}</figcaption></figure>` : ''}
    <div class="qtext"><span class="qn">${q.n}.</span> ${esc(q.q)}</div>
    <div class="opts">${it.order.map((o,k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(all[o])}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
  const f = document.getElementById('fig'); if (f) f.onclick = () => openZoom(f.src);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  if (state.answered) paint();
  window.scrollTo({ top: 0 });
}
function answer(k){
  if (state.answered) return;
  const it = state.list[state.i];
  it.pick = k; state.answered = true;
  if (it.order[k] === 0) state.ok++;
  paint();
  const nb = document.getElementById('next'); if (nb) nb.focus({ preventScroll: true });
}
function paint(){
  const it = state.list[state.i], q = it.q;
  const good = it.order[it.pick] === 0;
  app.querySelectorAll('.opt').forEach(b => {
    const k = +b.dataset.k; b.disabled = true;
    if (it.order[k] === 0) b.classList.add('right');
    else if (k === it.pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const okLetter = 'ABCD'[it.order.indexOf(0)];
  const last = state.i === state.list.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="verdict ${good?'ok':'ko'}">${good ? '✔ ¡Correcto!' : `✘ No es correcta. La buena es la ${okLetter}.`}</div>
    <div class="box why"><span class="lbl">¿POR QUÉ?</span>${esc(q.j)}</div>
    <div class="hint">Lo tienes en: ${esc(q.t)}</div>
    <div class="nav"><button class="go" id="next">${last ? 'Ver resultado' : 'Siguiente →'}</button></div>`;
  document.getElementById('next').onclick = next;
  document.querySelector('.score').textContent = `Aciertos: ${state.ok}`;
}
function next(){
  if (state.i < state.list.length - 1) { state.i++; show(); } else result();
}

/* ---------- resultado ---------- */
function result(){
  state.screen = 'end';
  const n = state.list.length, nota = (state.ok / n * 10);
  const fails = state.list.filter(it => it.order[it.pick] !== 0);
  const msg = nota >= 9 ? '¡Muy bien! Lo dominas.' : nota >= 7 ? 'Bien. Repasa los fallos.' : nota >= 5 ? 'Aprobado justo: repasa los fallos con los apuntes.' : 'Toca repasar. Mira los fallos y vuelve a intentarlo.';
  app.innerHTML = `
  <h1>Resultado</h1>
  <div class="card" style="text-align:center">
    <p class="big">${state.ok} / ${n}</p>
    <p style="margin:4px 0 0">Nota: <b>${nota.toFixed(1).replace('.',',')}</b> · ${msg}</p>
  </div>
  ${fails.length ? `<div class="card"><h2 style="margin:0 0 4px;font-size:20px">Tus fallos (${fails.length})</h2>
    ${fails.map(it => { const a = opts(it.q); return `<div class="review">
      <div class="rq">${it.q.n}. ${esc(it.q.q)}${it.q.img ? ` <span class="cnt">(${esc(it.q.cap.split('. ')[0])})</span>` : ''}</div>
      <div class="ry">Tu respuesta: ${esc(a[it.order[it.pick]])}</div>
      <div class="ra">Correcta: ${esc(a[0])}</div>
      <div class="cnt">${esc(it.q.j)} · ${esc(it.q.t)}</div></div>`; }).join('')}
  </div>` : ''}
  <div class="nav" style="justify-content:center">
    ${fails.length ? '<button class="go ghost" id="redo">Repetir solo los fallos</button>' : ''}
    <button class="go" id="again">Nuevo test</button>
  </div>`;
  document.getElementById('again').onclick = start;
  const r = document.getElementById('redo');
  if (r) r.onclick = () => { const mix = state.mix; state = { screen: 'q', mix, list: (mix ? shuffle(fails) : fails).map(it => ({ q: it.q, order: mix ? shuffle([0,1,2,3]) : it.q.o.slice(), pick: null })), i: 0, ok: 0, answered: false }; show(); };
  window.scrollTo({ top: 0 });
}
start();
</script>
</body>
