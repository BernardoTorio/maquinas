<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test intermedio · Máquinas Eléctricas 2MB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --card:#ffffff; --ink:#1a1a1a; --muted:#56606b; --line:#cfd6de; --bar:#6A9A1F;
  --green:#1F4E79; --green-soft:#e3ecf6; --red:#c0392b; --red-soft:#fbe4e1;
  --ok:#2e7d32; --ok-soft:#e3f3e4; --yellow:#b7860b; --yellow-soft:#fdf5dc;
  --blue:#1f5fbf; --btn:#e9eef3; --on-green:#fff; --shadow:0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#15191e; --card:#1f252c; --ink:#eef1f4; --muted:#a9b3bd; --line:#36404b; --bar:#6A9A1F;
  --green:#8EC1F0; --green-soft:#26323f; --red:#ef6b5d; --red-soft:#3a201d;
  --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
  --blue:#7aa7f0; --btn:#26323f; --on-green:#0f1a26; --shadow:0 1px 3px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191e; --card:#1f252c; --ink:#eef1f4; --muted:#a9b3bd; --line:#36404b; --bar:#6A9A1F;
    --green:#8EC1F0; --green-soft:#26323f; --red:#ef6b5d; --red-soft:#3a201d;
    --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
    --blue:#7aa7f0; --btn:#26323f; --on-green:#0f1a26; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:17px;line-height:1.45}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--bar);position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}
.back{border:1px solid var(--line);background:var(--btn);color:var(--ink);padding:6px 12px;border-radius:8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.back:hover{border-color:var(--green)}
.crumbs{font-size:14px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--green);text-decoration:none}
.crumbs b{color:var(--ink)}
.theme{border:1px solid var(--line);background:var(--btn);color:var(--ink);width:38px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:26px;margin:6px 0 2px;font-weight:700}
h1 span{color:var(--green)}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.box{border-left:5px solid var(--green);background:var(--green-soft);border-radius:8px;padding:10px 14px;margin:12px 0}
.box .lbl{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--green);display:block;margin-bottom:2px}
.box.why{border-color:var(--yellow);background:var(--yellow-soft)}
.box.why .lbl{color:var(--yellow)}
fieldset{border:none;padding:0;margin:0 0 14px}
legend{font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip>span{display:inline-block;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--btn);cursor:pointer;font-size:15px;user-select:none}
.chip input:checked+span{border-color:var(--green);background:var(--green-soft);font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
.cnt{color:var(--muted);font-size:13px}
.go{background:var(--green);color:var(--on-green);border:none;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.go.ghost{background:var(--btn);color:var(--ink);border:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--btn)}
.tag.d{border-color:var(--red);color:var(--red)}
.score{margin-left:auto;font-weight:700;color:var(--ink)}
.qtext{font-size:19px;font-weight:700;margin:6px 0 12px}
.qn{color:var(--green)}
figure{margin:0 0 12px;text-align:center}
figure img{max-width:100%;max-height:520px;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line);cursor:zoom-in}
figcaption{font-size:14px;color:var(--muted);font-style:italic;margin-top:4px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--btn);font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.verdict{font-weight:700;font-size:18px;margin-top:12px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--red)}
.nav{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.big{font-size:44px;font-weight:700;color:var(--green);margin:0}
.review{border-top:1px solid var(--line);padding:12px 0}
.review .rq{font-weight:700}
.review .ra{color:var(--ok);font-weight:700}
.review .ry{color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:16px}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px;padding:8px}
@media (max-width:560px){body{font-size:16px}.qtext{font-size:17px}h1{font-size:22px}.crumbs{font-size:12px}}
</style>
</head>

el número total de líneas", "El campo es la zona donde se notan fuerzas"], "j": "El flujo se mide en weber (Wb). En tesla se mide la inducción.", "img": null, "cap": "", "n": 5, "o": [0, 3, 1, 2]}, {"tema": "T1", "t": "T1 · punto 1.2 Campo magnético y flujo magnético", "dif": "M", "tipo": "CON", "q": "Ponemos dos imanes con polos distintos enfrentados (N frente a S). ¿Cómo van las líneas entre ellos?", "ok": "Pasan de un imán al otro", "d": ["Se apartan unas de otras", "Se cruzan en el centro", "No hay líneas entre ellos"], "j": "Polos distintos se atraen: las líneas salen del N de uno y entran por el S del otro.", "img": null, "cap": "", "n": 6, "o": [0, 1, 3, 2]}, {"tema": "T1", "t": "T1 · punto 1.3 Inducción magnética", "dif": "M", "tipo": "CON", "q": "¿Qué otro nombre tiene la inducción magnética?", "ok": "Densidad de flujo", "d": ["Fuerza magnetomotriz", "Intensidad de campo", "Reluctancia"], "j": "Nos dice lo concentrado que está el campo: por eso se llama también densidad de flujo.", "img": null, "cap": "", "n": 7, "o": [1, 3, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.3 Inducción magnética", "dif": "M", "tipo": "CON", "q": "Un núcleo de chapa de grano no orientado (admite unos 1 T) trabaja a 1,2 T. ¿Qué pasa?", "ok": "Se satura: se calienta y zumba", "d": ["Funciona mejor que a 1 T", "Nada, mientras no pase de 2 tesla", "Baja la tensión del secundario"], "j": "Si se pasa de lo que admite la chapa, el hierro se satura: se calienta, zumba y la corriente se dispara.", "img": null, "cap": "", "n": 8, "o": [1, 2, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.3 Inducción magnética", "dif": "M", "tipo": "CON", "q": "¿Qué chapa da mejor rendimiento a la máquina?", "ok": "La que admite más inducción", "d": ["La más barata", "La de grano no orientado, de 1 T", "La más gruesa"], "j": "Cuanta más inducción admite la chapa, mejor rendimiento, aunque es más cara.", "img": null, "cap": "", "n": 9, "o": [1, 3, 0, 2]}, {"tema": "T1", "t": "T1 · punto 1.3 Inducción magnética", "dif": "M", "tipo": "CON", "q": "Con la misma lluvia, un cubo más grande recoge más agua. En un núcleo, eso quiere decir…", "ok": "Más sección, más flujo", "d": ["Más sección, más inducción", "Más sección, menos flujo", "Menos sección, más flujo"], "j": "Con la misma inducción, un núcleo de más sección lleva más flujo.", "img": null, "cap": "", "n": 10, "o": [3, 1, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.4 Intensidad de campo y fuerza magnetomotriz", "dif": "M", "tipo": "CON", "q": "Bobina A: 100 espiras y 1 A. Bobina B: 50 espiras y 2 A. ¿Cuál tiene más fuerza magnetomotriz?", "ok": "Las dos igual", "d": ["La A, porque tiene más espiras", "La B, porque lleva más corriente", "Ninguna: depende del núcleo"], "j": "Se consigue lo mismo con muchas espiras y poca corriente o con pocas espiras y más corriente.", "img": null, "cap": "", "n": 11, "o": [3, 1, 0, 2]}, {"tema": "T1", "t": "T1 · punto 1.4 Intensidad de campo y fuerza magnetomotriz", "dif": "M", "tipo": "CON", "q": "Al rebobinar un trafo, pones en el primario menos espiras de las originales. ¿Qué pasa?", "ok": "Se satura y se calienta", "d": ["Va más frío y da menos tensión", "Funciona igual", "Gasta menos corriente en vacío"], "j": "Con menos espiras a la misma tensión, el flujo sube, el hierro se satura, la corriente se dispara y se calienta.", "img": null, "cap": "", "n": 12, "o": [0, 3, 1, 2]}, {"tema": "T1", "t": "T1 · punto 1.4 Intensidad de campo y fuerza magnetomotriz", "dif": "M", "tipo": "CON", "q": "¿Y si pones en el primario más espiras de las originales?", "ok": "Baja el flujo", "d": ["Se satura", "Se quema enseguida", "Sube mucho la corriente"], "j": "Con más espiras, el flujo baja. Por eso hay que respetar siempre el número de espiras.", "img": null, "cap": "", "n": 13, "o": [1, 2, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.4 Intensidad de campo y fuerza magnetomotriz", "dif": "M", "tipo": "CON", "q": "En los apuntes, la fuerza magnetomotriz se parece, en un circuito eléctrico, a…", "ok": "La tensión de una pila", "d": ["La resistencia de un cable", "La potencia de una lámpara", "La corriente"], "j": "Igual que la pila empuja a la corriente, la f.m.m. empuja a las líneas de fuerza.", "img": null, "cap": "", "n": 14, "o": [2, 3, 1, 0]}, {"tema": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "M", "tipo": "CON", "q": "En un circuito magnético, ¿qué hace el núcleo de hierro?", "ok": "Conduce y guía el flujo", "d": ["Crea la fuerza magnetomotriz", "Frena el flujo, como el aire", "Aísla la bobina"], "j": "La bobina crea la f.m.m.; el núcleo conduce y guía el flujo, como el cable a la corriente.", "img": null, "cap": "", "n": 15, "o": [2, 1, 0, 3]}, {"tema": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "M", "tipo": "CON", "q": "¿Por qué las chapas de un núcleo deben ir bien apretadas y sin huecos?", "ok": "El aire frena mucho el flujo magnético", "d": ["Para que no se oxiden", "Para que pesen menos", "Para que no haga falta barnizarlas"], "j": "Un milímetro de aire «gasta» más que muchos centímetros de hierro.", "img": null, "cap": "", "n": 16, "o": [0, 3, 1, 2]}, {"tema": "T1", "t": "T1 · punto 1.5 Circuito magnético básico", "dif": "M", "tipo": "CON", "q": "La reluctancia de un circuito magnético es como, en un circuito eléctrico,…", "ok": "La resistencia", "d": ["La pila", "El cable de cobre", "La corriente"], "j": "Es la dificultad que pone un material al paso del flujo. El hierro tiene muy poca y el aire, muchísima.", "img": null, "cap": "", "n": 17, "o": [3, 1, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "En una bobina, con la regla de la mano derecha, ¿qué señala el pulgar?", "ok": "El polo norte", "d": ["El polo sur", "El sentido de la corriente", "La fuerza"], "j": "En la bobina, los dedos siguen la corriente por las espiras y el pulgar señala el polo N.", "img": null, "cap": "", "n": 18, "o": [3, 0, 2, 1]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "En un dibujo, ¿qué significa ⊙ sobre un cable?", "ok": "Que sale del papel", "d": ["Que entra en el papel", "Que el cable no tiene corriente", "Que ahí hay un polo sur"], "j": "⊙: ves la punta de la flecha, la corriente sale hacia ti. ⊗: ves la cola, entra en el papel.", "img": null, "cap": "", "n": 19, "o": [1, 0, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.6 1ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "El secundario de un trafo tiene dos bobinas en serie, y una se conecta al revés (principio por final). ¿Qué pasa con su tensión?", "ok": "Se resta de la otra en vez de sumarse", "d": ["Se suma igual", "Se duplica", "No cambia nada"], "j": "Invertir principio y final de una bobina invierte su polaridad.", "img": null, "cap": "", "n": 20, "o": [0, 3, 1, 2]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "¿Qué mano se usa para saber el sentido de la fuerza sobre un conductor con corriente?", "ok": "La izquierda", "d": ["La derecha, como en la bobina", "Las dos", "Ninguna"], "j": "Regla de la mano izquierda (Fleming): índice → campo, corazón → corriente, pulgar → fuerza.", "img": null, "cap": "", "n": 21, "o": [1, 2, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "La fuerza sobre un conductor dentro de un imán es mayor si…", "ok": "Pasa más corriente", "d": ["El cable es más grueso", "El imán está más lejos", "Hay menos trozo dentro del campo"], "j": "Es mayor cuanto más campo, más corriente y más largo es el trozo de cable dentro del campo.", "img": null, "cap": "", "n": 22, "o": [3, 1, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.7 2ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "Un conductor con corriente está dentro de un imán. Si invertimos el sentido de la corriente, ¿qué pasa con la fuerza?", "ok": "Cambia de sentido", "d": ["Se hace el doble de grande", "Desaparece", "Sigue en el mismo sentido"], "j": "Mano izquierda: si la corriente (dedo corazón) cambia de sentido, la fuerza (pulgar) también cambia.", "img": null, "cap": "", "n": 23, "o": [0, 2, 3, 1]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "¿Cuál es la palabra clave de la 3ª ley del electromagnetismo?", "ok": "Varía", "d": ["Corriente", "Imán", "Hierro"], "j": "Si el flujo no varía, no se induce nada.", "img": null, "cap": "", "n": 24, "o": [1, 3, 2, 0]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "¿Qué mano se usa para saber el sentido de la corriente inducida (3ª ley)?", "ok": "La derecha", "d": ["La izquierda, como en la 2ª ley", "Las dos", "Ninguna"], "j": "Mano derecha: pulgar → movimiento, índice → campo, corazón → corriente inducida.", "img": null, "cap": "", "n": 25, "o": [3, 1, 0, 2]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "En un trafo, ¿qué pasaría en el secundario si el flujo del núcleo no cambiara?", "ok": "No se induciría ninguna tensión en él", "d": ["Daría el doble de tensión", "Daría la misma tensión", "Daría tensión continua"], "j": "La palabra clave de la 3ª ley es VARÍA: si el flujo no cambia, no se induce nada.", "img": null, "cap": "", "n": 26, "o": [3, 0, 2, 1]}, {"tema": "T1", "t": "T1 · punto 1.8 3ª ley del electromagnetismo", "dif": "M", "tipo": "CON", "q": "¿Cómo se induce tensión en el secundario de un trafo?", "ok": "Variando la corriente alterna del primario", "d": ["Moviendo el secundario", "Girando el núcleo", "Con un imán que entra y sale del núcleo"], "j": "La corriente alterna del primario cambia sin parar: el flujo varía sin mover nada.", "img": null, "cap": "", "n": 27, "o": [2, 0, 3, 1]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "M", "tipo": "CON", "q": "¿Cuál de estos materiales es ferromagnético?", "ok": "El níquel", "d": ["El cobre", "El aluminio", "La plata"], "j": "Ferromagnéticos: hierro, níquel, cobalto y acero al silicio.", "img": null, "cap": "", "n": 28, "o": [3, 1, 0, 2]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "M", "tipo": "CON", "q": "En la curva de magnetización, ¿qué pasa en la zona lineal?", "ok": "Con poco H, B sube mucho", "d": ["Aunque H suba mucho, B no sube", "B baja al subir H", "B y H no cambian"], "j": "Lo segundo es la saturación: aunque H suba mucho, B casi no sube.", "img": null, "cap": "", "n": 29, "o": [2, 1, 0, 3]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "M", "tipo": "CON", "q": "¿Por qué las máquinas no trabajan en plena saturación?", "ok": "La corriente se dispara y el núcleo se calienta mucho", "d": ["La tensión baja a cero", "Se pierde el magnetismo del hierro para siempre", "El flujo cambia de sentido"], "j": "Se diseñan para trabajar en el codo, cerca de la saturación pero sin llegar.", "img": null, "cap": "", "n": 30, "o": [3, 0, 2, 1]}, {"tema": "T1", "t": "T1 · punto 1.9 Materiales magnéticos y curva de magnetización", "dif": "M", "tipo": "CON", "q": "¿Por qué los núcleos se hacen de hierro y no de aire?", "ok": "Con hierro, mucho más flujo", "d": ["El aire se satura antes", "El hierro pesa menos", "El aire conduce la corriente eléctrica"], "j": "La curva del aire es una recta pegada al eje: con mucha H da muy poca B.", "img": null, "cap": "", "n": 31, "o": [2, 1, 0, 3]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "M", "tipo": "CON", "q": "¿Por qué la histéresis calienta el núcleo?", "ok": "A los «imanes» internos les cuesta girar en cada ciclo", "d": ["Porque la bobina está en contacto con el núcleo", "Porque el flujo no varía", "Porque el núcleo es de aire"], "j": "En cada ciclo se pierde energía que se convierte en calor.", "img": null, "cap": "", "n": 32, "o": [1, 2, 3, 0]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "M", "tipo": "CON", "q": "¿Qué material va mejor para fabricar un imán permanente?", "ok": "Uno duro", "d": ["Uno blando: ciclo estrecho", "Uno sin histéresis", "El cobre puro"], "j": "Los duros tienen campo coercitivo grande: no se desimanan con facilidad.", "img": null, "cap": "", "n": 33, "o": [3, 2, 1, 0]}, {"tema": "T1", "t": "T1 · punto 1.10 Histéresis magnética", "dif": "M", "tipo": "CON", "q": "Si el ciclo de histéresis es más ancho, ¿qué pasa con las pérdidas?", "ok": "Aumentan", "d": ["Disminuyen", "No cambian", "Desaparecen"], "j": "La energía perdida es mayor cuanto mayor es el área del ciclo.", "img": null, "cap": "", "n": 34, "o": [2, 3, 0, 1]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "M", "tipo": "CON", "q": "Las chapas de un núcleo pierden el barniz y se tocan entre ellas. ¿Qué pasa?", "ok": "Suben las corrientes de Foucault", "d": ["El flujo pasa mejor y rinde más", "Nada: el barniz solo protege del óxido", "Da más tensión en el secundario"], "j": "Si las chapas se tocan, es como si fueran un bloque macizo.", "img": null, "cap": "", "n": 35, "o": [3, 2, 1, 0]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "M", "tipo": "CON", "q": "¿Para qué sirve el silicio que lleva la chapa?", "ok": "Sube la resistencia eléctrica del hierro", "d": ["Hace que el hierro conduzca mejor", "Aísla las chapas", "Pega las chapas entre sí"], "j": "Con más resistencia, las corrientes de Foucault son más pequeñas.", "img": null, "cap": "", "n": 36, "o": [0, 1, 2, 3]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "M", "tipo": "CON", "q": "¿Por qué los tornillos pasantes del núcleo llevan un manguito aislante?", "ok": "Para que los tornillos no unan las chapas entre sí", "d": ["Para que no se aflojen", "Para que no se oxiden", "Para que el flujo no pase por el tornillo"], "j": "Un tornillo desnudo uniría todas las chapas como un bloque.", "img": null, "cap": "", "n": 37, "o": [3, 2, 0, 1]}, {"tema": "T1", "t": "T1 · punto 1.11 Corrientes parásitas (de Foucault)", "dif": "M", "tipo": "CON", "q": "¿Dónde se aprovechan a propósito las corrientes de Foucault?", "ok": "En la cocina de inducción", "d": ["En el núcleo del trafo", "En los imanes de neodimio", "En el devanado secundario"], "j": "También en frenos de camiones y trenes y en detectores de metales.", "img": null, "cap": "", "n": 38, "o": [3, 0, 2, 1]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "M", "tipo": "CON", "q": "Un trafo tiene 500 espiras en el primario y 50 en el secundario. Con 230 V en el primario, ¿cuánto da?", "ok": "23 V", "d": ["2300 V", "230 V", "50 V"], "j": "El secundario tiene 10 veces menos espiras: da 10 veces menos tensión.", "img": null, "cap": "", "n": 39, "o": [1, 2, 3, 0]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "M", "tipo": "CON", "q": "En un trafo de 230 / 12 V, ¿qué devanado tiene el hilo más grueso?", "ok": "El de 12 V", "d": ["El de 230 V", "Los dos igual", "El que tenga más espiras"], "j": "El devanado de menor tensión lleva más corriente: hilo más grueso.", "img": null, "cap": "", "n": 40, "o": [1, 3, 2, 0]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "M", "tipo": "CON", "q": "¿Qué pérdidas tiene un trafo real?", "ok": "En el cobre, en el hierro y por el flujo de dispersión", "d": ["Solo en el cobre", "Solo en el hierro", "Ninguna: un trafo bien hecho rinde el 100 %"], "j": "Cobre (resistencia), hierro (histéresis y Foucault) y flujo de dispersión.", "img": null, "cap": "", "n": 41, "o": [3, 2, 0, 1]}, {"tema": "T3", "t": "T3 · punto 3.12 Principio de funcionamiento del transformador", "dif": "M", "tipo": "CON", "q": "En un trafo, el primario y el secundario…", "ok": "No están unidos eléctricamente: los une el flujo", "d": ["Están unidos por un cable por dentro", "Comparten el mismo hilo", "Están en cortocircuito"], "j": "La energía pasa «a través del hierro», con el flujo.", "img": null, "cap": "", "n": 42, "o": [1, 2, 3, 0]}, {"tema": "T3", "t": "T3 · punto 3.13 Terminales homólogos", "dif": "M", "tipo": "CON", "q": "Un trafo tiene 4 bobinas de 50 V en el secundario, bien conectadas. ¿Qué marca el voltímetro?", "ok": "200 V", "d": ["50 V", "100 V", "150 V"], "j": "Homólogo de una con no homólogo de la siguiente: las tensiones se suman, 4 × 50 = 200 V.", "img": null, "cap": "", "n": 43, "o": [0, 2, 1, 3]}, {"tema": "T3", "t": "T3 · punto 3.13 Terminales homólogos", "dif": "M", "tipo": "CON", "q": "Dos bobinas de 12 V se unen por sus bornes homólogos. ¿Qué marca el voltímetro en los extremos?", "ok": "Casi 0 V", "d": ["24 V", "12 V", "6 V"], "j": "Unidas por los homólogos, sus tensiones se oponen y se anulan.", "img": null, "cap": "", "n": 44, "o": [2, 0, 1, 3]}, {"tema": "T3", "t": "T3 · punto 3.13 Terminales homólogos", "dif": "M", "tipo": "CON", "q": "Al construir un trafo, das la vuelta a una de sus bobinas. ¿Qué cambia?", "ok": "Sus homólogos", "d": ["Su número de espiras y su tensión", "Su resistencia", "Su aislamiento"], "j": "Los homólogos dependen del sentido en que se enrolla cada bobina.", "img": null, "cap": "", "n": 45, "o": [1, 3, 0, 2]}, {"tema": "T3", "t": "T3 · punto 3.14 Tipos de transformadores", "dif": "M", "tipo": "CON", "q": "¿Qué trafo es un autotransformador regulable?", "ok": "El variac", "d": ["El toroidal", "El acorazado", "El de columnas"], "j": "Una escobilla móvil permite variar la tensión.", "img": null, "cap": "", "n": 46, "o": [0, 2, 1, 3]}, {"tema": "T3", "t": "T3 · punto 3.14 Tipos de transformadores", "dif": "M", "tipo": "CON", "q": "¿Se puede usar un trafo reductor como elevador?", "ok": "Sí: todos los trafos son reversibles", "d": ["No: solo funciona en un sentido", "Solo si es trifásico", "Solo si es toroidal"], "j": "Todos los transformadores son reversibles.", "img": null, "cap": "", "n": 47, "o": [0, 1, 2, 3]}, {"tema": "T3", "t": "T3 · punto 3.14 Tipos de transformadores", "dif": "M", "tipo": "CON", "q": "¿Cuántas bobinas lleva el primario de un trafo trifásico?", "ok": "Tres", "d": ["Una sola, común", "Dos, como el monofásico", "Seis, dos por fase"], "j": "3 bobinas en el primario y 3 en el secundario, una por fase.", "img": null, "cap": "", "n": 48, "o": [1, 0, 2, 3]}, {"tema": "T3", "t": "T3 · punto 3.15 Ensayo de vacío", "dif": "M", "tipo": "CON", "q": "Ensayo de vacío: 230 V en el primario y 115 V en el secundario. ¿Qué relación de transformación tiene?", "ok": "2", "d": ["0,5", "115", "345"], "j": "Se divide la tensión del primario entre la del secundario: 230 / 115 = 2.", "img": null, "cap": "", "n": 49, "o": [2, 1, 3, 0]}, {"tema": "T3", "t": "T3 · punto 3.15 Ensayo de vacío", "dif": "M", "tipo": "CON", "q": "En vacío, un trafo zumba y se calienta sin carga. ¿Qué revisas?", "ok": "Chapas, tornillos y barniz", "d": ["La sección del hilo y las soldaduras", "La lámpara", "El megger"], "j": "Apriete de las chapas, tornillos aislados y barniz. La sección del hilo se revisa si salen altas las pérdidas en el cobre.", "img": null, "cap": "", "n": 50, "o": [3, 0, 1, 2]}, {"tema": "T3", "t": "T3 · punto 3.15 Ensayo de vacío", "dif": "M", "tipo": "CON", "q": "¿Por qué en el ensayo de vacío casi no hay pérdidas en el cobre?", "ok": "Casi no circula corriente", "d": ["El cobre no tiene resistencia", "La tensión es muy baja", "El hierro las absorbe"], "j": "Por eso el vatímetro marca casi solo las pérdidas en el hierro.", "img": null, "cap": "", "n": 51, "o": [2, 3, 0, 1]}, {"tema": "T3", "t": "T3 · punto 3.15 Ensayo de vacío", "dif": "M", "tipo": "CON", "q": "¿Cómo debe ser la corriente de vacío de un trafo bien hecho?", "ok": "Pequeña", "d": ["Igual a la nominal", "El doble de la nominal", "Cero exacto"], "j": "Si es grande: núcleo mal armado, chapas en contacto o pocas espiras en el primario.", "img": null, "cap": "", "n": 52, "o": [1, 0, 2, 3]}, {"tema": "T3", "t": "T3 · punto 3.16 Ensayo de cortocircuito", "dif": "M", "tipo": "CON", "q": "En el ensayo de cortocircuito, ¿por qué se empieza con la tensión a cero y se sube despacio?", "ok": "Para no pasarse de la corriente nominal y quemarlo", "d": ["Para que el núcleo se vaya saturando poco a poco", "Para medir las pérdidas en el hierro", "Para que el megger pueda medir"], "j": "Se sube despacio mirando el amperímetro hasta que pasa la corriente nominal.", "img": null, "cap": "", "n": 53, "o": [2, 0, 3, 1]}, {"tema": "T3", "t": "T3 · punto 3.16 Ensayo de cortocircuito", "dif": "M", "tipo": "CON", "q": "En el ensayo de cortocircuito, ¿cómo es la tensión que hay que dar al primario?", "ok": "Muy pequeña comparada con la tensión nominal del trafo", "d": ["Igual a la nominal", "El doble de la nominal", "Un poco más alta que la nominal, para compensar"], "j": "Es la tensión de cortocircuito: muy pequeña comparada con la nominal.", "img": null, "cap": "", "n": 54, "o": [2, 3, 0, 1]}, {"tema": "T3", "t": "T3 · punto 3.16 Ensayo de cortocircuito", "dif": "M", "tipo": "CON", "q": "Dos trafos de la misma potencia: uno tiene más tensión de cortocircuito que el otro. Con carga, en el primero…", "ok": "La tensión baja más", "d": ["La tensión baja menos", "La tensión sube", "No cambia nada"], "j": "Cuanto mayor es la tensión de cortocircuito, más baja la tensión del secundario con carga.", "img": null, "cap": "", "n": 55, "o": [1, 0, 2, 3]}, {"tema": "T3", "t": "T3 · punto 3.16 Ensayo de cortocircuito", "dif": "M", "tipo": "CON", "q": "En el ensayo de cortocircuito, el secundario está en corto. ¿Por qué no se quema el trafo?", "ok": "Le damos muy poca tensión", "d": ["Porque el secundario no lleva corriente", "Porque el núcleo frena la corriente", "Porque se hace en vacío"], "j": "Solo se sube hasta la corriente nominal.", "img": null, "cap": "", "n": 56, "o": [2, 3, 0, 1]}, {"tema": "T3", "t": "T3 · punto 3.17 Ensayo en carga", "dif": "M", "tipo": "CON", "q": "En el ensayo en carga, el primario absorbe 100 W y el secundario entrega 90 W. ¿Qué rendimiento tiene?", "ok": "90 %", "d": ["10 %", "110 %", "100 %"], "j": "Lo que entrega el secundario entre lo que absorbe el primario: 90 / 100.", "img": null, "cap": "", "n": 57, "o": [1, 0, 2, 3]}, {"tema": "T3", "t": "T3 · punto 3.17 Ensayo en carga", "dif": "M", "tipo": "CON", "q": "A plena carga, el trafo se calienta muy rápido. ¿Qué puede ser?", "ok": "Hilo demasiado fino", "d": ["Demasiadas chapas", "El megger mal conectado", "Poca carga"], "j": "Sección de hilo insuficiente, mala impregnación o mala ventilación.", "img": null, "cap": "", "n": 58, "o": [2, 1, 0, 3]}, {"tema": "T3", "t": "T3 · punto 3.17 Ensayo en carga", "dif": "M", "tipo": "CON", "q": "¿Por qué el rendimiento sale siempre algo menor del 100 %?", "ok": "Por las pérdidas", "d": ["Porque la carga es pequeña", "Porque el trafo es reductor", "Porque el secundario tiene menos espiras"], "j": "Siempre hay pérdidas en el cobre y en el hierro.", "img": null, "cap": "", "n": 59, "o": [2, 3, 1, 0]}, {"tema": "T3", "t": "T3 · punto 3.18 Pruebas de aislamiento", "dif": "M", "tipo": "CON", "q": "El megger marca cientos de MΩ entre los devanados. ¿Cómo está el aislamiento?", "ok": "Bien", "d": ["Roto", "Con humedad", "En cortocircuito"], "j": "Valores muy altos y estables (cientos de MΩ o más): el aislamiento está bien.", "img": null, "cap": "", "n": 60, "o": [0, 2, 3, 1]}, {"tema": "T3", "t": "T3 · punto 3.18 Pruebas de aislamiento", "dif": "M", "tipo": "CON", "q": "¿Qué tensión pusimos en el megger para medir el aislamiento en la práctica?", "ok": "Continua de 500 V", "d": ["Alterna de 230 V", "Continua de 9 V, como el polímetro", "Alterna de 50 Hz a 12 V"], "j": "Aplica una tensión continua alta (250, 500 o 1000 V).", "img": null, "cap": "", "n": 61, "o": [0, 2, 1, 3]}, {"tema": "T3", "t": "T3 · punto 3.18 Pruebas de aislamiento", "dif": "M", "tipo": "CON", "q": "¿Entre qué puntos se mide el aislamiento de un trafo?", "ok": "Entre d const TEMAS = {T1:"T1 Electromagnetismo",T3:"T3 Transformadores",P1:"P1 Práctica 1"};
const TIPO = {CON:"Concepto",UNI:"Unidades",QPS:"Qué pasa si…",APL:"En la máquina real"};
const app = document.getElementById('app');

/* ---------- tema claro/oscuro ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem('maq-tema'); if (t) root.dataset.theme = t; } catch(e) {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('maq-tema', root.dataset.theme); } catch(e) {}
};

/* ---------- zoom de esquemas ---------- */
const zoom = document.getElementById('zoom');
zoom.onclick = () => zoom.style.display = 'none';
function openZoom(src){ zoom.querySelector('img').src = src; zoom.style.display = 'flex'; }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (zoom.style.display === 'flex') { zoom.style.display = 'none'; return; }
    location.href = 'index.html#tests'; return;
  }
  if (e.key === 'Backspace' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    location.href = 'index.html#tests'; return;
  }
  if (state.screen !== 'q') return;
  const k = e.key.toLowerCase();
  const idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (!state.answered && idx >= 0) { answer(idx); e.preventDefault(); }
  else if (state.answered && (e.key === 'Enter' || e.key === ' ')) { next(); e.preventDefault(); }
});

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let state = { screen: 'start' };

/* ---------- inicio ---------- */
function start(){
  state = { screen: 'start' };
  const cnt = t => DATA.filter(q => q.tema === t).length;
  app.innerHTML = `
  <h1>Test intermedio · <span>Temas 1 y 3 + Práctica 1</span></h1>
  <p class="sub">${DATA.length} preguntas, entre los de iniciación y el avanzado. Teoría (1-62), del 1.1 al 3.18 y en ese orden. Práctica 1 (63-100): qué le pasó a cada uno de nuestros trafos; <b>no hay que saberse números</b>: cuando hacen falta, están en la gráfica que sale con la pregunta (tócala para ampliarla).</p>
  <div class="card">
    <fieldset><legend>Bloques</legend><div class="chips">
      ${Object.keys(TEMAS).map(t => `<label class="chip"><input type="checkbox" name="tema" value="${t}" checked><span>${TEMAS[t]} <span class="cnt">(${cnt(t)})</span></span></label>`).join('')}
    </div></fieldset>
    <fieldset><legend>Dificultad</legend><div class="chips">
      <label class="chip"><input type="radio" name="dif" value="all" checked><span>Todas</span></label>
      <label class="chip"><input type="radio" name="dif" value="M"><span>Medias</span></label>
      <label class="chip"><input type="radio" name="dif" value="D"><span>Difíciles</span></label>
    </div></fieldset>
    <fieldset><legend>Orden</legend><div class="chips">
      <label class="chip"><input type="radio" name="ord" value="fix" checked><span>Por orden (1, 2, 3…)</span></label>
      <label class="chip"><input type="radio" name="ord" value="mix"><span>Mezcladas</span></label>
    </div></fieldset>
    <fieldset><legend>Número de preguntas</legend><div class="chips">
      ${[20,40,60].map((n,i) => `<label class="chip"><input type="radio" name="num" value="${n}" ${i===1?'checked':''}><span>${n}</span></label>`).join('')}
      <label class="chip"><input type="radio" name="num" value="0"><span>Todas</span></label>
    </div></fieldset>
    <p id="avail" class="cnt"></p>
    <button class="go" id="go">Empezar</button>
  </div>
  <div class="box"><span class="lbl">CÓMO FUNCIONA</span>
    Elige una respuesta tocándola (o con las teclas A, B, C, D). Aciertes o no, verás <b>por qué</b> es esa la respuesta.
    <b>Por orden</b>: las preguntas van del 1 al 100, en el orden de los puntos de los apuntes y de las preguntas de la práctica, con las mismas letras que el test en papel. <b>Mezcladas</b>: cambian el orden de las preguntas y de las respuestas cada vez.</div>`;
  const upd = () => {
    const pool = filtered();
    document.getElementById('avail').textContent = `Hay ${pool.length} preguntas con estos filtros.`;
    document.getElementById('go').disabled = pool.length === 0;
  };
  app.querySelectorAll('input').forEach(i => i.onchange = upd);
  upd();
  document.getElementById('go').onclick = () => {
    const n = +app.querySelector('input[name=num]:checked').value;
    const mix = app.querySelector('input[name=ord]:checked').value === 'mix';
    let pool = filtered();
    if (mix) pool = shuffle(pool);
    if (n) pool = pool.slice(0, n);
    state = { screen: 'q', mix, list: pool.map(q => ({ q, order: mix ? shuffle([0,1,2,3]) : q.o.slice(), pick: null })), i: 0, ok: 0, answered: false };
    show();
  };
}
function filtered(){
  const temas = [...app.querySelectorAll('input[name=tema]:checked')].map(i => i.value);
  const dif = app.querySelector('input[name=dif]:checked').value;
  return DATA.filter(q => temas.includes(q.tema) && (dif === 'all' || q.dif === dif));
}

/* ---------- pregunta ---------- */
function opts(q){ return [q.ok, ...q.d]; } // índice 0 = correcta
function show(){
  const it = state.list[state.i], q = it.q, n = state.list.length;
  state.answered = it.pick !== null;
  const all = opts(q);
  app.innerHTML = `
  <div class="meta"><span>Pregunta <b>${state.i+1}</b> de ${n}</span>
    <span class="tag">Nº ${q.n}</span>
    <span class="tag">${TEMAS[q.tema].split(' ')[0]}</span>
    <span class="tag ${q.dif==='D'?'d':''}">${q.dif==='D'?'Difícil':'Media'}</span>
    <span class="score">Aciertos: ${state.ok}</span></div>
  <div class="bar"><i style="width:${(state.i)/n*100}%"></i></div>
  <div class="card">
    ${q.img ? `<figure><img src="${IMGS[q.img]}" alt="Esquema: ${esc(q.cap)}" id="fig"><figcaption>${esc(q.cap)}</figcaption></figure>` : ''}
    <div class="qtext"><span class="qn">${q.n}.</span> ${esc(q.q)}</div>
    <div class="opts">${it.order.map((o,k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(all[o])}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
  const f = document.getElementById('fig'); if (f) f.onclick = () => openZoom(f.src);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  if (state.answered) paint();
  window.scrollTo({ top: 0 });
}
function answer(k){
  if (state.answered) return;
  const it = state.list[state.i];
  it.pick = k; state.answered = true;
  if (it.order[k] === 0) state.ok++;
  paint();
  const nb = document.getElementById('next'); if (nb) nb.focus({ preventScroll: true });
}
function paint(){
  const it = state.list[state.i], q = it.q;
  const good = it.order[it.pick] === 0;
  app.querySelectorAll('.opt').forEach(b => {
    const k = +b.dataset.k; b.disabled = true;
    if (it.order[k] === 0) b.classList.add('right');
    else if (k === it.pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const okLetter = 'ABCD'[it.order.indexOf(0)];
  const last = state.i === state.list.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="verdict ${good?'ok':'ko'}">${good ? '✔ ¡Correcto!' : `✘ No es correcta. La buena es la ${okLetter}.`}</div>
    <div class="box why"><span class="lbl">¿POR QUÉ?</span>${esc(q.j)}</div>
    <div class="hint">Lo tienes en: ${esc(q.t)}</div>
    <div class="nav"><button class="go" id="next">${last ? 'Ver resultado' : 'Siguiente →'}</button></div>`;
  document.getElementById('next').onclick = next;
  document.querySelector('.score').textContent = `Aciertos: ${state.ok}`;
}
function next(){
  if (state.i < state.list.length - 1) { state.i++; show(); } else result();
}

/* ---------- resultado ---------- */
function result(){
  state.screen = 'end';
  const n = state.list.length, nota = (state.ok / n * 10);
  const fails = state.list.filter(it => it.order[it.pick] !== 0);
  const msg = nota >= 9 ? '¡Muy bien! Lo dominas.' : nota >= 7 ? 'Bien. Repasa los fallos.' : nota >= 5 ? 'Aprobado justo: repasa los fallos con los apuntes.' : 'Toca repasar. Mira los fallos y vuelve a intentarlo.';
  app.innerHTML = `
  <h1>Resultado</h1>
  <div class="card" style="text-align:center">
    <p class="big">${state.ok} / ${n}</p>
    <p style="margin:4px 0 0">Nota: <b>${nota.toFixed(1).replace('.',',')}</b> · ${msg}</p>
  </div>
  ${fails.length ? `<div class="card"><h2 style="margin:0 0 4px;font-size:20px">Tus fallos (${fails.length})</h2>
    ${fails.map(it => { const a = opts(it.q); return `<div class="review">
      <div class="rq">${it.q.n}. ${esc(it.q.q)}${it.q.img ? ` <span class="cnt">(${esc(it.q.cap.split('. ')[0])})</span>` : ''}</div>
      <div class="ry">Tu respuesta: ${esc(a[it.order[it.pick]])}</div>
      <div class="ra">Correcta: ${esc(a[0])}</div>
      <div class="cnt">${esc(it.q.j)} · ${esc(it.q.t)}</div></div>`; }).join('')}
  </div>` : ''}
  <div class="nav" style="justify-content:center">
    ${fails.length ? '<button class="go ghost" id="redo">Repetir solo los fallos</button>' : ''}
    <button class="go" id="again">Nuevo test</button>
  </div>`;
  document.getElementById('again').onclick = start;
  const r = document.getElementById('redo');
  if (r) r.onclick = () => { const mix = state.mix; state = { screen: 'q', mix, list: (mix ? shuffle(fails) : fails).map(it => ({ q: it.q, order: mix ? shuffle([0,1,2,3]) : it.q.o.slice(), pick: null })), i: 0, ok: 0, answered: false }; show(); };
  window.scrollTo({ top: 0 });
}
start();
</script>
